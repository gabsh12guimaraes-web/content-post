<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<meta name="robots" content="noindex, nofollow">
<title>Content Post</title>
<link rel="icon" type="image/png" href="marca/content-post-icone.png">
<link rel="apple-touch-icon" href="marca/content-post-icone.png">
<meta property="og:image" content="marca/content-post-capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Playfair+Display:ital,wght@0,700;0,800;1,500;1,700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Identidade do admin da Easypeasy Pay: navy quase preto, cartões chapados com borda de 1px,
   acento vermelho-rosa em gradiente, Poppins + IBM Plex Mono, rótulos pequenos em caixa alta,
   etiquetas contornadas, menu lateral com trilho tracejado. Tema único escuro. */
:root {
  color-scheme: dark;
  --bg: #0A0C15;
  --card: #191B25;
  --card-soft: #15171F;
  --glow: #F8395A;
  --ink: #ffffff;
  --ink-body: #c8cad3;
  --ink-soft: #8A8D9C;
  --ink-faint: #5D6070;
  --glass: #191B25;
  --glass-red: #191B25;
  --line: #2A2C38;
  --line-strong: #353846;
  --red: #F8395A;
  --red-deep: #C8102E;
  --pink: #F8395A;
  --pink-soft: #FF8FA3;
  --orange: #FFB84D;
  --orange-deep: #F59E0B;
  --ok: #3EDDAE;
  --warn: #FFB84D;
  --info: #8A8D9C;
  --bad: #F8395A;
  --grad: linear-gradient(140deg, #FF5F7A, #F8395A 55%, #C8102E);
  --font-display: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
  --radius: 9px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(900px 520px at 18% -8%, rgba(190, 20, 32, 0.55), transparent 70%),
    radial-gradient(700px 600px at 92% 30%, rgba(120, 10, 20, 0.45), transparent 70%),
    radial-gradient(800px 500px at 40% 110%, rgba(140, 12, 24, 0.35), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 72px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* vidro: o material básico das superfícies */
.glass {
  background: linear-gradient(180deg, var(--glass-red), var(--glass));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}

/* topo */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: flex-end; }
.top + .track { margin-top: 18px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); letter-spacing: -0.01em; }
.top h1 span { display: block; color: var(--ink-faint); font-weight: 600; }
.top .sub { color: var(--ink-soft); margin-top: 10px; max-width: 52ch; }
.notice { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); padding: 7px 14px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.notice::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-faint); text-decoration: underline; font-size: 12px; }
.linkbtn:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* etapas = cartões em gradiente, como "Global Hits 50" */
.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
@media (max-width: 960px) { .track { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.track .t-marca { background: linear-gradient(160deg, #ff8a5c 0%, #ff4d3d 45%, #9e0f1c 100%); }
.track .t-marca[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 77, 61, 0.65); }
.track button {
  position: relative; overflow: hidden; border: 0; text-align: left; border-radius: var(--radius);
  padding: 16px 18px 18px; display: grid; gap: 6px; min-height: 148px; align-content: start;
  color: #fff; opacity: 0.72; transition: opacity .2s, transform .2s, box-shadow .2s;
}
.track button:hover { opacity: 0.92; }
.track button[aria-selected="true"] { opacity: 1; transform: translateY(-2px); }
.track .t-ideias { background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%); }
.track .t-cal { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.track .t-rev { background: linear-gradient(160deg, #ff4f8b 0%, #e0204f 45%, #8f0b2a 100%); }
.track .t-ideias[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 51, 71, 0.65); }
.track .t-cal[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 138, 30, 0.6); }
.track .t-rev[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(224, 32, 79, 0.65); }
.track button::after { /* reflexo de vidro */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 85% 110%, rgba(0, 0, 0, 0.28), transparent 60%), linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%);
}
.track .step { justify-self: start; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.22); }
.track .name { font-size: 18px; font-weight: 600; margin-top: 6px; }
.track .count { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.track .play { position: absolute; right: 16px; bottom: 16px; width: 0; height: 0; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; z-index: 1; }
@media (max-width: 640px) {
  .track { grid-template-columns: 1fr; gap: 12px; }
  .track button { min-height: 0; grid-template-columns: 1fr auto; align-items: center; }
  .track .step { grid-column: 1 / -1; }
  .track .count { font-size: 34px; grid-column: 2; grid-row: 2; }
  .track .play { display: none; }
}

.panel { margin-top: 28px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.panel-head > p { display: none; }
.panel-head:not(:has(> :not(p))) { display: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.filters button { border: 0; background: none; border-radius: 99px; padding: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); color: #fff; box-shadow: 0 6px 16px -6px rgba(255, 51, 71, 0.7); }

/* chips em pílula translúcida */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); color: var(--ink-soft); border: 1px solid var(--line); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.chip.plain::before { display: none; }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.chip.info { color: var(--info); }
.chip.bad { color: var(--bad); }
.chip.acc { color: var(--pink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

/* botões em pílula */
.btn { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.06); border-radius: 99px; padding: 9px 18px; font-weight: 500; font-size: 13px; color: #fff; transition: background .15s, box-shadow .15s; }
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn.primary { border-color: transparent; background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); box-shadow: 0 10px 24px -10px rgba(255, 51, 71, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn.primary:hover { background: linear-gradient(180deg, #ff6070, #d4142a); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-faint); }
.btn.quiet:hover { color: #fff; }

/* ideias */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .ideas { grid-template-columns: 1fr; } }
.idea { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
/* Cartões fora da tela não são diagramados até chegarem perto (listas longas ficam leves no celular). */
.idea { content-visibility: auto; contain-intrinsic-size: auto 320px; }
.mais-ideias { display: flex; justify-content: center; margin-top: 16px; }
.idea.dim { opacity: 0.5; }
.idea h3 { font-size: 17px; font-weight: 600; }
.idea p { margin: 0; color: var(--ink-soft); }
.idea .why { font-size: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
.idea .why b { color: #fff; font-weight: 600; }
.score { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.score .pill { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 12px; border-radius: 99px; background: linear-gradient(180deg, var(--orange), var(--orange-deep)); font-size: 12px; font-weight: 500; box-shadow: 0 6px 16px -8px rgba(255, 138, 30, 0.9); }
.score .pill strong { font-size: 15px; font-weight: 700; }
.score .pill.low { background: rgba(255, 255, 255, 0.1); box-shadow: none; color: var(--ink-soft); }
.bar { flex: 1; max-width: 120px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--orange)); }
.src { font-size: 11px; color: var(--ink-faint); overflow-wrap: anywhere; }
.reason { display: grid; gap: 8px; }
.reason input, textarea { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 10px 14px; color: #fff; }
.reason input::placeholder, textarea::placeholder { color: var(--ink-faint); }
.decided { font-size: 12px; color: var(--ink-soft); }
.decided b { color: #fff; }

/* calendário */
.cal { overflow: hidden; padding: 6px; }
.cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-week + .cal-week { margin-top: 6px; }
.day { min-height: 132px; padding: 10px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); display: grid; gap: 8px; align-content: start; min-width: 0; }
.day.past { opacity: 0.55; }
.day.today { background: rgba(255, 51, 71, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 51, 71, 0.5); }
.dlabel { font-size: 11px; color: var(--ink-faint); display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.06em; }
.day.today .dlabel { color: var(--pink); font-weight: 600; }
.list { display: grid; gap: 6px; }
.post { border: 1px solid var(--line); border-radius: 14px; padding: 8px 9px; background: rgba(0, 0, 0, 0.35); display: grid; gap: 5px; text-align: left; width: 100%; color: #fff; position: relative; overflow: hidden; }
.post::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--ink-faint); }
.post .pt { font-size: 12px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; padding-left: 4px; }
.post .pm { font-size: 10px; color: var(--ink-faint); padding-left: 4px; }
.post .chip { justify-self: start; margin-left: 4px; }
.post:hover { border-color: var(--line-strong); }
.post.s-Publicado::before { background: var(--ok); }
.post.s-Agendado::before, .post.s-Aprovado::before { background: var(--info); }
.post.s-EmRevisao::before, .post.s-Ajustes::before { background: var(--warn); }
.post.s-EmCriacao::before { background: var(--pink); }
.post.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 2px var(--red), 0 0 24px rgba(255, 51, 71, 0.6); } to { box-shadow: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
@media (max-width: 760px) {
  .cal-week { grid-template-columns: 1fr; }
  .day { min-height: 0; grid-template-columns: 64px 1fr; }
  .day .dlabel { flex-direction: column; justify-content: start; }
}

/* detalhe do post no calendário */
.post.sel { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
.pdet { margin-top: 16px; padding: 20px; display: grid; gap: 12px; }
.pdet h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; }
.pdet .top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.pdet .leg { white-space: pre-line; font-size: 13px; color: var(--ink-soft); max-height: 160px; overflow: auto; }
/* revisão em lista */
.rlist { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 18px; text-align: left; width: 100%; color: #fff; border: 1px solid var(--line); }
.rrow:hover { border-color: var(--line-strong); }
.rrow[aria-expanded="true"] { border-color: var(--pink); }
.rrow .rt { font-weight: 600; font-size: 15px; }
.rrow .rm { font-size: 12px; color: var(--ink-faint); grid-column: 1; }
.rrow .rx { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
.rrow .seta { font-size: 18px; color: var(--ink-faint); transition: transform .15s; }
.rrow[aria-expanded="true"] .seta { transform: rotate(90deg); color: var(--pink); }

/* revisão */
.review { display: grid; gap: 20px; }
.rcard { padding: 20px; display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .rcard { grid-template-columns: 1fr; } }
.slides { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.slide {
  position: relative; overflow: hidden; flex: 0 0 172px; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 20px; padding: 14px;
  display: flex; flex-direction: column; justify-content: space-between; scroll-snap-align: start; color: #fff;
  background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%);
}
.slide:nth-child(even) { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%); pointer-events: none; }
.slide .n { font-size: 40px; font-weight: 700; line-height: 1; }
.slide .st { font-weight: 600; font-size: 15px; line-height: 1.2; }
.slide .sx { font-size: 11px; line-height: 1.4; opacity: 0.9; margin-top: 4px; }
.slide .img { align-self: start; font-size: 10px; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); }
.caption { white-space: pre-line; font-size: 13px; color: var(--ink-soft); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 16px; padding: 14px; max-height: 220px; overflow: auto; }
.tags { font-size: 12px; color: var(--pink); overflow-wrap: anywhere; }
.rside { display: grid; gap: 14px; align-content: start; }
.rside h3 { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.hist { display: grid; gap: 8px; font-size: 12px; }
.hist div { padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); color: var(--ink-soft); }
.hist b { color: #fff; font-weight: 600; }
.working { font-size: 13px; color: var(--warn); display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
.empty { padding: 32px; text-align: center; color: var(--ink-soft); }
.small { font-size: 12px; color: var(--ink-soft); }
.small b { color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(20, 8, 10, 0.92); border: 1px solid var(--line-strong); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
/* base da marca (ligada ao Airtable) */
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-soft); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
.live.on::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.live.off::before { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .mgrid { grid-template-columns: 1fr; } }
.box { padding: 20px; display: grid; gap: 16px; min-width: 0; }
.box h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.box .hint { margin: -8px 0 0; color: var(--ink-soft); font-size: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 520px) { .fgrid { grid-template-columns: 1fr; } }
.fgrid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 14px; padding: 10px 12px; color: #fff; font-size: 13px; }
.field select option { background: #1a0b0d; }
.field textarea { resize: vertical; min-height: 72px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.04); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); }
.toggles button[aria-pressed="true"] { background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); border-color: transparent; color: #fff; }
.fontes { display: grid; gap: 8px; }
.fonte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
.fonte.inativa { opacity: 0.55; }
.fonte .fn { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.fonte .meta { margin-top: 4px; }
.fonte .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, 0.15); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.msg { padding: 12px 14px; border-radius: 14px; font-size: 13px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.msg.erro { border-color: rgba(255, 107, 107, 0.4); color: #ffd0d0; }
.msg.ok { border-color: rgba(74, 222, 128, 0.35); color: #c9f7d8; }
.btn[disabled] { opacity: 0.5; cursor: progress; }
.cores { display: grid; gap: 8px; }
.cor { display: grid; grid-template-columns: 44px 110px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 460px) { .cor { grid-template-columns: 44px minmax(0, 1fr) auto; } .cor .nome { grid-column: 1 / -1; grid-row: 2; } }
.cor input[type="color"] { width: 44px; height: 40px; padding: 3px; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); cursor: pointer; }
.cor input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.cor input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 8px; }

.pv-tag { color: #00376b; }

.pv-x, .pv-th { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; padding: 12px 14px 8px; font-size: 15px; }
.pv-th { grid-template-columns: 36px minmax(0, 1fr); }
.pv-x .pv-tag { color: #1d9bf0; }
.pv-th .pv-tag { color: #0095f6; }
.pv-x-quem { display: flex; align-items: center; gap: 4px; min-width: 0; white-space: nowrap; }
.pv-x-quem .pv-cinza { color: #536471; overflow: hidden; text-overflow: ellipsis; }
.pv-x-texto { margin: 2px 0 10px; word-wrap: break-word; }

.pv-x-acoes { display: flex; justify-content: space-between; color: #536471; font-size: 13px; padding: 2px 0 4px; }
.pv-x-acoes span { display: inline-flex; align-items: center; gap: 4px; }

.pv-th-midias .pv-item:only-child { width: 100%; }
.pv-th-acoes { display: flex; gap: 18px; color: #424242; font-size: 13px; padding: 2px 0 4px; }
.pv-th-acoes span { display: inline-flex; align-items: center; gap: 5px; }
.arow .at { font-weight: 700; font-size: 14px; }

@media (max-width: 640px) { .arow { grid-template-columns: 56px minmax(0, 1fr); } .arow .actions { grid-column: 1 / -1; justify-content: flex-start; } }

.check-tratar { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted, #9aa0b4); margin: 2px 0 10px; font-weight: 500; }
.check-tratar input { margin-top: 2px; accent-color: var(--red, #F8395A); }
.auth-rodape { margin: 4px 0 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
.auth-rodape button { background: none; border: 0; padding: 0 2px; color: var(--red, #F8395A); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
/* próximo passo */
.proximo { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 9px; background: linear-gradient(90deg, rgba(248,57,90,.10), transparent 70%), var(--card); }
.proximo[hidden] { display: none; }
.proximo div { display: grid; gap: 1px; flex: 1; min-width: 0; } .proximo b { font-size: 14px; } .proximo small { font-size: 12px; color: var(--ink-faint); }
.proximo .btn { white-space: nowrap; }
.px-ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--red, #F8395A); box-shadow: 0 0 0 5px rgba(248,57,90,.18); flex: none; animation: px-pulsa 2s ease-in-out infinite; }
.px-ponto.bad { background: #ff8a3d; box-shadow: 0 0 0 5px rgba(255,138,61,.18); }
@keyframes px-pulsa { 50% { box-shadow: 0 0 0 9px rgba(248,57,90,0); } }
@media (max-width: 520px) { .proximo { flex-wrap: wrap; } .proximo .btn { width: 100%; justify-content: center; } }
/* esqueleto de carregamento */
.esqueleto { display: grid; gap: 12px; }
.esqueleto i { display: block; height: 92px; border-radius: 9px; background: linear-gradient(90deg, var(--card) 0%, rgba(255,255,255,.06) 50%, var(--card) 100%); background-size: 200% 100%; animation: esq 1.3s linear infinite; }
.esqueleto i:nth-child(2) { height: 140px; } .esqueleto i:nth-child(3) { height: 64px; opacity: .7; }
@keyframes esq { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .esqueleto i, .px-ponto { animation: none; } }
/* estados vazios */
.empty { display: grid; gap: 8px; justify-items: center; text-align: center; }
.empty b { font-size: 15px; color: var(--ink); } .empty span { color: var(--ink-soft); }
/* revisão: colunas que se ajustam ao espaço, abas e barra de decisão fixa */
.wrap { container-type: inline-size; }
.rcard { grid-template-columns: minmax(0, 420px) minmax(300px, 1fr); }
@container (max-width: 780px) { .rcard { grid-template-columns: 1fr; } .rcard .ig { max-width: 440px; margin: 0 auto; } }
.abas-rev { margin-bottom: 4px; }
.abas-rev button { flex: 1; justify-content: center; }
.barra-decisao { display: grid; gap: 10px; position: sticky; bottom: 0; z-index: 3; padding: 12px 0 4px; margin-top: 4px; background: linear-gradient(transparent, var(--card) 18%); }
@media (max-width: 760px) { .barra-decisao { bottom: calc(64px + env(safe-area-inset-bottom)); } }
.barra-decisao .actions .btn.primary { flex: 1; justify-content: center; }
/* navegação de baixo no celular */
.nav-baixo { display: none; }
@media (max-width: 760px) {
  /* o menu lateral termina onde a barra de baixo começa (altura medida em --altura-nav) e rola por dentro */
  .side { max-height: calc(100vh - var(--altura-nav, 0px)); max-height: calc(100dvh - var(--altura-nav, 0px)); }
  body.menu-aberto .side { border-bottom: 1px solid var(--line); }
  .nav-baixo:not([hidden]) { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: rgba(10,12,21,.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .nav-baixo button { position: relative; display: grid; justify-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--ink-faint); font: 600 10px/1.1 inherit; font-family: inherit; border-radius: 10px; min-width: 0; }
  .nav-baixo span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -.01em; }
  .nav-baixo svg { width: 22px; height: 22px; }
  .nav-baixo button[aria-current="true"] { color: #fff; }
  .nav-baixo button[aria-current="true"] svg { color: var(--red, #F8395A); }
  .nav-baixo i { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px; background: var(--red, #F8395A); color: #fff; font: 700 10px/17px inherit; font-family: inherit; font-style: normal; }
  body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom)) !important; }
}
/* baixar artes */
.baixar { display: grid; gap: 6px; margin-top: 8px; }
.baixar .actions { gap: 6px; flex-wrap: wrap; } .baixar .btn { padding: 7px 10px; font-size: 12px; }
/* modelos novos */

.fontes-titulo { flex-wrap: wrap; }

/* Diagramação: faixas empilhadas (nome em mono à esquerda, dica à direita), barra de destaque na faixa em uso,
   fontes com amostra grande e opções em pílulas. */
.diag-v2 { gap: 10px; }
.dpainel { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0)), #0E0F15; }
.dsec { position: relative; display: grid; gap: 10px; padding: 14px 16px 16px; border-top: 1px solid var(--line); transition: background .2s; }
.dsec:first-child { border-top: 0; }
.dsec::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--grad); opacity: 0; transition: opacity .2s; }
.dsec.ativa { background: linear-gradient(90deg, rgba(248,57,90,.10), rgba(248,57,90,0) 70%); }

.dsec-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.diag-v2 .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #FFC2CD, var(--pink-soft)); color: #2a0711; font-weight: 600; box-shadow: 0 6px 18px -10px var(--red); }
.diag-v2 .seg button[aria-pressed="true"] svg { stroke: #2a0711; }

.diag-v2 .modelos button[aria-pressed="true"] { border-color: rgba(248,57,90,.55); box-shadow: none; color: #fff; background: linear-gradient(180deg, rgba(248,57,90,.18), rgba(248,57,90,.04)); }
.fontes-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.fontes-lista button { position: relative; display: grid; gap: 6px; text-align: left; padding: 10px 12px 12px; border: 1px solid transparent; border-radius: 10px; background: rgba(255,255,255,.03); color: var(--ink-soft); cursor: pointer; overflow: hidden; transition: background .15s; }

.fontes-lista button:hover { background: rgba(255,255,255,.06); }

.fontes-lista button[aria-pressed="true"]::before { opacity: 1; }
.fo-cab { display: flex; justify-content: space-between; gap: 8px; font: 500 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }

/* ================= Identidade do admin Easypeasy Pay ================= */

.adm { font-size: 9.5px; font-weight: 700; letter-spacing: .28em; color: var(--ink-soft); }
.grupo { padding: 18px 18px 6px; color: var(--ink-faint); }
.track { display: block; position: relative; margin: 0; padding: 2px 0; grid-template-columns: none; }

<script>
const KEY = "pauta-painel-v3";

/* Ideias, calendário e revisão vêm do Airtable (pelo conector no claude.ai, ou pelo fluxo 07 fora dele). */
let state = { ideias: [], posts: [] };
const pauta = { carregada: false, erro: null };

let tab = "home";
try { tab = localStorage.getItem(KEY + ":tab") || "home"; } catch (e) {}
if (!["home", "marca", "brain", "ideias", "cal", "rev", "agend", "banco", "admin"].includes(tab)) tab = "home";
try { document.body.classList.toggle("menu-recolhido", localStorage.getItem(KEY + ":menu") === "recolhido"); } catch (e) {}
let filtro = "Sugerida";
// Filtros das ideias por tipo de post e por categoria (pilar da marca); ficam guardados neste navegador.
const FI = (() => { try { return JSON.parse(localStorage.getItem("pauta-filtros-ideias") || "{}"); } catch (e) { return {}; } })();
FI.tipo = FI.tipo || "Todos"; FI.cat = FI.cat || "Todas"; FI.ordem = FI.ordem || "aderencia";
const guardarFI = () => { try { localStorage.setItem("pauta-filtros-ideias", JSON.stringify({ tipo: FI.tipo, cat: FI.cat, ordem: FI.ordem })); } catch (e) {} };
// Ordem da lista de ideias (o empate cai no outro critério).
const ORDENS_IDEIA = {
  aderencia: ["Mais aderência", (a, b) => b.score - a.score || b.criada - a.criada],
  aderenciaMenor: ["Menos aderência", (a, b) => a.score - b.score || b.criada - a.criada],
  recentes: ["Mais recentes", (a, b) => b.criada - a.criada || b.score - a.score],
  antigas: ["Mais antigas", (a, b) => a.criada - b.criada || b.score - a.score],
};
const NOME_FORMATO = { Estatico: "Estático", Reels: "Reels", Carrossel: "Carrossel", Stories: "Stories" };
const tipoIdeia = i => i.formato || "Outro";
const catIdeia = i => String(i.pilar || "").split(":")[0].trim() || "Sem categoria";
let abertoDescarte = null;
let flashId = null;

const STATUS = {
  Planejado: ["Planejado", ""], EmCriacao: ["Em criação", "acc"], AguardandoVideo: ["Aguardando vídeo", "acc"], VideoAnexado: ["Vídeo anexado", "acc"],
  EmRevisao: ["Em revisão", "warn"], Ajustes: ["IA ajustando", "warn"], Aprovado: ["Aprovado", "info"], Agendado: ["Agendado", "info"],
  Publicando: ["Publicando", "info"], Publicado: ["Publicado", "ok"], Erro: ["Erro", "bad"],
};
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtData = iso => { if (!iso) return "sem data"; const d = new Date(iso); return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} · ${String(d.getHours()).padStart(2, "0")}h${d.getMinutes() ? String(d.getMinutes()).padStart(2, "0") : ""}`; };
const chip = s => { const [txt, cls] = STATUS[s] || [s || "—", ""]; return `<span class="chip ${cls}">${esc(txt)}</span>`; };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200);
}

/* ---------- dados do Airtable ---------- */
const nomeSel = v => (v && typeof v === "object") ? v.name : (v ?? "");
function deIdeia(r) {
  return {

function fmtDataPv(d, curto) {

// Carrossel e stories: pontos, contador e barras acompanham a imagem à vista.
function tocarPv(v) { if (!v) return; if (!v.src && v.dataset.pvSrc) { v.preload = "auto"; v.src = v.dataset.pvSrc; } v.play().catch(() => {}); }
function ligarPv() {
  const d = dlg(), t = d.querySelector("[data-pv-trilho]");
  // fora de carrossel (X, Threads), o vídeo já toca
  d.querySelectorAll("video[data-pv-src]").forEach(v => { if (!v.closest("[data-pv-trilho]")) tocarPv(v); });
  if (!t) return;
  const ativar = i => [...t.children].forEach((it, k) => { const v = it.querySelector("video"); if (!v) return; if (k === i) tocarPv(v); else if (!v.paused) v.pause(); });
  ativar(0);
  const atualizar = () => {
    const n = t.children.length, i = Math.max(0, Math.min(n - 1, Math.round(t.scrollLeft / Math.max(1, t.clientWidth))));
    d.querySelectorAll("[data-pv-pontos] i").forEach((el, k) => el.classList.toggle("on", k === i));
    const cont = d.querySelector("[data-pv-cont]"); if (cont) cont.textContent = `${i + 1}/${n}`;
    d.querySelectorAll("[data-pv-barras] i").forEach((el, k) => { el.classList.toggle("on", k === i); el.classList.toggle("feito", k < i); });
    ativar(i);
  };
  t.addEventListener("scroll", atualizar, { passive: true });
}

function renderAgend() {
  const el = document.getElementById("p-agend"); if (!el) return;
  const head = `<div class="panel-head"><p>Posts aprovados entram aqui. Na hora marcada eles vão para a rede pelo Zernio, ou você publica na hora com "Publicar agora".</p></div>`;
  if (!pauta.carregada) { el.innerHTML = head + semPauta(); return; }
  const porData = (a, b) => new Date(a.data) - new Date(b.data);
  const fila = state.posts.filter(p => ["Agendado", "Publicando"].includes(p.status)).sort(porData);
  const feitos = state.posts.filter(p => p.status === "Publicado").sort((a, b) => porData(b, a));
  const falhas = state.posts.filter(p => p.status === "Erro" && p.artesProntas).sort(porData);
  const grupo = (titulo, lista, vazio) => `<section class="agrupo" aria-label="${titulo}"><span class="lbl">${titulo} · ${lista.length}</span>${lista.length ? `<div class="ag-feed">${lista.map(cardAgend).join("")}</div>` : `<div class="empty glass" style="padding:16px">${vazio}</div>`}</section>`;
  el.innerHTML = head + (M.modo !== "web" ? `<div class="msg" style="margin-bottom:14px">Para publicar na hora ou mudar a data, abra o painel pelo link do GitHub.</div>` : "")
    + grupo("Na fila de publicação", fila, "Nenhum post agendado. Aprove posts na Revisão.")
    + (falhas.length ? grupo("Falhou ao publicar", falhas, "") : "")
    + grupo("Publicados", feitos, "Nada publicado ainda.");
  if (dlg().open && dlg().dataset.agendPost) {
    const p = state.posts.find(p => p.id === dlg().dataset.agendPost);
    if (p) abrirAgendado(p); else fecharDlg();
  }
}

function pedirRemocao(p) {
  abrirDlg(`<h2>Remover do calendário?</h2>
    <p class="hint">"${esc(p.titulo)}" sai do calendário${p.legenda ? " junto com o texto e as artes já criados" : ""}. A ideia volta para <b>Guardadas</b>, e você pode agendar de novo depois.</p>

}
async function confirmarRemocao(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return fecharDlg();
  try {
    if (M.modo === "web") await api({ acao: "removerPost", id, ideia: p.ideia });
    else {
      if (p.ideia) await M.mcp.callTool(AT.server, "update_records_for_table", { baseId: AT.base, tableId: AT.ideias.table, typecast: true, records: [{ id: p.ideia, fields: { [AT.ideias.f.Status]: "Guardada" } }] });
      await M.mcp.callTool(AT.server, "delete_records_for_table", { baseId: AT.base, tableId: AT.cal.table, recordIds: [id] });
    }
    fecharDlg(); calAberto = null;
    state.posts = state.posts.filter(x => x.id !== id); render();
    toast("Post removido do calendário. A ideia está em Guardadas.");
    if (M.modo === "web") carregarPauta(); else recarregar();
  } catch (e) { fecharDlg(); toast("Não deu para remover: " + textoErro(e)); }
}

function renderCal() {

  // Faixa de meses em páginas de 3 (trimestres), do ano passado ao ano que vem.
  const anoBase = hoje.getFullYear() - 1, paginas = [];
  for (let t = 0; t < 12; t++) {

    paginas.push(`<div class="tri" data-tri="${t}">${meses.map(({ a, m }) => {

    ${doMesAtual.length ? `<div class="cal-resumo-mes" aria-label="Resumo de formatos do mês">${resumoFormatos(doMesAtual).map(r => `<span>${esc(r.texto)}</span>`).join("")}</div>` : ""}

// Faixa de trimestres: abre no trimestre do mês visto, as setas pulam 3 meses e o rótulo acompanha a rolagem.
let triVisto = null;
function ligarFaixaMeses(triAtual) {
  const faixa = document.getElementById("cal-ano"); if (!faixa) return;
  const ir = (t, suave) => faixa.scrollTo({ left: t * faixa.clientWidth, behavior: suave ? "smooth" : "auto" });
  const alvo = triVisto === null ? triAtual : triVisto;
  ir(alvo, false);
  // Com a aba escondida a faixa não tem largura; posiciona quando ela aparecer ou mudar de tamanho.
  let larg = faixa.clientWidth;
  new ResizeObserver(() => { if (faixa.clientWidth && faixa.clientWidth !== larg) { const t = larg ? Math.round(faixa.scrollLeft / larg) : alvo; larg = faixa.clientWidth; ir(t, false); rotulo(); } }).observe(faixa);
  const rotulo = () => {
    if (!faixa.clientWidth) return;
    const t = Math.round(faixa.scrollLeft / faixa.clientWidth); triVisto = t;
    const b = faixa.querySelectorAll(".tri")[t]; const r = document.getElementById("tri-rotulo");
    if (b && r) { const ms = [...b.querySelectorAll("[data-cal-mes]")].map(x => x.dataset.calMes.split("-").map(Number)); r.textContent = MESES[ms[0][1]].slice(0, 3) + " – " + MESES[ms[2][1]].slice(0, 3) + " " + ms[2][0]; }
  };
  rotulo();
  faixa.addEventListener("scroll", () => { clearTimeout(faixa._t); faixa._t = setTimeout(rotulo, 80); }, { passive: true });
  // Arrastar com o mouse também passa os trimestres.
  let x0 = null, s0 = 0, moveu = false;
  faixa.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; x0 = e.clientX; s0 = faixa.scrollLeft; moveu = false; });
  faixa.addEventListener("pointermove", e => { if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 6) { moveu = true; faixa.style.scrollSnapType = "none"; faixa.scrollLeft = s0 - dx; } });
  const soltar = () => { if (x0 === null) return; x0 = null; faixa.style.scrollSnapType = ""; if (moveu) ir(Math.round(faixa.scrollLeft / faixa.clientWidth), true); };
  faixa.addEventListener("pointerup", soltar); faixa.addEventListener("pointerleave", soltar);
  faixa.addEventListener("click", e => { if (moveu) { e.stopPropagation(); e.preventDefault(); moveu = false; } }, true);
}

function onboardingAtual(versao) {

async function analisarMarcaOnboarding() {
  if (!OB.d.perfil && !OB.d.site) { OB.erro = "Informe o Instagram ou o site, ou escolha preencher manualmente."; return desenharOnboarding(); }
  OB.analise = true; OB.erro = ""; const versao = ++OB.versao; desenharOnboarding();
  const falhou = e => { if (!onboardingAtual(versao)) return; OB.analise = false; OB.erro = textoErro(e); desenharOnboarding(); };
  try {
    const { id } = await api({ acao: "analisarMarca", instagram: OB.d.perfil, site: OB.d.site });
    const consultar = async () => {
      if (!onboardingAtual(versao)) return;
      try {
        const r = await api({ acao: "analiseMarca", id }); if (!onboardingAtual(versao)) return;
        if (r.status === "erro") throw { message: r.erro || "Não consegui analisar as páginas. Você pode preencher manualmente." };
        if (r.status !== "feito") { OB.timer = setTimeout(consultar, 2000); return; }
        const c = r.resultado?.campos || {}, cores = lerCores(c.Cores);
        Object.assign(OB.d, { nome: c.Nome || OB.d.nome, perfil: c.Perfil || OB.d.perfil, site: c.Site || OB.d.site, faz: c.Posicionamento || "", publico: c.Publico || "", tom: c.TomDeVoz || "", pilares: (c.Pilares || []).join(", "), evitar: c.Evitar || "", exemplos: c.ExemplosBons || "", idioma: c.Idioma || "Português (Brasil)" });
        if (cores[0]) OB.d.cor1 = cores[0].hex; if (cores[1]) OB.d.cor2 = cores[1].hex;
        OB.d.temas = OB.d.pilares; OB.avisos = [...(r.resultado?.avisos || []), r.resultado?.observacoes].filter(Boolean);
        OB.analise = false; OB.analisada = true; OB.passo = 1; desenharOnboarding();
      } catch (e) { falhou(e); }
    };
    await consultar();
  } catch (e) { falhou(e); }
}
async function avancarOnboarding() {
  if (OB.salvando || OB.analise) return;

  const versao = OB.versao, org = U.organizacao?.id, token = U.token;
  const conferir = () => { if (!onboardingAtual(versao)) throw new Error("Onboarding encerrado."); };
  const pedir = async corpo => { conferir(); const r = await api(corpo); conferir(); return r; };
  const arquivosEstilo = [...(document.getElementById("ob-posts")?.files || [])].slice(0, 8);
  if (P === 4) OB.buscar = !!document.getElementById("ob-buscar")?.checked;
  if (P === 0 && OB.modo === "ia") return analisarMarcaOnboarding();
  const salvar = async campos => { await pedir({ acao: "salvarMarca", id: M.marca ? M.marca.id : null, campos }); await carregarWeb(); conferir(); };
  OB.salvando = true; desenharOnboarding();
  try {
    if (P === 1) {
      if (!d.nome) { OB.salvando = false; desenharOnboarding(); return toast("Dê um nome para a marca."); }
      await salvar({ Nome: d.nome, Perfil: d.perfil, Site: d.site, Posicionamento: d.faz, Publico: d.publico, TomDeVoz: d.tom, Pilares: d.pilares.split(/[,;\n]/).map(x => x.trim()).filter(Boolean), Evitar: d.evitar, ExemplosBons: d.exemplos, Idioma: d.idioma, Redes: (M.marca && M.marca.Redes && M.marca.Redes.length) ? M.marca.Redes : ["Instagram"] });
    }
    if (P === 2) {
      const outras = lerCores(M.marca && M.marca.Cores).slice(2);
      await salvar({ Cores: [`${d.cor1.toUpperCase()} Principal`, `${d.cor2.toUpperCase()} Destaque`, ...outras.map(c => `${c.hex} ${c.nome}`.trim())].join("\n") });
    }

      await pedir({ acao: "criarModelo", instagram: true, nome: "Meu Instagram" }); toast("A IA está estudando os seus posts. O modelo fica pronto em cerca de 1 minuto.");
    }

      await concluirOnboarding();

      if (org !== U.organizacao?.id || token !== U.token || OB.versao !== versao + 1) return;
      ir("ideias");
      if (buscar && (d.temas || conc)) buscarIdeias({ quantidade: 10 });
      else toast("Tudo pronto! Clique em Buscar ideias novas quando quiser.");
      return;
    }
    OB.passo++;

}
async function concluirOnboarding() {

  if (U.organizacao) U.organizacao.onboarding = false;

  render();
}

      if (!v.ended) v.requestVideoFrameCallback(quadro);
    };
    v.onended = () => ok();
    v.requestVideoFrameCallback(quadro);
    v.play().catch(falha);
  });
  await enc.flush(); enc.close();
  if (erro) throw erro;
  if (n < 2) throw new Error("poucos quadros");
  if (comAudio) {
    const aenc = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: e => { erro = e; } });
    aenc.configure({ codec: codecA.codec, sampleRate: AUDIO_SR, numberOfChannels: 2, bitrate: 128000 });
    const fimA = Math.min(audio.n, Math.round(dur * AUDIO_SR)), Q = 1024;
    for (let i = 0; i < fimA; i += Q) {
      const k = Math.min(Q, fimA - i), dados = new Float32Array(k * 2);
      dados.set(audio.L.subarray(i, i + k), 0); dados.set(audio.R.subarray(i, i + k), k);
      const ad = new AudioData({ format: "f32-planar", sampleRate: AUDIO_SR, numberOfFrames: k, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / AUDIO_SR), data: dados });
      aenc.encode(ad); ad.close();
      if (aenc.encodeQueueSize > 32) await new Promise(r => setTimeout(r, 2));
    }
    await aenc.flush(); aenc.close();
    if (erro) throw erro;
  }
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: "video/mp4" });
}

// Barras empilhadas do gasto por dia (só a chave da plataforma), com dica ao passar o mouse.
const larguraGrafico = () => { const el = document.getElementById("p-admin"); return Math.max(320, Math.min(760, ((el && el.clientWidth) || 760) - 34)); };
function graficoGasto(serie) {
  const W = larguraGrafico(), H = W < 500 ? 240 : 220, m = { e: 48, d: 8, t: 10, b: 26 }, iw = W - m.e - m.d, ih = H - m.t - m.b;
  const totais = serie.map(s => SERVICOS.reduce((a, x) => a + (s[x.k] || 0), 0));
  const max = Math.max(0.01, ...totais), passo = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500].find(p => max / p <= 4) || Math.ceil(max / 4);
  const topo = Math.ceil(max / passo) * passo, y = v => m.t + ih - (v / topo) * ih, bw = iw / serie.length, larg = Math.max(2, bw - 4);
  const grade = []; for (let v = 0; v <= topo + 1e-9; v += passo) grade.push(`<line x1="${m.e}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" class="ad-grade"/><text x="${m.e - 6}" y="${y(v) + 4}" class="ad-eixo" text-anchor="end">${v < 1 ? v.toFixed(2).replace(".", ",") : num(v)}</text>`);
  const barras = serie.map((s, i) => {
    const x = m.e + i * bw + (bw - larg) / 2; let base = m.t + ih; const partes = [];
    SERVICOS.forEach(sv => { const v = s[sv.k] || 0; if (v <= 0) return; const h = Math.max(1, (v / topo) * ih); base -= h; partes.push(`<rect x="${x}" y="${base}" width="${larg}" height="${Math.max(0.5, h - 2)}" rx="2" fill="${sv.cor}"/>`); });
    const dica = `${diaCurto(s.dia)}: ${usd(totais[i])}` + SERVICOS.filter(sv => s[sv.k] > 0).map(sv => ` · ${sv.nome} ${usd(s[sv.k])}`).join("");
    return `<g class="ad-col"><rect x="${m.e + i * bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"><title>${esc(dica)}</title></rect>${partes.join("")}${(serie.length - 1 - i) % (W < 500 ? 7 : 5) === 0 ? `<text x="${x + larg / 2}" y="${H - 8}" class="ad-eixo" text-anchor="middle">${diaCurto(s.dia)}</text>` : ""}</g>`;
  }).join("");

const fotoEditor = () => { const a = ((M.marca && M.marca.MoodBoard) || [])[0]; return a ? urlArq(a) : ""; };

// Redesenha o editor sem pular a tela (o botão clicado fica na mesma altura).
function redesenharEditor(ancora) {
  const el = document.getElementById("mp-editor"); if (!el) return;
  const sel = ancora && ancora.isConnected && ancora.dataset.act ? seletorDe(ancora) : null, topo = sel ? ancora.getBoundingClientRect().top : null;
  const nomeAtual = document.getElementById("mp-ed-nome"); if (nomeAtual) ED.nome = nomeAtual.value;
  const pad = document.getElementById("mp-ed-padrao"); if (pad) ED.padrao = pad.checked;
  const cvVelho = document.getElementById("mp-ed-cv");
  el.innerHTML = htmlEditorModelo();
  if (cvVelho) document.getElementById("mp-ed-cv").replaceWith(cvVelho);
  if (sel) { const n = el.querySelector(sel); if (n) { const d = n.getBoundingClientRect().top - topo; if (Math.abs(d) > 0.5) scrollBy(0, d); } }

    ${lista.length ? `<div class="mp-lista">${lista.map(x => `<div class="mp-card ${M.modeloPadrao === x.id ? "padrao" : ""}">
      ${x.status === "pronto" ? `<canvas data-modelo-previa="${x.id}" width="540" height="675" aria-label="Prévia do modelo ${esc(x.nome)}"></canvas>` : x.status === "gerando" ? `<div class="working"><span class="dot"></span>A IA está estudando os seus posts…</div>` : `<div class="msg erro">Não deu para criar: ${esc(x.erro || "erro desconhecido")}</div>`}
      <b>${esc(x.nome || (x.diag ? "Modelo da marca" : "Modelo do perfil"))}</b>${x.diag ? `<span class="small">Montado por você</span>` : x.spec && x.spec.descricao ? `<span class="small">${esc(x.spec.descricao)}</span>` : ""}
      ${x.exemplos.length ? `<div class="mp-ex">${x.exemplos.slice(0, 6).map(a => `<img src="${esc(urlArq(a))}" alt="" loading="lazy">`).join("")}</div>` : ""}
      <div class="actions">${x.status === "pronto" ? (M.modeloPadrao === x.id ? `<button class="btn" data-mp="padrao" data-v="">Padrão dos posts novos ✓</button>` : `<button class="btn" data-mp="padrao" data-v="${x.id}">Usar como padrão</button>`) : ""}${x.diag ? `<button class="btn" data-mp="editar" data-v="${x.id}">Editar</button>` : ""}<button class="btn quiet" data-mp="remover" data-v="${x.id}">Remover</button></div>

      ${MP.modo === "editor" || ED.id ? `<div id="mp-editor">${htmlEditorModelo()}</div>` : `
      <label class="field"><span>Nome (opcional)</span><input id="mp-nome" maxlength="40" placeholder="Ex.: Feed de promoções"></label>

        <button class="btn" data-mp="instagram" ${MP.enviando || cheio ? "disabled" : ""}>${perfil ? `Buscar os últimos posts de @${esc(perfil.replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/[/?#].*$/, "").replace(/^@+/, ""))}` : "Buscar do meu Instagram"}</button></div>

  pintarModelosPerfil(); pintarEditorModelo();

async function recarregarModelos() {
  try { const j = await api({ acao: "listarModelos" }); M.modelos = j.modelos || []; M.modeloPadrao = j.modeloPadrao || null; M.limiteModelos = j.limiteModelos || null; } catch (e) { return; }
  renderModelosPerfil();
  if (tab === "rev") render();
}
async function pintarModelosPerfil() {
  const logos = await logosDaPrevia(), cores = coresMarca(), nome = (M.marca && M.marca.Nome) || "Sua marca";
  for (const cv of document.querySelectorAll("canvas[data-modelo-previa]")) {
    const md = (M.modelos || []).find(x => x.id === cv.dataset.modeloPrevia && x.diag);
    if (md) { const f = fotoEditor(); desenharSlide({ n: 1, t: "Seu título com *destaque*", x: "O texto de apoio aparece assim" }, 0, 3, f ? await imgCache(f) : null, logos, cores, nome, cv, diagDoModelo(md.diag)); continue; }
    const m = modeloDoPerfil(cv.dataset.modeloPrevia); if (!m) continue;
    const foto = null; // os exemplos já têm o texto da marca; a prévia mostra só as cores, a fonte e a moldura
    const sp = m.spec;
    desenharSlide({ n: 1, t: "Seu título com *destaque*", x: "O texto de apoio aparece assim" }, 0, 3, foto, logos, cores, nome, cv,
      { modelo: "proprio", proprio: m.id, fonte: "auto", fundo: "auto", alinhar: sp.alinhar, posicao: sp.posicao, logo: sp.logo === "nenhum" ? "nenhum" : "auto", logoPos: sp.logo === "nenhum" ? "te" : sp.logo });
  }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-mp]"); if (!b) return;
  const a = b.dataset.mp;
  if (a === "modo") { MP.modo = b.dataset.v; return renderModelosPerfil(); }
  if (a === "editar") { const md = (M.modelos || []).find(x => x.id === b.dataset.v && x.diag); return md && abrirEditorModelo(md); }
  if (a === "ed-cancelar") { Object.assign(ED, { aberto: false, id: null, nome: "", padrao: false, diag: DIAG_INICIAL() }); esquecerFormEditor(); return renderModelosPerfil(); }
  if (a === "ed-salvar") {
    const nome = (document.getElementById("mp-ed-nome")?.value || "").trim(), padrao = !!document.getElementById("mp-ed-padrao")?.checked;
    MP.enviando = true; redesenharEditor(null);
    try {
      const r = await api({ acao: "salvarModeloMarca", id: ED.id || undefined, nome, diagramacao: ED.diag, padrao: padrao && !ED.id });
      if (ED.id && padrao !== (M.modeloPadrao === ED.id)) await api({ acao: "modeloPadrao", id: padrao ? ED.id : null });
      toast(ED.id ? "Modelo atualizado." : padrao ? "Modelo salvo: os posts novos já saem com ele." : "Modelo salvo. Ele aparece na Diagramação da revisão.");
      Object.assign(ED, { aberto: false, id: null, nome: "", padrao: false, diag: DIAG_INICIAL() });
      MP.enviando = false; esquecerFormEditor(); await recarregarModelos(); return;
    } catch (err) { MP.enviando = false; redesenharEditor(null); return toast("Não deu para salvar: " + textoErro(err)); }
  }
  if (a === "padrao") {
    try { await api({ acao: "modeloPadrao", id: b.dataset.v || null }); M.modeloPadrao = b.dataset.v || null; toast(b.dataset.v ? "Pronto: os posts novos já saem com este modelo." : "Os posts novos voltam a usar o modelo Foto de fundo."); renderModelosPerfil(); }
    catch (err) { toast("Não deu para salvar: " + textoErro(err)); }
    return;
  }
  if (a === "remover") {
    if (b.dataset.confirma !== "1") { b.dataset.confirma = "1"; b.textContent = "Remover mesmo?"; setTimeout(() => { b.dataset.confirma = ""; b.textContent = "Remover"; }, 3000); return; }
    try { await api({ acao: "removerModelo", id: b.dataset.v }); toast("Modelo removido. Os posts que usavam ele voltam para Foto de fundo."); recarregarModelos(); }
    catch (err) { toast("Não deu para remover: " + textoErro(err)); }
    return;
  }
  if (a === "criar" || a === "instagram") {
    const nome = (document.getElementById("mp-nome")?.value || "").trim();
    let pedido = { acao: "criarModelo", nome };
    if (a === "criar") {
      const arquivos = [...(document.getElementById("mp-arquivos")?.files || [])].filter(f => /^image\//.test(f.type)).slice(0, 8);
      if (arquivos.length < 2) return toast("Escolha pelo menos 2 imagens de posts seus.");
      MP.enviando = true; renderModelosPerfil();
      try { pedido.imagens = []; for (const f of arquivos) { const x = await prepararFoto(f); pedido.imagens.push({ tipo: x.tipo, base64: x.base64 }); } }
      catch (err) { MP.enviando = false; renderModelosPerfil(); return toast("Não consegui ler as imagens: " + textoErro(err)); }
    } else {
      if (!String((M.marca && M.marca.Perfil) || "").trim()) return toast("Preencha o campo Perfil nas redes (@) e salve a marca.");
      pedido.instagram = true; MP.enviando = true; renderModelosPerfil();
    }
    try { await api(pedido); toast("A IA está estudando os seus posts. O modelo aparece aqui em cerca de 1 minuto."); }
    catch (err) { toast("Não deu para criar: " + textoErro(err)); }
    MP.enviando = false; recarregarModelos();
  }
});

function pintarPaleta() {
  const p = document.getElementById("m-paleta"); if (!p) return;
  p.innerHTML = [...document.querySelectorAll("#m-cores .hex")].map(i => i.value.trim()).filter(h => /^#[0-9a-f]{6}$/i.test(h)).map(h => `<i style="background:${h}"></i>`).join("");

document.addEventListener("input", e => {
  if (!e.target.closest("#m-form")) return;
  M.marcaSuja = true; M.aviso = null;
  const linha = e.target.closest(".cor");
  if (linha && e.target.type === "color") linha.querySelector(".hex").value = e.target.value.toUpperCase();
  if (linha && e.target.classList.contains("hex") && /^#[0-9a-f]{6}$/i.test(e.target.value.trim())) linha.querySelector('input[type="color"]').value = e.target.value.trim().toLowerCase();
  if (linha) pintarPaleta();
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  const a = b.dataset.m, id = b.dataset.id;
  if (a === "toggle") { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); M.marcaSuja = true; M.aviso = null; return renderStatus(); }
  if (a === "add-pilar") { const n = v("m-novo-pilar"); if (n) { M.pilaresExtra.push(n); const box = document.getElementById("m-pilares"); box.insertAdjacentHTML("beforeend", `<button type="button" data-m="toggle" data-valor="${esc(n)}" aria-pressed="true">${esc(n)}</button>`); document.getElementById("m-novo-pilar").value = ""; M.marcaSuja = true; renderStatus(); } return; }
  if (a === "add-cor") { document.getElementById("m-cores").insertAdjacentHTML("beforeend", linhaCor({ hex: "#FF3347", nome: "" })); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "rm-cor") { b.closest(".cor").remove(); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "salvar-marca") return salvarMarca();
  if ((a === "logo-rm" || a === "mood-rm") && M.marcaSuja) await salvarMarca();
  if (a === "logo-rm") { if (await executar("salvarMarca", { id: M.marca.id, campos: { [id]: [] } }, "Arquivo removido.")) renderMarca(); return; }
  if (a === "mood-rm") {
    const resto = (M.marca.MoodBoard || []).filter(x => x.id !== id).map(x => ({ id: x.id }));
    if (await executar("salvarMarca", { id: M.marca.id, campos: { MoodBoard: resto } }, "Imagem removida do mood board.")) renderMarca();
    return;
  }
  if (a === "tentar") return tentarDeNovo();
  if (a === "nova-fonte") { M.editando = "novo"; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "editar") { M.editando = id; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "cancelar-fonte") { M.editando = null; return renderFontes(); }
  if (a === "ativa-form") { b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"); return; }
  if (a === "salvar-fonte") return salvarFonte();
  if (a === "ativa") {
    const x = M.fontes.find(y => y.id === id); if (!x || M.ocupado) return;
    const nova = x.Ativa !== true; x.Ativa = nova; renderFontes();
    const ok = await executar("salvarFonte", { id, campos: { Ativa: nova } }, nova ? "Fonte ativada." : "Fonte pausada.");
    if (!ok) { x.Ativa = !nova; renderFontes(); }
    return;
  }
  if (a === "remover") { M.remover = id; return renderFontes(); }
  if (a === "remover-nao") { M.remover = null; return renderFontes(); }
  if (a === "remover-ok") {
    const ok = await executar("removerFonte", { id }, "Fonte removida.");
    if (ok) { M.fontes = M.fontes.filter(y => y.id !== id); M.remover = null; renderFontes(); }
  }
});

(async () => {
  renderMarca();
  const c = window.claude;
  M.mcp = c && typeof c.use === "function" ? await c.use("mcp").catch(() => null) : null;
  if (M.mcp) return conectar();
  // Fora do claude.ai (ex.: GitHub Pages): conta, organização e pauta pela API da plataforma.
  M.modo = "web";
  if (typeof prepararAcessoConta === "function" && prepararAcessoConta()) { M.conexao = "login"; renderMarca(); renderAuth(); return; }
  if (U.convite) {
    try { U.conviteInfo = (await chamar({ acao: "verConvite", convite: U.convite }, false)).convite; U.tela = U.conviteInfo.temConta ? "login" : "cadastro"; }
    catch (e) { U.erro = textoErro(e); U.convite = null; try { history.replaceState(null, "", location.pathname); } catch (x) {} }
  }
  const salva = sessao.ler();
  if (salva && salva.token) {
    U.token = salva.token;
    try {
      guardarInfo(await chamar({ acao: "eu" }));
      if (U.convite) return depoisDeEntrar({ token: U.token }, true);
      await iniciarWeb();
      return voltouDaConexao();
    } catch (e) { if (e.login) { sessao.apagar(); U.token = ""; } else { U.erro = textoErro(e); } }
  }
  M.conexao = "login"; renderMarca(); renderAuth();
})();

render();
// Fora do claude.ai, atualiza a pauta a cada 90 s enquanto a página está aberta.
setInterval(() => { if (M.modo === "web" && U.token && !document.hidden) carregarPauta(); }, 90000);
