workflows:
  ios-simulator:
    name: Easy Content Post · validar iOS
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: "24"
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Conferir e preparar o painel
        script: |
          npm run mobile:check
          npm run mobile:sync
      - name: Compilar para simulador sem assinatura
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Compactar aplicativo do simulador
        script: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/simulator/Build/Products/Debug-iphonesimulator/App.app \
            build/EasyContentPost-simulator.zip
    artifacts:
      - build/EasyContentPost-simulator.zip
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Easy Content Post · TestFlight interno
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: easycontentpost-appstore
    environment:
      node: "24"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.easycontentpost.app
    scripts:
      - name: Instalar dependências
        script: npm ci
      - name: Conferir e preparar o painel
        script: |
          npm run mobile:check
          npm run mobile:sync
      - name: Configurar assinatura para teste interno
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Definir número único da compilação
        script: |
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Compilar e exportar aplicativo assinado
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
