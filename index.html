<head>

<style>html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Content Post</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22cp-g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF5F7A%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%23F8395A%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23C8102E%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url(%23cp-g)%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%2211%22%20width%3D%2228%22%20height%3D%2235%22%20rx%3D%226%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M19%2023h16M19%2030h10%22%20stroke%3D%22%23fff%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2244%22%20r%3D%2212%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M39.5%2048.5l9-9M42%2039.5h6.5V46%22%20fill%3D%22none%22%20stroke%3D%22%23C8102E%22%20stroke-width%3D%223.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Identidade do admin da Easypeasy Pay: navy quase preto, cartões chapados com borda de 1px,
   acento vermelho-rosa em gradiente, Poppins + IBM Plex Mono, rótulos pequenos em caixa alta,
   etiquetas contornadas, menu lateral com trilho tracejado. Tema único escuro. */
:root {
  color-scheme: dark;
  --bg: #0A0C15;
  --card: #191B25;
  --card-soft: #15171F;
  --glow: #F8395A;
  --ink: #ffffff;
  --ink-body: #c8cad3;
  --ink-soft: #8A8D9C;
  --ink-faint: #5D6070;
  --glass: #191B25;
  --glass-red: #191B25;
  --line: #2A2C38;
  --line-strong: #353846;
  --red: #F8395A;
  --red-deep: #C8102E;
  --pink: #F8395A;
  --pink-soft: #FF8FA3;
  --orange: #FFB84D;
  --orange-deep: #F59E0B;
  --ok: #3EDDAE;
  --warn: #FFB84D;
  --info: #8A8D9C;
  --bad: #F8395A;
  --grad: linear-gradient(140deg, #FF5F7A, #F8395A 55%, #C8102E);
  --font-display: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
  --radius: 9px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(900px 520px at 18% -8%, rgba(190, 20, 32, 0.55), transparent 70%),
    radial-gradient(700px 600px at 92% 30%, rgba(120, 10, 20, 0.45), transparent 70%),
    radial-gradient(800px 500px at 40% 110%, rgba(140, 12, 24, 0.35), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 72px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* vidro: o material básico das superfícies */
.glass {
  background: linear-gradient(180deg, var(--glass-red), var(--glass));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}

/* topo */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: flex-end; }
.top + .track { margin-top: 18px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); letter-spacing: -0.01em; }
.top h1 span { display: block; color: var(--ink-faint); font-weight: 600; }
.top .sub { color: var(--ink-soft); margin-top: 10px; max-width: 52ch; }
.notice { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); padding: 7px 14px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.notice::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-faint); text-decoration: underline; font-size: 12px; }
.linkbtn:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* etapas = cartões em gradiente, como "Global Hits 50" */
.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
@media (max-width: 960px) { .track { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.track .t-marca { background: linear-gradient(160deg, #ff8a5c 0%, #ff4d3d 45%, #9e0f1c 100%); }
.track .t-marca[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 77, 61, 0.65); }
.track button {
  position: relative; overflow: hidden; border: 0; text-align: left; border-radius: var(--radius);
  padding: 16px 18px 18px; display: grid; gap: 6px; min-height: 148px; align-content: start;
  color: #fff; opacity: 0.72; transition: opacity .2s, transform .2s, box-shadow .2s;
}
.track button:hover { opacity: 0.92; }
.track button[aria-selected="true"] { opacity: 1; transform: translateY(-2px); }
.track .t-ideias { background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%); }
.track .t-cal { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.track .t-rev { background: linear-gradient(160deg, #ff4f8b 0%, #e0204f 45%, #8f0b2a 100%); }
.track .t-ideias[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 51, 71, 0.65); }
.track .t-cal[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 138, 30, 0.6); }
.track .t-rev[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(224, 32, 79, 0.65); }
.track button::after { /* reflexo de vidro */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 85% 110%, rgba(0, 0, 0, 0.28), transparent 60%), linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%);
}
.track .step { justify-self: start; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.22); }
.track .name { font-size: 18px; font-weight: 600; margin-top: 6px; }
.track .count { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.track .play { position: absolute; right: 16px; bottom: 16px; width: 0; height: 0; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; z-index: 1; }
@media (max-width: 640px) {
  .track { grid-template-columns: 1fr; gap: 12px; }
  .track button { min-height: 0; grid-template-columns: 1fr auto; align-items: center; }
  .track .step { grid-column: 1 / -1; }
  .track .count { font-size: 34px; grid-column: 2; grid-row: 2; }
  .track .play { display: none; }
}

.panel { margin-top: 28px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.filters button { border: 0; background: none; border-radius: 99px; padding: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); color: #fff; box-shadow: 0 6px 16px -6px rgba(255, 51, 71, 0.7); }

/* chips em pílula translúcida */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); color: var(--ink-soft); border: 1px solid var(--line); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.chip.plain::before { display: none; }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.chip.info { color: var(--info); }
.chip.bad { color: var(--bad); }
.chip.acc { color: var(--pink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

/* botões em pílula */
.btn { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.06); border-radius: 99px; padding: 9px 18px; font-weight: 500; font-size: 13px; color: #fff; transition: background .15s, box-shadow .15s; }
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn.primary { border-color: transparent; background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); box-shadow: 0 10px 24px -10px rgba(255, 51, 71, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn.primary:hover { background: linear-gradient(180deg, #ff6070, #d4142a); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-faint); }
.btn.quiet:hover { color: #fff; }

/* ideias */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .ideas { grid-template-columns: 1fr; } }
.idea { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.idea.dim { opacity: 0.5; }
.idea h3 { font-size: 17px; font-weight: 600; }
.idea p { margin: 0; color: var(--ink-soft); }
.idea .why { font-size: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
.idea .why b { color: #fff; font-weight: 600; }
.score { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.score .pill { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 12px; border-radius: 99px; background: linear-gradient(180deg, var(--orange), var(--orange-deep)); font-size: 12px; font-weight: 500; box-shadow: 0 6px 16px -8px rgba(255, 138, 30, 0.9); }
.score .pill strong { font-size: 15px; font-weight: 700; }
.score .pill.low { background: rgba(255, 255, 255, 0.1); box-shadow: none; color: var(--ink-soft); }
.bar { flex: 1; max-width: 120px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--orange)); }
.src { font-size: 11px; color: var(--ink-faint); overflow-wrap: anywhere; }
.reason { display: grid; gap: 8px; }
.reason input, textarea { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 10px 14px; color: #fff; }
.reason input::placeholder, textarea::placeholder { color: var(--ink-faint); }
.decided { font-size: 12px; color: var(--ink-soft); }
.decided b { color: #fff; }

/* calendário */
.cal { overflow: hidden; padding: 6px; }
.cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-week + .cal-week { margin-top: 6px; }
.day { min-height: 132px; padding: 10px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); display: grid; gap: 8px; align-content: start; min-width: 0; }
.day.past { opacity: 0.55; }
.day.today { background: rgba(255, 51, 71, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 51, 71, 0.5); }
.dlabel { font-size: 11px; color: var(--ink-faint); display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.06em; }
.day.today .dlabel { color: var(--pink); font-weight: 600; }
.list { display: grid; gap: 6px; }
.post { border: 1px solid var(--line); border-radius: 14px; padding: 8px 9px; background: rgba(0, 0, 0, 0.35); display: grid; gap: 5px; text-align: left; width: 100%; color: #fff; position: relative; overflow: hidden; }
.post::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--ink-faint); }
.post .pt { font-size: 12px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; padding-left: 4px; }
.post .pm { font-size: 10px; color: var(--ink-faint); padding-left: 4px; }
.post .chip { justify-self: start; margin-left: 4px; }
.post:hover { border-color: var(--line-strong); }
.post.s-Publicado::before { background: var(--ok); }
.post.s-Agendado::before, .post.s-Aprovado::before { background: var(--info); }
.post.s-EmRevisao::before, .post.s-Ajustes::before { background: var(--warn); }
.post.s-EmCriacao::before { background: var(--pink); }
.post.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 2px var(--red), 0 0 24px rgba(255, 51, 71, 0.6); } to { box-shadow: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
@media (max-width: 760px) {
  .cal-week { grid-template-columns: 1fr; }
  .day { min-height: 0; grid-template-columns: 64px 1fr; }
  .day .dlabel { flex-direction: column; justify-content: start; }
}

/* detalhe do post no calendário */
.post.sel { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
.pdet { margin-top: 16px; padding: 20px; display: grid; gap: 12px; }
.pdet h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; }
.pdet .top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.pdet .leg { white-space: pre-line; font-size: 13px; color: var(--ink-soft); max-height: 160px; overflow: auto; }
/* revisão em lista */
.rlist { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 18px; text-align: left; width: 100%; color: #fff; border: 1px solid var(--line); }
.rrow:hover { border-color: var(--line-strong); }
.rrow[aria-expanded="true"] { border-color: var(--pink); }
.rrow .rt { font-weight: 600; font-size: 15px; }
.rrow .rm { font-size: 12px; color: var(--ink-faint); grid-column: 1; }
.rrow .rx { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
.rrow .seta { font-size: 18px; color: var(--ink-faint); transition: transform .15s; }
.rrow[aria-expanded="true"] .seta { transform: rotate(90deg); color: var(--pink); }

/* revisão */
.review { display: grid; gap: 20px; }
.rcard { padding: 20px; display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .rcard { grid-template-columns: 1fr; } }
.slides { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.slide {
  position: relative; overflow: hidden; flex: 0 0 172px; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 20px; padding: 14px;
  display: flex; flex-direction: column; justify-content: space-between; scroll-snap-align: start; color: #fff;
  background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%);
}
.slide:nth-child(even) { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%); pointer-events: none; }
.slide .n { font-size: 40px; font-weight: 700; line-height: 1; }
.slide .st { font-weight: 600; font-size: 15px; line-height: 1.2; }
.slide .sx { font-size: 11px; line-height: 1.4; opacity: 0.9; margin-top: 4px; }
.slide .img { align-self: start; font-size: 10px; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); }
.caption { white-space: pre-line; font-size: 13px; color: var(--ink-soft); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 16px; padding: 14px; max-height: 220px; overflow: auto; }
.tags { font-size: 12px; color: var(--pink); overflow-wrap: anywhere; }
.rside { display: grid; gap: 14px; align-content: start; }
.rside h3 { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.hist { display: grid; gap: 8px; font-size: 12px; }
.hist div { padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); color: var(--ink-soft); }
.hist b { color: #fff; font-weight: 600; }
.working { font-size: 13px; color: var(--warn); display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
.empty { padding: 32px; text-align: center; color: var(--ink-soft); }
.small { font-size: 12px; color: var(--ink-soft); }
.small b { color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(20, 8, 10, 0.92); border: 1px solid var(--line-strong); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
/* base da marca (ligada ao Airtable) */
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-soft); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
.live.on::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.live.off::before { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .mgrid { grid-template-columns: 1fr; } }
.box { padding: 20px; display: grid; gap: 16px; min-width: 0; }
.box h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.box .hint { margin: -8px 0 0; color: var(--ink-soft); font-size: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 520px) { .fgrid { grid-template-columns: 1fr; } }
.fgrid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 14px; padding: 10px 12px; color: #fff; font-size: 13px; }
.field select option { background: #1a0b0d; }
.field textarea { resize: vertical; min-height: 72px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.04); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); }
.toggles button[aria-pressed="true"] { background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); border-color: transparent; color: #fff; }
.fontes { display: grid; gap: 8px; }
.fonte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
.fonte.inativa { opacity: 0.55; }
.fonte .fn { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.fonte .meta { margin-top: 4px; }
.fonte .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, 0.15); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); }

.track { display: block; position: relative; margin: 0; padding: 2px 0; grid-template-columns: none; }
.trilho::before { content: ""; position: absolute; left: 22px; top: 4px; bottom: 4px; border-left: 1.5px dashed rgba(255, 255, 255, .13); }
.track button, .track button[class] { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 0; padding: 9px 18px 9px 38px; border: 0; border-radius: 0; background: none !important; box-shadow: none !important; color: var(--ink-soft); font-size: 13px; font-weight: 500; opacity: 1; transform: none; overflow: visible; position: relative; text-align: left; }
.track button::after { display: none; }
.track button:hover { color: rgba(255, 255, 255, .78); }
.track button:hover::before { content: ""; position: absolute; left: 22px; top: 0; height: 50%; width: 10px; border-left: 1.5px dashed rgba(255, 255, 255, .32); border-bottom: 1.5px dashed rgba(255, 255, 255, .32); border-bottom-left-radius: 9px; }
.track button[aria-selected="true"] { color: #fff; font-weight: 700; }
.track button[aria-selected="true"]::before { content: ""; position: absolute; left: 22px; top: 0; height: 50%; width: 10px; border-left: 1.5px dashed var(--red); border-bottom: 1.5px dashed var(--red); border-bottom-left-radius: 9px; }
.track .name { font-size: 13px; margin: 0; font-weight: inherit; }
.track .count { font: 600 11px var(--mono); color: var(--ink-faint); line-height: 1; }
.track button[aria-selected="true"] .count { color: var(--red); }
.track .step, .track .play { display: none; }
.side-pe { margin-top: auto; border-top: 1px solid var(--line); padding: 14px 18px 0; display: grid; gap: 4px; }
.side-pe .quem { margin-bottom: 8px; }
.side-pe .btn, .side-pe .btn.quiet { justify-content: flex-start; width: 100%; padding: 8px 0; border: 0; background: none; color: var(--ink-soft); font-weight: 500; }
.side-pe .btn:hover { color: #fff; background: none; }
.side-pe .notice { font-size: 11px; }
.quem .av { width: 30px; height: 30px; border-radius: 6px; background: var(--grad); font-size: 11px; font-weight: 800; }
.quem { font-weight: 700; font-size: 12.5px; }

.mtop { display: none; }
.veu-menu { position: fixed; inset: 0; background: rgba(3, 4, 8, .74); z-index: 39; }

/* conteúdo */
.wrap { max-width: 1500px; margin: 0; padding: 22px 26px 64px; }
.pg { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; padding-bottom: 16px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }

.kpi { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 14px; display: grid; gap: 6px; color: #fff; }

/* superfícies chapadas, sem vidro */

.box .hint, .hint { color: var(--ink-faint); font-size: 11px; }
.rside h3, .pdet h3, .auth-card h1 { font-family: var(--font-body); font-weight: 800; letter-spacing: -.02em; }
.rside h3 { font-size: 18px; }
.pdet h3 { font-size: 16px; }
.idea h3 { font-size: 14.5px; font-weight: 700; }

/* luz corrente discreta na borda dos painéis */
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
.box::before, .rcard::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--ang), transparent 0 72%, rgba(248, 57, 90, .34) 80%, rgba(255, 255, 255, .62) 86%, rgba(62, 221, 174, .30) 92%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: luz 7s linear infinite; }
@keyframes luz { to { --ang: 360deg; } }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 10px 16px; font-weight: 700; font-size: 13px; color: #fff; }

/* etiquetas contornadas */

.switch { width: 40px; height: 22px; background: var(--card-soft); border: 1px solid var(--line); }

    -webkit-mask: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(transparent, #000 12%, #000 88%, transparent); }

<script>
const KEY = "pauta-painel-v3";

/* Ideias, calendário e revisão vêm do Airtable (pelo conector no claude.ai, ou pelo fluxo 07 fora dele). */
let state = { ideias: [], posts: [] };
const pauta = { carregada: false, erro: null };

let tab = "ideias";
try { tab = localStorage.getItem(KEY + ":tab") || "ideias"; } catch (e) {}
let filtro = "Sugerida";
let abertoDescarte = null;
let flashId = null;

const STATUS = {
  Planejado: ["Planejado", ""], EmCriacao: ["Em criação", "acc"], AguardandoVideo: ["Aguardando vídeo", "acc"], VideoAnexado: ["Vídeo anexado", "acc"],
  EmRevisao: ["Em revisão", "warn"], Ajustes: ["IA ajustando", "warn"], Aprovado: ["Aprovado", "info"], Agendado: ["Agendado", "info"],
  Publicado: ["Publicado", "ok"], Erro: ["Erro", "bad"],
};
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtData = iso => { if (!iso) return "sem data"; const d = new Date(iso); return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} · ${String(d.getHours()).padStart(2, "0")}h${d.getMinutes() ? String(d.getMinutes()).padStart(2, "0") : ""}`; };
const chip = s => { const [txt, cls] = STATUS[s] || [s || "—", ""]; return `<span class="chip ${cls}">${esc(txt)}</span>`; };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200);
}

/* ---------- dados do Airtable ---------- */
const nomeSel = v => (v && typeof v === "object") ? v.name : (v ?? "");
function deIdeia(r) {
  return {
    id: r.id, titulo: r.Titulo || "", resumo: r.Resumo || "", formato: nomeSel(r.Formato), rede: nomeSel(r.Rede), pilar: nomeSel(r.Pilar),
    score: Number(r.Score) || 0, porQue: r.PorQueFunciona || "", refs: (r.Referencias || []).length,
    status: nomeSel(r.Status) || "Sugerida", motivo: r.MotivoDescarte || "", posts: (r.Calendario || []).map(x => (x && typeof x === "object") ? x.id : x),
  };
}
function dePost(r) {
  let slides = [];
  try {
    slides = JSON.parse(r.Slides || "[]").map((s, i) => ({ n: Number(s.n) || i + 1, t: s.titulo || s.visual || "", x: s.texto || s.fala_ou_texto || "", img: !!s.usa_imagem }));
  } catch (e) {}
  return {
    id: r.id, titulo: r.Titulo || "", data: r.DataPublicacao || null, rede: nomeSel(r.Rede), formato: nomeSel(r.Formato), pilar: nomeSel(r.Pilar),
    status: nomeSel(r.Status) || "Planejado", versao: r.Versao || 1, legenda: r.Legenda || "", hashtags: r.Hashtags || "", slides, link: r.LinkPublicado || "",
    ideia: ((r.Ideia || [])[0] && typeof r.Ideia[0] === "object") ? r.Ideia[0].id : (r.Ideia || [])[0] || null, clipes: r.Clipes || [], diag: (() => { const pad = { alinhar: "esquerda", posicao: "auto", modelo: "foto", logo: "auto", logoPos: "te" }; try { return Object.assign(pad, JSON.parse(r.Diagramacao || "{}")); } catch (e) { return pad; } })(), clipesSlides: (() => { try { return JSON.parse(r.ClipesSlides || "{}"); } catch (e) { return {}; } })(),
    arquivos: r.Arquivos || [], fotos: r.Fotos || [], artesProntas: r.ArtesProntas === true, imagensSlides: (() => { try { return JSON.parse(r.ImagensSlides || "{}"); } catch (e) { return {}; } })(),
  };
}
function receberPauta(ideias, posts) {
  if (ideias) state.ideias = ideias.map(deIdeia);
  if (posts) state.posts = posts.map(dePost).filter(p => p.data);
  // Na primeira carga, se não houver nada para decidir, abre mostrando todas as ideias.
  if (!pauta.carregada && ideias && filtro === "Sugerida" && !state.ideias.some(i => i.status === "Sugerida")) filtro = "Todas";
  pauta.carregada = true; pauta.erro = null;
  conferirDisparos();
  render();
}
async function carregarPauta() {
  try {
    const j = await api({ acao: "pauta" });
    receberPauta(j.ideias || [], j.posts || []);
  } catch (e) {
    pauta.erro = e; render();
  }
}
function semPauta() {
  if (M.modo === "web" && M.conexao === "login") return `<div class="glass empty">Entre com seu usuário para ver a pauta.</div>`;
  if (pauta.erro) {
    return `<div class="msg erro"><span>${esc(textoErro(pauta.erro))}</span><button class="btn" data-act="recarregar-pauta">Tentar de novo</button></div>`;
  }
  return `<div class="glass empty">Carregando a pauta do Airtable…</div>`;
}

/* ---------- Disparos: buscar ideias e criar post ---------- */
let calAberto = null, revAberto = null, timerDisparos = null;
const DISP_KEY = KEY + ":disparos", DISP_MAX = 12 * 60 * 1000;
let disparos = (() => { try { return JSON.parse(localStorage.getItem(DISP_KEY) || "{}"); } catch (e) { return {}; } })();
if (!disparos.posts) disparos.posts = {};
function salvarDisparos() { try { localStorage.setItem(DISP_KEY, JSON.stringify(disparos)); } catch (e) {} }
const buscandoIdeias = () => !!disparos.ideias && Date.now() - disparos.ideias.em < DISP_MAX;
const criando = id => !!disparos.posts[id];
function conferirDisparos() {
  const agora = Date.now();
  if (disparos.ideias) {
    const novas = state.ideias.filter(i => i.status === "Sugerida").length;
    if (agora - disparos.ideias.em > DISP_MAX) delete disparos.ideias;
    else if (novas > disparos.ideias.antes) { delete disparos.ideias; toast("Ideias novas chegaram. Veja em Para decidir."); filtro = "Sugerida"; }
  }
  for (const [id, d] of Object.entries(disparos.posts)) {
    const p = state.posts.find(x => x.id === id);
    const passou = agora - d.em;
    if (!p || passou > DISP_MAX) { delete disparos.posts[id]; continue; }
    if (!["Planejado", "EmCriacao", "Erro"].includes(p.status) || (p.status === "Erro" && passou > 90000)) {
      delete disparos.posts[id];
      toast(p.status === "Erro" ? 'Não deu para criar "' + p.titulo + '". Veja o aviso no Telegram.' : '"' + p.titulo + '" está pronto para revisão.');
    }
  }
  salvarDisparos();
  const ativo = disparos.ideias || Object.keys(disparos.posts).length;
  if (ativo && !timerDisparos && M.modo === "web") timerDisparos = setInterval(() => carregarPauta(), 45000);
  if (!ativo && timerDisparos) { clearInterval(timerDisparos); timerDisparos = null; }
}
async function disparar(corpo, aoComecar) {
  try {
    await api(corpo);
    aoComecar(); salvarDisparos(); conferirDisparos(); render();
  } catch (e) {
    toast("Não deu para começar: " + textoErro(e));
  }
}
const PI = { tema: "", quantidade: "10", formatos: [] };
function abrirPedidoIdeias() {
  const FORM = [["Reels", "Reels"], ["Carrossel", "Carrossel"], ["Estatico", "Estático"], ["Stories", "Stories"]];
  abrirDlg(`<h2>Buscar ideias novas</h2>
    <p class="hint">A IA lê as fontes ativas e sugere ideias para a marca. Tudo aqui é opcional.</p>
    <form onsubmit="return false" style="display:grid;gap:14px">
      <label class="field"><span>Tema (opcional)</span><input id="pi-tema" maxlength="300" placeholder="Ex.: segurança nos pagamentos, festival de verão, dicas para produtoras" value="${esc(PI.tema)}"></label>
      <div class="field"><span>Quantas ideias</span><div class="seg">${["5", "10", "15", "20"].map(q => `<button type="button" data-pi="qtd" data-v="${q}" aria-pressed="${PI.quantidade === q}">${q}</button>`).join("")}</div></div>
      <div class="field"><span>Formatos</span><div class="seg">
        <button type="button" data-pi="mix" aria-pressed="${!PI.formatos.length}">Misturado</button>
        ${FORM.map(([v, t]) => `<button type="button" data-pi="fmt" data-v="${v}" aria-pressed="${PI.formatos.includes(v)}">Só ${t}</button>`).join("")}
      </div><span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">Pode marcar mais de um formato. "Misturado" deixa a IA escolher.</span></div>
      <div class="actions"><button class="btn quiet" type="button" data-pi="cancelar">Cancelar</button><button class="btn primary" type="button" data-pi="buscar">Buscar ideias</button></div>
    </form>`);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pi]"); if (!b) return;
  const tema = document.getElementById("pi-tema"); if (tema) PI.tema = tema.value;
  const a = b.dataset.pi;
  if (a === "qtd") { PI.quantidade = b.dataset.v; return abrirPedidoIdeias(); }
  if (a === "mix") { PI.formatos = []; return abrirPedidoIdeias(); }
  if (a === "fmt") { const v = b.dataset.v; PI.formatos = PI.formatos.includes(v) ? PI.formatos.filter(x => x !== v) : PI.formatos.concat(v); return abrirPedidoIdeias(); }
  if (a === "cancelar") return fecharDlg();
  if (a === "buscar") { fecharDlg(); return buscarIdeias({ tema: PI.tema.trim(), quantidade: Number(PI.quantidade), formatos: PI.formatos }); }
});
function buscarIdeias(pedido) {
  if (buscandoIdeias()) return;
  if (!pedido) return abrirPedidoIdeias();
  disparar({ acao: "buscarIdeias", ...pedido }, () => {
    disparos.ideias = { em: Date.now(), antes: state.ideias.filter(i => i.status === "Sugerida").length };
    toast("Buscando ideias nas fontes. Leva alguns minutos; aviso aqui quando chegarem.");
  });
}
/* ---------- perguntas antes de criar o post ---------- */
const BR = { post: null, r: {} };
const PERGUNTAS = {
  capa: { titulo: "Capa (primeiro slide)", op: [["foto", "Foto"], ["video", "Vídeo"], ["texto", "Só texto"]] },
  fundo: { titulo: "Fundo dos outros slides", op: [["fotos", "Fotos"], ["videos", "Vídeos"], ["misto", "Misto"], ["texto", "Só texto"]] },
  fundoEst: { campo: "fundo", titulo: "Fundo do post", op: [["fotos", "Foto"], ["texto", "Só texto"]] },
  slides: { titulo: "Quantidade de slides", op: [["auto", "A IA decide"], ["5", "5"], ["7", "7"], ["10", "10"]] },
  duracao: { titulo: "Duração", op: [["15", "15 s"], ["30", "30 s"], ["45", "45 s"]] },
  cenas: { titulo: "Cenas", op: [["auto", "A IA decide"], ["3", "3"], ["4", "4"], ["5", "5"], ["6", "6"]] },
  textoNaTela: { titulo: "Texto na tela", op: [["sim", "Sim"], ["nao", "Não"]] },
  objetivo: { titulo: "Objetivo do post", op: [["", "A IA decide"], ["engajar", "Engajar"], ["educar", "Educar"], ["vender", "Vender"], ["institucional", "Marca"]] },
};
function perguntasDo(formato) {
  if (["Reels", "Stories"].includes(formato)) return ["duracao", "cenas", "textoNaTela", "objetivo"];
  if (formato === "Estatico") return ["fundoEst", "objetivo"];
  return ["capa", "fundo", "slides", "objetivo"];
}
function abrirBriefing(p) {
  const video = ["Reels", "Stories"].includes(p.formato);
  BR.post = p.id;
  BR.r = video ? { duracao: "30", cenas: "auto", textoNaTela: "sim", objetivo: "" } : { capa: "foto", fundo: "fotos", slides: "auto", objetivo: "" };
  desenharBriefing();
}
function desenharBriefing() {
  const p = state.posts.find(x => x.id === BR.post); if (!p) return fecharDlg();
  const blocos = perguntasDo(p.formato).map(k => {
    const q = PERGUNTAS[k], campo = q.campo || k;
    return `<div class="field"><span>${esc(q.titulo)}</span><div class="seg" role="group" aria-label="${esc(q.titulo)}">${q.op.map(([v, t]) =>
      `<button type="button" data-b="op" data-k="${campo}" data-v="${v}" aria-pressed="${String(BR.r[campo] ?? "") === v}">${esc(t)}</button>`).join("")}</div></div>`;
  }).join("");
  const r = BR.r;
  const videos = ["Reels", "Stories"].includes(p.formato) ? Number(r.cenas) || 4 : (r.capa === "video" ? 1 : 0) + (r.fundo === "videos" ? (Number(r.slides) || 7) - 2 : r.fundo === "misto" ? 2 : 0);
  abrirDlg(`<h2>Como vai ser este post?</h2>
    <p class="hint">${esc(p.titulo)} · ${esc(p.formato)} · ${esc(p.rede)}</p>
    <form onsubmit="return false" style="display:grid;gap:14px">
      ${blocos}
      <label class="field"><span>Observações (opcional)</span><textarea id="br-obs" rows="3" maxlength="1000" placeholder="Ex.: mostrar a pulseira em uso no bar, citar a promoção de sexta, evitar fundo branco">${esc(r.observacoes || "")}</textarea></label>
      ${videos ? `<p class="small" style="margin:0">Vai gerar cerca de ${videos} clipe${videos > 1 ? "s" : ""} de vídeo no Magnific, que gastam mais créditos que fotos e levam alguns minutos a mais.</p>` : ""}
      <div class="actions"><button class="btn quiet" type="button" data-b="cancelar">Cancelar</button><button class="btn primary" type="button" data-b="criar">Criar post</button></div>
    </form>`);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-b]"); if (!b) return;
  const obs = document.getElementById("br-obs");
  if (obs) BR.r.observacoes = obs.value;
  if (b.dataset.b === "op") { BR.r[b.dataset.k] = b.dataset.v; return desenharBriefing(); }
  if (b.dataset.b === "cancelar") return fecharDlg();
  if (b.dataset.b === "criar") {
    const p = state.posts.find(x => x.id === BR.post); fecharDlg();
    const br = { ...BR.r };
    for (const k of Object.keys(br)) if (br[k] === "" || br[k] === undefined) delete br[k];
    if (br.observacoes) br.observacoes = br.observacoes.trim();
    if (p) criarPost(p, br);
  }
});
function criarPost(p, briefing) {
  if (criando(p.id)) return;
  disparar({ acao: "criarPost", id: p.id, briefing: briefing || null }, () => {
    disparos.posts[p.id] = { em: Date.now() };
    toast('Criando "' + p.titulo + '". Em 2 a 4 minutos ele aparece na Revisão.');
  });
}

/* ---------- Agendar ideia e remover post ---------- */
const doisDig = n => String(n).padStart(2, "0");
function proximoDiaLivre() {
  const ocupados = new Set(state.posts.map(p => ymd(new Date(p.data))));
  const d = new Date(); d.setHours(0, 0, 0, 0);
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || ocupados.has(ymd(d)));
  return d;
}
function abrirAgenda(i, erro, valores) {
  const d = proximoDiaLivre();
  const data = (valores && valores.data) || ymd(d), hora = (valores && valores.hora) || "18:00";
  const noDia = state.posts.filter(p => ymd(new Date(p.data)) === data);
  abrirDlg(`<h2>Levar para o calendário</h2>
    <p class="hint">${esc(i.titulo)}</p>
    <form onsubmit="return false">
      <div class="fgrid">
        <label class="field"><span>Data</span><input id="ag-data" type="date" min="${ymd(new Date())}" value="${data}"></label>
        <label class="field"><span>Horário</span><input id="ag-hora" type="time" step="900" value="${hora}"></label>
      </div>
      <p class="small" id="ag-aviso" style="margin:0">${noDia.length ? `Já tem ${noDia.length} post neste dia: ${noDia.map(p => esc(p.titulo)).join(", ")}.` : "Dia livre."}</p>
      ${erro ? `<div class="msg erro">${esc(erro)}</div>` : ""}
      <div class="actions"><button class="btn quiet" type="button" data-u="fechar">Cancelar</button><button class="btn primary" data-u="agendar-ok" data-id="${i.id}">Agendar</button></div>
    </form>`);
}
document.addEventListener("change", e => {
  if (e.target.id !== "ag-data") return;
  const noDia = state.posts.filter(p => ymd(new Date(p.data)) === e.target.value);
  const av = document.getElementById("ag-aviso");
  if (av) av.textContent = noDia.length ? `Já tem ${noDia.length} post neste dia: ${noDia.map(p => p.titulo).join(", ")}.` : "Dia livre.";
});
async function confirmarAgenda(id) {
  const i = state.ideias.find(x => x.id === id); if (!i) return fecharDlg();
  const data = document.getElementById("ag-data").value, hora = document.getElementById("ag-hora").value;
  if (!data || !hora) return abrirAgenda(i, "Escolha a data e o horário.", { data, hora });
  const quando = new Date(data + "T" + hora + ":00");
  if (!(quando > new Date(Date.now() + 10 * 60000))) return abrirAgenda(i, "Escolha uma data e um horário no futuro.", { data, hora });
  try {
    if (M.modo === "web") {
      await api({ acao: "agendarIdeia", id, data: quando.toISOString(), titulo: i.titulo, rede: i.rede, formato: i.formato, pilar: i.pilar });
    } else {
      const c = AT.cal.f;
      await M.mcp.callTool(AT.server, "create_records_for_table", { baseId: AT.base, tableId: AT.cal.table, typecast: true, records: [{ fields: {
        [c.Titulo]: i.titulo, [c.Ideia]: [id], [c.DataPublicacao]: quando.toISOString(), [c.Rede]: i.rede || null, [c.Formato]: i.formato || null, [c.Pilar]: i.pilar || null, [c.Status]: "Planejado", [c.Versao]: 1 } }] });
      await M.mcp.callTool(AT.server, "update_records_for_table", { baseId: AT.base, tableId: AT.ideias.table, typecast: true, records: [{ id, fields: { [AT.ideias.f.Status]: "Aprovada" } }] });
    }
    fecharDlg();
    i.status = "Aprovada";
    toast(`Agendado para ${fmtData(quando.toISOString())}.`);
    if (M.modo === "web") await carregarPauta(); else recarregar();
  } catch (e) { abrirAgenda(i, textoErro(e), { data, hora }); }
}
function abrirMudarData(p, erro, valores) {
  const d = new Date(p.data);
  const data = (valores && valores.data) || ymd(d), hora = (valores && valores.hora) || doisDig(d.getHours()) + ":" + doisDig(d.getMinutes());
  abrirDlg(`<h2>Mudar data</h2>
    <p class="hint">${esc(p.titulo)} · hoje marcado para ${fmtData(p.data)}</p>
    <form onsubmit="return false">
      <div class="fgrid">
        <label class="field"><span>Data</span><input id="md-data" type="date" min="${ymd(new Date())}" value="${data}"></label>
        <label class="field"><span>Horário</span><input id="md-hora" type="time" step="900" value="${hora}"></label>
      </div>
      ${erro ? `<div class="msg erro">${esc(erro)}</div>` : ""}
      <div class="actions"><button class="btn quiet" type="button" data-md="cancelar">Cancelar</button><button class="btn primary" type="button" data-md="salvar" data-id="${p.id}">Salvar data</button></div>
    </form>`);
}
async function salvarNovaData(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return fecharDlg();
  const data = document.getElementById("md-data").value, hora = document.getElementById("md-hora").value;
  const quando = new Date(data + "T" + hora + ":00");
  if (!data || !hora || !(quando > new Date(Date.now() + 5 * 60000))) return abrirMudarData(p, "Escolha uma data e um horário no futuro.", { data, hora });
  try {
    if (M.modo === "web") await api({ acao: "reagendarPost", id, data: quando.toISOString() });
    else await M.mcp.callTool(AT.server, "update_records_for_table", { baseId: AT.base, tableId: AT.cal.table, records: [{ id, fields: { [AT.cal.f.DataPublicacao]: quando.toISOString() } }] });
    p.data = quando.toISOString(); fecharDlg(); render();
    toast("Nova data: " + fmtData(p.data) + ".");
    if (M.modo === "web") carregarPauta(); else recarregar();
  } catch (e) { abrirMudarData(p, textoErro(e), { data, hora }); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-md]"); if (!b) return;
  if (b.dataset.md === "cancelar") return fecharDlg();
  if (b.dataset.md === "salvar") return salvarNovaData(b.dataset.id);
  if (b.dataset.md === "publicar") return publicarAgora(b.dataset.id);
});

/* ---------- publicar agora ---------- */
function pedirPublicacao(p) {
  abrirDlg(`<h2>Publicar agora?</h2>
    <p class="hint">"${esc(p.titulo)}" vai para o ${esc(p.rede)} neste momento, em vez de ${fmtData(p.data)}. Isso posta de verdade e não dá para desfazer pelo painel.</p>
    <div class="actions"><button class="btn quiet" data-md="cancelar">Cancelar</button><button class="btn primary" data-md="publicar" data-id="${p.id}">Publicar agora</button></div>`);
}
let timersPublicar = [];
async function publicarAgora(id) {
  const p = state.posts.find(x => x.id === id); fecharDlg(); if (!p) return;
  try {
    await api({ acao: "publicarAgora", id });
    p.status = "Publicando"; render();
    toast("Publicando. Em até 1 minuto o link aparece aqui.");
    timersPublicar.forEach(clearTimeout);
    timersPublicar = [15, 45, 90, 180].map(seg => setTimeout(() => carregarPauta(), seg * 1000));
  } catch (e) { toast("Não deu para publicar: " + textoErro(e)); }
}
function miniatura(p) {
  const a = (p.arquivos || [])[0] || (p.fotos || [])[0];
  if (!a) return `<div class="mini">sem arte</div>`;
  if (ehArqVideo(a)) return `<div class="mini"><video src="${esc(a.url)}" muted playsinline preload="metadata"></video></div>`;
  return `<div class="mini" style="background-image:${cssUrl(urlArq(a))}"></div>`;
}
function linhaAgend(p) {
  let botoes = "";
  if (M.modo === "web") {
    if (p.status === "Agendado") botoes = `<button class="btn primary" data-act="publicar-agora" data-id="${p.id}" ${p.artesProntas ? "" : "disabled title=\"Faltam as artes finais\""}>Publicar agora</button><button class="btn" data-act="mudar-data" data-id="${p.id}">Mudar data</button>`;
    else if (p.status === "Erro") botoes = `<button class="btn" data-act="mudar-data" data-id="${p.id}">Mudar data</button>`;
  }
  if (p.link) botoes += `<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Ver publicado</a>`;
  return `<div class="arow">${miniatura(p)}
    <div><div class="at">${esc(p.titulo)}</div><div class="am"><b>${fmtData(p.data)}</b> · ${esc(p.rede)} · ${esc(p.formato)}</div>
      <div class="meta" style="margin-top:6px">${p.status === "Publicando" ? `<span class="chip warn">Publicando…</span>` : chip(p.status)}${p.status === "Agendado" && !p.artesProntas ? `<span class="chip bad">Sem artes finais</span>` : ""}</div>
      ${p.erro ? `<div class="small" style="margin-top:6px;color:#ffc2cd">${esc(p.erro)}</div>` : ""}</div>
    <div class="actions">${botoes}</div></div>`;
}
function renderAgend() {
  const el = document.getElementById("p-agend"); if (!el) return;

  const porData = (a, b) => new Date(a.data) - new Date(b.data);
  const fila = state.posts.filter(p => ["Agendado", "Publicando"].includes(p.status)).sort(porData);
  const feitos = state.posts.filter(p => p.status === "Publicado").sort((a, b) => porData(b, a));

function pedirRemocao(p) {
  abrirDlg(`<h2>Remover do calendário?</h2>

async function confirmarRemocao(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return fecharDlg();
  try {
    if (M.modo === "web") await api({ acao: "removerPost", id, ideia: p.ideia });
    else {
      if (p.ideia) await M.mcp.callTool(AT.server, "update_records_for_table", { baseId: AT.base, tableId: AT.ideias.table, typecast: true, records: [{ id: p.ideia, fields: { [AT.ideias.f.Status]: "Guardada" } }] });
      await M.mcp.callTool(AT.server, "delete_records_for_table", { baseId: AT.base, tableId: AT.cal.table, recordIds: [id] });
    }
    fecharDlg(); calAberto = null;
    state.posts = state.posts.filter(x => x.id !== id); render();
    toast("Post removido do calendário. A ideia está em Guardadas.");
    if (M.modo === "web") carregarPauta(); else recarregar();
  } catch (e) { fecharDlg(); toast("Não deu para remover: " + textoErro(e)); }
}

/* ---------- Calendário ---------- */
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
let mesVisto = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
function renderCal() {
  const el = document.getElementById("p-cal");
  const head = `<div class="panel-head"><p>Posts que vêm das ideias aprovadas. Clique em um post para ver os detalhes, mandar a IA criar ou tirar do calendário.</p></div>`;
  if (!pauta.carregada) { el.innerHTML = head + semPauta(); return; }
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const ano = mesVisto.getFullYear(), mes = mesVisto.getMonth();
  const doMes = (a, m) => state.posts.filter(p => { const d = new Date(p.data); return d.getFullYear() === a && d.getMonth() === m; });
  // Faixa de meses em páginas de 3 (trimestres), do ano passado ao ano que vem.
  const anoBase = hoje.getFullYear() - 1, paginas = [];
  for (let t = 0; t < 12; t++) {
    const meses = [0, 1, 2].map(k => { const a = anoBase + Math.floor((t * 3 + k) / 12), m = (t * 3 + k) % 12; return { a, m }; });
    paginas.push(`<div class="tri" data-tri="${t}">${meses.map(({ a, m }) => {
      const q = doMes(a, m).length;
      return `<button data-cal-mes="${a}-${m}" aria-pressed="${a === ano && m === mes}" class="${q ? "" : "vazio"}"><span>${MESES[m].slice(0, 3)} <small>${String(a).slice(2)}</small></span><b>${q}</b><i>${q === 1 ? "post" : "posts"}</i></button>`;
    }).join("")}</div>`);
  }
  const triAtual = Math.max(0, Math.min(11, (ano - anoBase) * 4 + Math.floor(mes / 3)));
  const inicio = new Date(ano, mes, 1); inicio.setDate(1 - ((inicio.getDay() + 6) % 7)); // segunda da 1ª semana
  const fimMes = new Date(ano, mes + 1, 0);
  const semanas = [];
  for (let w = 0; w < 6; w++) {
    const seg = new Date(inicio); seg.setDate(inicio.getDate() + w * 7);
    if (w > 3 && seg > fimMes) break;
    let dias = "";
    for (let d = 0; d < 7; d++) {
      const dia = new Date(seg); dia.setDate(seg.getDate() + d);
      const key = ymd(dia);
      const posts = state.posts.filter(p => ymd(new Date(p.data)) === key).sort((a, b) => new Date(a.data) - new Date(b.data));
      const cls = [key === ymd(hoje) ? "today" : dia < hoje ? "past" : "", dia.getMonth() !== mes ? "fora" : "", posts.length ? "" : "sem-post"].join(" ");
      dias += `<div class="day ${cls}"><div class="dlabel"><span>${DIAS[dia.getDay()]}</span><span>${doisDig(dia.getDate())}/${doisDig(dia.getMonth() + 1)}${key === ymd(hoje) ? " · hoje" : ""}</span></div>
        <div class="list">${posts.map(cardPost).join("")}</div></div>`;
    }
    semanas.push(`<div class="cal-week">${dias}</div>`);
  }
  const doMesAtual = doMes(ano, mes);
  el.innerHTML = head + `
    ${state.posts.length ? "" : `<div class="msg" style="margin-bottom:12px">Ainda não há posts no calendário. Leve uma ideia para o calendário na aba Ideias.</div>`}
    <div class="cal-nav">
      <h3>${MESES[mes][0].toUpperCase() + MESES[mes].slice(1)} de ${ano}</h3>
      <div class="actions"><button class="btn" data-cal="ant" aria-label="3 meses antes">‹</button><span class="tri-rotulo" id="tri-rotulo"></span><button class="btn" data-cal="prox" aria-label="Próximos 3 meses">›</button><button class="btn quiet" data-cal="hoje">Hoje</button></div>
    </div>
    <div class="ano" id="cal-ano" role="group" aria-label="Meses, de 3 em 3. Arraste para os lados." data-tri-atual="${triAtual}">${paginas.join("")}</div>
    <div class="cal glass">
      <div class="cal-head">${["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map(d => `<span>${d}</span>`).join("")}</div>
      ${semanas.join("")}
      ${doMesAtual.length ? "" : `<p class="small" style="padding:10px 6px;margin:0">Nenhum post em ${MESES[mes]}.</p>`}
    </div>
    ${detalhePost()}
    <div class="legend">${["Planejado", "EmCriacao", "EmRevisao", "Agendado", "Publicado", "Erro"].map(chip).join("")}</div>`;
  ligarFaixaMeses(triAtual);
}
// Faixa de trimestres: abre no trimestre do mês visto, as setas pulam 3 meses e o rótulo acompanha a rolagem.
let triVisto = null;
function ligarFaixaMeses(triAtual) {
  const faixa = document.getElementById("cal-ano"); if (!faixa) return;
  const ir = (t, suave) => faixa.scrollTo({ left: t * faixa.clientWidth, behavior: suave ? "smooth" : "auto" });
  const alvo = triVisto === null ? triAtual : triVisto;
  ir(alvo, false);
  // Com a aba escondida a faixa não tem largura; posiciona quando ela aparecer ou mudar de tamanho.
  let larg = faixa.clientWidth;
  new ResizeObserver(() => { if (faixa.clientWidth && faixa.clientWidth !== larg) { const t = larg ? Math.round(faixa.scrollLeft / larg) : alvo; larg = faixa.clientWidth; ir(t, false); rotulo(); } }).observe(faixa);
  const rotulo = () => {
    if (!faixa.clientWidth) return;
    const t = Math.round(faixa.scrollLeft / faixa.clientWidth); triVisto = t;
    const b = faixa.querySelectorAll(".tri")[t]; const r = document.getElementById("tri-rotulo");
    if (b && r) { const ms = [...b.querySelectorAll("[data-cal-mes]")].map(x => x.dataset.calMes.split("-").map(Number)); r.textContent = MESES[ms[0][1]].slice(0, 3) + " – " + MESES[ms[2][1]].slice(0, 3) + " " + ms[2][0]; }
  };
  rotulo();
  faixa.addEventListener("scroll", () => { clearTimeout(faixa._t); faixa._t = setTimeout(rotulo, 80); }, { passive: true });
  // Arrastar com o mouse também passa os trimestres.
  let x0 = null, s0 = 0, moveu = false;
  faixa.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; x0 = e.clientX; s0 = faixa.scrollLeft; moveu = false; });
  faixa.addEventListener("pointermove", e => { if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 6) { moveu = true; faixa.style.scrollSnapType = "none"; faixa.scrollLeft = s0 - dx; } });
  const soltar = () => { if (x0 === null) return; x0 = null; faixa.style.scrollSnapType = ""; if (moveu) ir(Math.round(faixa.scrollLeft / faixa.clientWidth), true); };
  faixa.addEventListener("pointerup", soltar); faixa.addEventListener("pointerleave", soltar);
  faixa.addEventListener("click", e => { if (moveu) { e.stopPropagation(); e.preventDefault(); moveu = false; } }, true);
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-cal-mes]");
  const n = e.target.closest("[data-cal]");
  if (!m && !n) return;
  const faixa = document.getElementById("cal-ano");
  if (!m && faixa && (n.dataset.cal === "ant" || n.dataset.cal === "prox")) {
    // As setas só passam a faixa de 3 em 3 meses; o mês aberto muda quando você clica em um deles.
    const t = Math.round(faixa.scrollLeft / faixa.clientWidth) + (n.dataset.cal === "prox" ? 1 : -1);
    faixa.scrollTo({ left: Math.max(0, t) * faixa.clientWidth, behavior: "smooth" });
    return;
  }
  if (m) { const [a, mm] = m.dataset.calMes.split("-").map(Number); mesVisto = new Date(a, mm, 1); }
  else { const d = new Date(); mesVisto = new Date(d.getFullYear(), d.getMonth(), 1); triVisto = null; }
  renderCal();
});

const urlArq = a => (a && a.thumbnails && a.thumbnails.large && a.thumbnails.large.url) || (a && a.url) || "";
function coresMarca() {

}
// Quatro versões: Logo (light, para fundo escuro), LogoDark (para fundo claro) e os símbolos light e dark.
const anexoMarca = (campo, cheio) => { const a = ((M.marca && M.marca[campo]) || [])[0]; return a ? (cheio ? urlCheia(a) : urlArq(a)) : ""; };
const VERSOES = { light: "Logo", dark: "LogoDark", simLight: "SimboloLight", simDark: "SimboloDark" };
function urlsLogos(cheio) { const o = {}; for (const [k, c] of Object.entries(VERSOES)) o[k] = anexoMarca(c, cheio); return o; }
function ordemLogos(fundoClaro, simbolo) {
  if (simbolo) return fundoClaro ? ["simDark", "dark", "simLight", "light"] : ["simLight", "light", "simDark", "dark"];
  return fundoClaro ? ["dark", "simDark", "light", "simLight"] : ["light", "simLight", "dark", "simDark"];
}
function escolherLogo(opcoes, fundoClaro, simbolo) { for (const k of ordemLogos(fundoClaro, simbolo)) if (opcoes[k]) return opcoes[k]; return null; }

  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });

// Mede o fundo atrás do logo no canvas para escolher a versão clara ou escura.

  try {

    let soma = 0, q = 0;
    for (let i = 0; i < d.length; i += 4 * 9) { soma += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; q++; }

function logoMarca() { return escolherLogo(urlsLogos(false), false, false) || ""; }

// Liga cada slide à sua imagem. Se há uma arte por slide (Canva), a imagem já é o slide pronto.
function imagensDoPost(p) {

const CHAVE_SESSAO = "pauta-painel-sessao";
const sessao = {
  ler() { try { return JSON.parse(sessionStorage.getItem(CHAVE_SESSAO) || localStorage.getItem(CHAVE_SESSAO) || "null"); } catch (e) { return null; } },
  salvar(v, lembrar) { try { const t = JSON.stringify(v); sessionStorage.setItem(CHAVE_SESSAO, t); if (lembrar) localStorage.setItem(CHAVE_SESSAO, t); } catch (e) {} },
  apagar() { try { for (const k of [CHAVE_SESSAO, "pauta-painel-senha"]) { sessionStorage.removeItem(k); localStorage.removeItem(k); } } catch (e) {} },
};
const U = { token: "", usuario: null, tela: "login", erro: "", ocupado: false };
async function chamar(url, headers, corpo) {
  let r;
  try {
    r = await fetch(url, { method: "POST", cache: "no-store", headers: { "Content-Type": "application/json", ...headers }, body: JSON.stringify(corpo) });
  } catch (e) {
    throw { web: true, message: "Não consegui falar com o n8n. Confira sua internet e se o fluxo 07 (API do painel) está ativo." };
  }
  if (r.status === 404) throw { web: true, message: "O fluxo 07 (API do painel) não está ativo no n8n." };
  let j = null;
  try { j = await r.json(); } catch (e) {}
  if (url === API_SENHA && (r.status === 401 || r.status === 403) && !j) throw { web: true, message: "Senha do painel incorreta." };
  if (!r.ok || !j || j.ok === false) throw { web: true, status: r.status, login: !!(j && j.login), semUsuarios: !!(j && j.semUsuarios), message: (j && j.erro) || ("O n8n respondeu com erro " + r.status + ".") };
  return j;
}
async function api(corpo) {
  try { return await chamar(API, { "x-pauta-token": U.token }, corpo); }
  catch (e) { if (e.login) sairLocal("Sua sessão expirou. Entre de novo."); throw e; }
}
async function carregarWeb() {
  const j = await api({ acao: "listar" });
  M.marca = j.marca || null; M.fontes = j.fontes || [];
  M.marcaCarregada = true; M.fontesCarregadas = true; M.conexao = "ok"; M.erro = null;
}
async function iniciarWeb() {
  U.tela = "ok"; U.erro = ""; renderAuth();
  M.conexao = "carregando"; M.ocupado = true; renderMarca();
  try { await carregarWeb(); M.marcaSuja = false; carregarPauta(); } catch (e) { M.erro = e; if (M.conexao !== "login") M.conexao = "negado"; }
  M.ocupado = false; renderMarca(); renderAuth();
}
async function entrar(email, senha, lembrar) {
  U.ocupado = true; U.erro = ""; renderAuth();
  try {
    const r = await chamar(API, {}, { acao: "entrar", email, senha, lembrar });
    U.token = r.token; U.usuario = r.usuario;
    sessao.salvar({ token: r.token, usuario: r.usuario }, lembrar);
    U.ocupado = false;
    return iniciarWeb();
  } catch (e) {
    U.ocupado = false;
    if (e.semUsuarios) { U.tela = "primeiro"; U.erro = ""; }
    else U.erro = textoErro(e);
    renderAuth();
  }
}
async function primeiroAcesso(d) {
  U.ocupado = true; U.erro = ""; renderAuth();
  try {
    await chamar(API_SENHA, { "x-pauta-senha": d.senhaPainel }, { acao: "salvarUsuario", usuario: { nome: d.nome, email: d.email, senha: d.senha, papel: "Admin" } });
    U.ocupado = false;
    return entrar(d.email, d.senha, true);
  } catch (e) { U.ocupado = false; U.erro = textoErro(e); renderAuth(); }
}

  U.token = ""; U.usuario = null; sessao.apagar();

  M.marca = null; M.fontes = []; M.marcaCarregada = M.fontesCarregadas = false; M.erro = null; M.conexao = "login";

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-u]"); if (!b) return;

  const val = k => (document.getElementById(k)?.value || "").trim();

    if (!d.senhaPainel || !d.nome || !d.email || !d.senha) { U.erro = "Preencha todos os campos."; return renderAuth(); }
    if (d.senha.length < 8) { U.erro = "A senha precisa ter pelo menos 8 caracteres."; return renderAuth(); }
    if (d.senha !== document.getElementById("pa-senha2").value) { U.erro = "As senhas não são iguais."; return renderAuth(); }

document.addEventListener("keydown", e => {

const paraIds = (f, campos) => Object.fromEntries(Object.entries(campos).map(([k, x]) => [f[k], x]));
async function executar(op, dados, ok) {
  M.ocupado = true; M.aviso = null; renderStatus();
  try {
    if (M.modo === "web") {
      await api({ acao: op, ...dados });
    } else {
      const t = op === "salvarMarca" ? AT.marca : op === "salvarIdeia" ? AT.ideias : AT.fontes;
      if (op === "removerFonte") {
        await M.mcp.callTool(AT.server, "delete_records_for_table", { baseId: AT.base, tableId: t.table, recordIds: [dados.id] });
      } else {
        const fields = paraIds(t.f, dados.campos);
        await M.mcp.callTool(AT.server, dados.id ? "update_records_for_table" : "create_records_for_table",
          { baseId: AT.base, tableId: t.table, typecast: true, records: [dados.id ? { id: dados.id, fields } : { fields }] });
      }
    }
    M.aviso = { tipo: "ok", texto: ok };
    await recarregar();
    return true;
  } catch (e) {
    const talvez = e && (e.code === "server_unavailable" || e.code === "upstream_error");
    M.aviso = { tipo: "erro", texto: textoErro(e) + (talvez ? " A alteração pode ter sido gravada; a lista vai recarregar." : "") };
    if (talvez) recarregar();
    return false;
  } finally { M.ocupado = false; renderStatus(); }
}

const v = id => (document.getElementById(id)?.value ?? "").trim();
async function salvarMarca() {
  const f = { Perfil: "Perfil", Nome: "Nome", Posicionamento: "Posicionamento", Publico: "Publico", TomDeVoz: "TomDeVoz", Evitar: "Evitar", ExemplosBons: "ExemplosBons", Pilares: "Pilares", Redes: "Redes", FrequenciaSemanal: "FrequenciaSemanal", Idioma: "Idioma", Cores: "Cores", Logo: "Logo" };
  const pilares = [...document.querySelectorAll('#m-pilares [aria-pressed="true"]')].map(b => b.dataset.valor);
  const redes = [...document.querySelectorAll('#m-redes [aria-pressed="true"]')].map(b => b.dataset.valor);
  if (!v("m-nome")) { M.aviso = { tipo: "erro", texto: "Preencha pelo menos o nome da marca." }; return renderStatus(); }
  const freq = parseInt(v("m-freq"), 10);
  const campos = {
    [f.Nome]: v("m-nome"), [f.Posicionamento]: v("m-pos"), [f.Publico]: v("m-pub"), [f.TomDeVoz]: v("m-tom"),
    [f.Evitar]: v("m-evitar"), [f.ExemplosBons]: v("m-exemplos"), [f.Pilares]: pilares, [f.Redes]: redes,
    [f.FrequenciaSemanal]: Number.isFinite(freq) ? freq : null,
    [f.Idioma]: v("m-idioma") || null,
    [f.Perfil]: v("m-perfil").replace(/^@+/, "") || null,
    [f.Cores]: [...document.querySelectorAll("#m-cores .cor")].map(r => {
      const hex = r.querySelector(".hex").value.trim().toUpperCase();
      return /^#[0-9A-F]{6}$/.test(hex) ? (hex + " " + r.querySelector(".nome").value.trim()).trim() : null;
    }).filter(Boolean).join("\n"),
  };
  const logo = v("m-logo");
  if (logo) {
    if (!/^https:\/\//i.test(logo)) { M.aviso = { tipo: "erro", texto: "O link do logo precisa começar com https://" }; return renderStatus(); }
    campos[f.Logo] = [{ url: logo }];
  }
  const ok = await executar("salvarMarca", { id: M.marca ? M.marca.id : null, campos }, "Marca salva no Airtable.");
  if (ok) M.marcaSuja = false;
  renderStatus();
}
async function salvarFonte() {
  const f = { Nome: "Nome", Tipo: "Tipo", Rede: "Rede", Categoria: "Categoria", URL: "URL", Peso: "Peso", Ativa: "Ativa" };
  if (!v("f-nome")) { M.aviso = { tipo: "erro", texto: "Preencha o nome da fonte (ex.: @perfil, #hashtag ou um tema)." }; return renderStatus(); }
  const peso = parseInt(v("f-peso"), 10);
  const campos = {
    [f.Nome]: v("f-nome"), [f.Tipo]: v("f-tipo") || null, [f.Rede]: v("f-rede") || null, [f.Categoria]: v("f-cat") || null,
    [f.URL]: v("f-url") || null, [f.Peso]: Number.isFinite(peso) ? Math.min(5, Math.max(1, peso)) : 3,
    [f.Ativa]: document.getElementById("f-ativa")?.getAttribute("aria-checked") === "true",
  };
  const novo = M.editando === "novo";
  const ok = await executar("salvarFonte", { id: novo ? null : M.editando, campos }, novo ? "Fonte adicionada." : "Fonte atualizada.");
  if (ok) { M.editando = null; renderFontes(); }
}

  el.innerHTML = `<span class="actions"><span class="live ${cls}">${txt}</span></span>`;
  const av = document.getElementById("m-aviso");
  if (av) av.innerHTML = M.aviso ? `<div class="msg ${M.aviso.tipo}">${esc(M.aviso.texto)}</div>` : (M.marcaSuja ? `<div class="msg">Há alterações na marca que ainda não foram salvas.</div>` : "");
  document.querySelectorAll("[data-m='salvar-marca'], [data-m='salvar-fonte']").forEach(b => (b.disabled = M.ocupado));
  const ativas = M.fontes.filter(x => x.Ativa === true).length;
  document.getElementById("c-marca").textContent = M.fontesCarregadas ? String(ativas).padStart(2, "0") : "–";
  sincronizarCasca();
}
function renderFontes() {
  const el = document.getElementById("m-fontes"); if (!el) return;
  if (!M.fontesCarregadas) { el.innerHTML = `<div class="msg">Carregando as fontes…</div>`; return; }
  const linhas = M.fontes.map(x => {
    if (M.editando === x.id) return formFonte(x);
    const ativa = x.Ativa === true;
    const rm = M.remover === x.id
      ? `<button class="btn" data-m="remover-ok" data-id="${x.id}">Remover de vez</button><button class="btn quiet" data-m="remover-nao">Cancelar</button>`
      : `<button class="btn quiet" data-m="editar" data-id="${x.id}">Editar</button><button class="btn quiet" data-m="remover" data-id="${x.id}">Remover</button>`;
    return `<div class="fonte ${ativa ? "" : "inativa"}">
      <button class="switch" role="switch" aria-checked="${ativa}" aria-label="Fonte ativa" data-m="ativa" data-id="${x.id}"></button>
      <div><div class="fn">${esc(x.Nome || "(sem nome)")}</div>
        <div class="meta">${[selNome(x.Tipo), selNome(x.Rede), selNome(x.Categoria)].filter(Boolean).map(t => `<span class="chip plain">${esc(rot(t))}</span>`).join("")}<span class="chip plain">peso ${x.Peso ?? 3}</span></div></div>
      <div class="acts">${rm}</div></div>`;
  }).join("");
  el.innerHTML = (M.editando === "novo" ? formFonte(null) : "") + (linhas || (M.editando === "novo" ? "" : `<div class="msg">Nenhuma fonte ainda. Adicione perfis de concorrentes, hashtags e temas da sua marca.</div>`));
}
function formFonte(x) {
  const ativa = x ? x.Ativa === true : true;
  return `<div class="glass box" style="border-radius:16px">
    <div class="fgrid">
      <label class="field full"><span>Nome (@perfil, #hashtag ou tema)</span><input id="f-nome" value="${esc(x?.Nome || "")}" placeholder="@concorrente"></label>
      <label class="field"><span>Tipo</span><select id="f-tipo">${opcoes(OPC.Tipo, selNome(x?.Tipo) || "Perfil")}</select></label>
      <label class="field"><span>Rede</span><select id="f-rede">${opcoes(OPC.RedeFonte, selNome(x?.Rede) || "Instagram")}</select></label>
      <label class="field"><span>Categoria</span><select id="f-cat">${opcoes(OPC.Categoria, selNome(x?.Categoria), "Sem categoria")}</select></label>
      <label class="field"><span>Peso (1 a 5)</span><input id="f-peso" type="number" min="1" max="5" value="${x?.Peso ?? 3}"></label>
      <label class="field full"><span>Link (opcional)</span><input id="f-url" value="${esc(x?.URL || "")}" placeholder="https://"></label>
    </div>
    <div class="actions" style="justify-content:space-between">
      <span class="actions"><button class="switch" role="switch" id="f-ativa" aria-checked="${ativa}" data-m="ativa-form" aria-label="Fonte ativa"></button><span class="small">Ativa na coleta de ideias</span></span>
      <span class="actions"><button class="btn quiet" data-m="cancelar-fonte">Cancelar</button><button class="btn primary" data-m="salvar-fonte">${x ? "Salvar fonte" : "Adicionar fonte"}</button></span>
    </div>
    <p class="hint" style="margin:0">Perfis e hashtags do Instagram e do TikTok são coletados automaticamente. Os outros tipos entram como temas de interesse para a IA.</p>
  </div>`;
}
function renderMarca() {
  const el = document.getElementById("p-marca"); if (!el) return;
  const head = `<div class="panel-head"><p>O que você salvar aqui vai direto para o Airtable.</p><div id="m-status"></div></div>`;
  if (M.conexao === "indisponivel") {
    el.innerHTML = head + `<div class="glass empty">Para editar a marca e as fontes, abra este painel no claude.ai com o conector do Airtable conectado à sua conta.</div>`;
    return renderStatus();
  }
  if (M.conexao === "login") {
    el.innerHTML = head + `<div class="glass empty">Entre com seu usuário para ver a marca e as fontes.</div>`;
    return renderStatus();
  }
  if (M.conexao === "negado" || (M.erro && !M.marcaCarregada)) {
    el.innerHTML = head + `<div class="msg erro"><span>${esc(textoErro(M.erro))}</span><button class="btn" data-m="tentar">Tentar de novo</button></div>`;
    return renderStatus();
  }
  if (!M.marcaCarregada) { el.innerHTML = head + `<div class="glass empty">Carregando a marca e as fontes do Airtable…</div>`; return renderStatus(); }
  const m = M.marca || {};
  const pil = (m.Pilares || []).map(selNome), red = (m.Redes || []).map(selNome);
  const todosPilares = [...new Set([...OPC.Pilares, ...pil, ...M.pilaresExtra])];
  el.innerHTML = head + `<div class="mgrid">
    <form class="glass box" id="m-form" onsubmit="return false">
      <h2>Marca</h2>
      <p class="hint">Quanto mais concreto, melhor a IA acerta o tom.</p>
      <div class="fgrid">
        <label class="field full"><span>Nome da marca</span><input id="m-nome" value="${esc(m.Nome || "")}"></label>
        <label class="field full"><span>Posicionamento</span><textarea id="m-pos" placeholder="O que a marca é e por que existe, em 2 ou 3 frases">${esc(m.Posicionamento || "")}</textarea></label>
        <label class="field full"><span>Público</span><textarea id="m-pub" placeholder="Idade, momento de vida, dores e desejos">${esc(m.Publico || "")}</textarea></label>
        <label class="field full"><span>Tom de voz</span><textarea id="m-tom" placeholder="Ex.: próxima, direta, bem-humorada sem forçar">${esc(m.TomDeVoz || "")}</textarea></label>
        <div class="field full"><span>Pilares de conteúdo</span>${toggles("m-pilares", todosPilares, pil)}
          <span class="actions"><input id="m-novo-pilar" placeholder="Novo pilar" style="max-width:220px"><button type="button" class="btn quiet" data-m="add-pilar">+ Adicionar</button></span></div>
        <div class="field full"><span>Redes onde publica</span>${toggles("m-redes", OPC.Redes, red)}</div>
        <label class="field"><span>Perfil nas redes (@)</span><input id="m-perfil" placeholder="@suamarca" value="${esc(m.Perfil ? "@" + String(m.Perfil).replace(/^@+/, "") : "")}"></label>
        <label class="field"><span>Idioma das postagens</span><select id="m-idioma">${opcoes(OPC.Idioma, selNome(m.Idioma) || "Português (Brasil)")}</select></label>
        <div class="field full"><span>Cores da marca</span>
          <div class="paleta" id="m-paleta" aria-hidden="true">${lerCores(m.Cores).map(c => `<i style="background:${c.hex}"></i>`).join("")}</div>
          <div class="cores" id="m-cores">${lerCores(m.Cores).map(linhaCor).join("")}</div>
          <span class="actions"><button type="button" class="btn quiet" data-m="add-cor">+ Adicionar cor</button></span></div>
        <div class="field full"><span>Logos</span>
          <label class="check-tratar"><input type="checkbox" id="m-tratar" ${tratarLogos ? "checked" : ""}> Tratar ao enviar: tirar o fundo, recortar as sobras e criar a versão light ou dark que faltar</label>
          <div class="logos">${slotLogo(m, "Logo", "Logo light", "Para fundos escuros", "escuro")}${slotLogo(m, "LogoDark", "Logo dark", "Para fundos claros", "claro")}${slotLogo(m, "SimboloLight", "Símbolo light", "Só o símbolo, fundos escuros", "escuro")}${slotLogo(m, "SimboloDark", "Símbolo dark", "Só o símbolo, fundos claros", "claro")}</div>
          <p class="hint" style="margin:0">Nas artes, o painel usa a versão que contrasta com o fundo de cada imagem. PNG ou SVG com fundo transparente, até 5 MB.</p></div>
        <div class="field full"><span>Mood board (opcional)</span>
          <div class="mood">${(m.MoodBoard || []).map(a => `<figure><img src="${esc(urlArq(a))}" alt="" onerror="this.style.display='none'"><button type="button" data-m="mood-rm" data-id="${esc(a.id)}" aria-label="Remover imagem">✕</button></figure>`).join("")}</div>
          <span class="actions"><label class="btn quiet" ${M.modo === "web" ? "" : "hidden"}>+ Adicionar imagens<input type="file" class="arquivo-oculto" data-arquivo="MoodBoard" accept="image/png,image/jpeg,image/webp" multiple></label></span>
          <p class="hint" style="margin:0">Referências visuais da marca: fotos, texturas, paletas. A IA usa como direção de arte ao criar as fotos e os vídeos.${M.modo === "web" ? "" : " Para enviar arquivos, abra pelo link do GitHub ou arraste no campo MoodBoard do Airtable."}</p></div>
        <label class="field full"><span>O que evitar</span><textarea id="m-evitar" placeholder="Assuntos, palavras e estilos proibidos">${esc(m.Evitar || "")}</textarea></label>
        <label class="field"><span>Posts por semana</span><input id="m-freq" type="number" min="0" max="50" value="${m.FrequenciaSemanal ?? ""}"></label>
        <label class="field full"><span>Exemplos de posts que representam a marca (links)</span><textarea id="m-exemplos">${esc(m.ExemplosBons || "")}</textarea></label>
      </div>
      <div id="m-aviso"></div>
      <div class="actions" style="justify-content:flex-end"><button class="btn primary" data-m="salvar-marca">Salvar marca</button></div>
    </form>
    <section class="glass box">
      <div class="actions" style="justify-content:space-between"><h2>Fontes</h2><button class="btn" data-m="nova-fonte">+ Nova fonte</button></div>
      <p class="hint">A coleta lê as fontes ativas quando você clica em Buscar ideias novas, na aba Ideias.</p>
      <div class="fontes" id="m-fontes"></div>
    </section>
  </div>`;
  renderFontes(); renderStatus();
}

function pintarPaleta() {
  const p = document.getElementById("m-paleta"); if (!p) return;
  p.innerHTML = [...document.querySelectorAll("#m-cores .hex")].map(i => i.value.trim()).filter(h => /^#[0-9a-f]{6}$/i.test(h)).map(h => `<i style="background:${h}"></i>`).join("");
}
document.addEventListener("input", e => {
  if (!e.target.closest("#m-form")) return;
  M.marcaSuja = true; M.aviso = null;
  const linha = e.target.closest(".cor");
  if (linha && e.target.type === "color") linha.querySelector(".hex").value = e.target.value.toUpperCase();
  if (linha && e.target.classList.contains("hex") && /^#[0-9a-f]{6}$/i.test(e.target.value.trim())) linha.querySelector('input[type="color"]').value = e.target.value.trim().toLowerCase();
  if (linha) pintarPaleta();
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  const a = b.dataset.m, id = b.dataset.id;
  if (a === "toggle") { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); M.marcaSuja = true; M.aviso = null; return renderStatus(); }
  if (a === "add-pilar") { const n = v("m-novo-pilar"); if (n) { M.pilaresExtra.push(n); const box = document.getElementById("m-pilares"); box.insertAdjacentHTML("beforeend", `<button type="button" data-m="toggle" data-valor="${esc(n)}" aria-pressed="true">${esc(n)}</button>`); document.getElementById("m-novo-pilar").value = ""; M.marcaSuja = true; renderStatus(); } return; }
  if (a === "add-cor") { document.getElementById("m-cores").insertAdjacentHTML("beforeend", linhaCor({ hex: "#FF3347", nome: "" })); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "rm-cor") { b.closest(".cor").remove(); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "salvar-marca") return salvarMarca();
  if (a === "logo-rm") { if (await executar("salvarMarca", { id: M.marca.id, campos: { [id]: [] } }, "Arquivo removido.")) renderMarca(); return; }
  if (a === "mood-rm") {
    const resto = (M.marca.MoodBoard || []).filter(x => x.id !== id).map(x => ({ id: x.id }));
    if (await executar("salvarMarca", { id: M.marca.id, campos: { MoodBoard: resto } }, "Imagem removida do mood board.")) renderMarca();
    return;
  }
  if (a === "tentar") return tentarDeNovo();
  if (a === "nova-fonte") { M.editando = "novo"; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "editar") { M.editando = id; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "cancelar-fonte") { M.editando = null; return renderFontes(); }
  if (a === "ativa-form") { b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"); return; }
  if (a === "salvar-fonte") return salvarFonte();
  if (a === "ativa") {
    const x = M.fontes.find(y => y.id === id); if (!x || M.ocupado) return;
    const nova = x.Ativa !== true; x.Ativa = nova; renderFontes();
    const ok = await executar("salvarFonte", { id, campos: { Ativa: nova } }, nova ? "Fonte ativada." : "Fonte pausada.");
    if (!ok) { x.Ativa = !nova; renderFontes(); }
    return;
  }
  if (a === "remover") { M.remover = id; return renderFontes(); }
  if (a === "remover-nao") { M.remover = null; return renderFontes(); }
  if (a === "remover-ok") {
    const ok = await executar("removerFonte", { id }, "Fonte removida.");
    if (ok) { M.fontes = M.fontes.filter(y => y.id !== id); M.remover = null; renderFontes(); }
  }
});

(async () => {
  renderMarca();
  const c = window.claude;
  M.mcp = c && typeof c.use === "function" ? await c.use("mcp").catch(() => null) : null;
  if (M.mcp) return conectar();
  // Fora do claude.ai (ex.: GitHub Pages): login por usuário, pelo fluxo 07 do n8n.
  M.modo = "web";
  const salva = sessao.ler();
  if (salva && salva.token) { U.token = salva.token; U.usuario = salva.usuario || null; return iniciarWeb(); }
  M.conexao = "login"; renderMarca(); renderAuth();
})();

render();
// Fora do claude.ai, atualiza a pauta a cada 90 s enquanto a página está aberta.
setInterval(() => { if (M.modo === "web" && U.token && !document.hidden) carregarPauta(); }, 90000);
</script>
</body>
</html>
