<title>Content Post</title>
<link rel="icon" type="image/png" href="marca/content-post-icone.png">
<link rel="apple-touch-icon" href="marca/content-post-icone.png">
<meta property="og:image" content="marca/content-post-capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700;800&family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Playfair+Display:ital,wght@0,700;0,800;1,500;1,700&family=DM+Serif+Display:ital@0;1&display=swap">
<style>
/* Identidade do admin da Easypeasy Pay: navy quase preto, cartões chapados com borda de 1px,
   acento vermelho-rosa em gradiente, Poppins + IBM Plex Mono, rótulos pequenos em caixa alta,
   etiquetas contornadas, menu lateral com trilho tracejado. Tema único escuro. */
:root {
  color-scheme: dark;
  --bg: #0A0C15;
  --card: #191B25;
  --card-soft: #15171F;
  --glow: #F8395A;
  --ink: #ffffff;
  --ink-body: #c8cad3;
  --ink-soft: #8A8D9C;
  --ink-faint: #5D6070;
  --glass: #191B25;
  --glass-red: #191B25;
  --line: #2A2C38;
  --line-strong: #353846;
  --red: #F8395A;
  --red-deep: #C8102E;
  --pink: #F8395A;
  --pink-soft: #FF8FA3;
  --orange: #FFB84D;
  --orange-deep: #F59E0B;
  --ok: #3EDDAE;
  --warn: #FFB84D;
  --info: #8A8D9C;
  --bad: #F8395A;
  --grad: linear-gradient(140deg, #FF5F7A, #F8395A 55%, #C8102E);
  --font-display: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Poppins", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", ui-monospace, monospace;
  --radius: 9px;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background:
    radial-gradient(900px 520px at 18% -8%, rgba(190, 20, 32, 0.55), transparent 70%),
    radial-gradient(700px 600px at 92% 30%, rgba(120, 10, 20, 0.45), transparent 70%),
    radial-gradient(800px 500px at 40% 110%, rgba(140, 12, 24, 0.35), transparent 70%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  min-height: 100%;
}
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 72px; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pink); outline-offset: 3px; }

/* vidro: o material básico das superfícies */
.glass {
  background: linear-gradient(180deg, var(--glass-red), var(--glass));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 18px 40px -24px rgba(0, 0, 0, 0.8);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}

/* topo */
.top { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: flex-end; }
.top + .track { margin-top: 18px; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 46px); letter-spacing: -0.01em; }
.top h1 span { display: block; color: var(--ink-faint); font-weight: 600; }
.top .sub { color: var(--ink-soft); margin-top: 10px; max-width: 52ch; }
.notice { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-soft); padding: 7px 14px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.notice::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink-faint); text-decoration: underline; font-size: 12px; }
.linkbtn:hover { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* etapas = cartões em gradiente, como "Global Hits 50" */
.track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 28px; }
@media (max-width: 960px) { .track { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.track .t-marca { background: linear-gradient(160deg, #ff8a5c 0%, #ff4d3d 45%, #9e0f1c 100%); }
.track .t-marca[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 77, 61, 0.65); }
.track button {
  position: relative; overflow: hidden; border: 0; text-align: left; border-radius: var(--radius);
  padding: 16px 18px 18px; display: grid; gap: 6px; min-height: 148px; align-content: start;
  color: #fff; opacity: 0.72; transition: opacity .2s, transform .2s, box-shadow .2s;
}
.track button:hover { opacity: 0.92; }
.track button[aria-selected="true"] { opacity: 1; transform: translateY(-2px); }
.track .t-ideias { background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%); }
.track .t-cal { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.track .t-rev { background: linear-gradient(160deg, #ff4f8b 0%, #e0204f 45%, #8f0b2a 100%); }
.track .t-ideias[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 51, 71, 0.65); }
.track .t-cal[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(255, 138, 30, 0.6); }
.track .t-rev[aria-selected="true"] { box-shadow: 0 18px 40px -12px rgba(224, 32, 79, 0.65); }
.track button::after { /* reflexo de vidro */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 85% 110%, rgba(0, 0, 0, 0.28), transparent 60%), linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%);
}
.track .step { justify-self: start; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.22); }
.track .name { font-size: 18px; font-weight: 600; margin-top: 6px; }
.track .count { font-size: 46px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.track .play { position: absolute; right: 16px; bottom: 16px; width: 0; height: 0; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; z-index: 1; }
@media (max-width: 640px) {
  .track { grid-template-columns: 1fr; gap: 12px; }
  .track button { min-height: 0; grid-template-columns: 1fr auto; align-items: center; }
  .track .step { grid-column: 1 / -1; }
  .track .count { font-size: 34px; grid-column: 2; grid-row: 2; }
  .track .play { display: none; }
}

.panel { margin-top: 28px; }
.panel-head { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-head p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
.panel-head > p { display: none; }
.panel-head:not(:has(> :not(p))) { display: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); }
.filters button { border: 0; background: none; border-radius: 99px; padding: 6px 14px; font-size: 12px; color: var(--ink-soft); }
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); color: #fff; box-shadow: 0 6px 16px -6px rgba(255, 51, 71, 0.7); }

/* chips em pílula translúcida */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.08); color: var(--ink-soft); border: 1px solid var(--line); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.chip.plain::before { display: none; }
.chip.ok { color: var(--ok); }
.chip.warn { color: var(--warn); }
.chip.info { color: var(--info); }
.chip.bad { color: var(--bad); }
.chip.acc { color: var(--pink); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }

/* botões em pílula */
.btn { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.06); border-radius: 99px; padding: 9px 18px; font-weight: 500; font-size: 13px; color: #fff; transition: background .15s, box-shadow .15s; }
.btn:hover { background: rgba(255, 255, 255, 0.12); }
.btn.primary { border-color: transparent; background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); box-shadow: 0 10px 24px -10px rgba(255, 51, 71, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
.btn.primary:hover { background: linear-gradient(180deg, #ff6070, #d4142a); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-faint); }
.btn.quiet:hover { color: #fff; }

/* ideias */
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .ideas { grid-template-columns: 1fr; } }
.idea { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.idea.dim { opacity: 0.5; }
.idea h3 { font-size: 17px; font-weight: 600; }
.idea p { margin: 0; color: var(--ink-soft); }
.idea .why { font-size: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
.idea .why b { color: #fff; font-weight: 600; }
.score { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.score .pill { display: inline-flex; align-items: baseline; gap: 4px; padding: 4px 12px; border-radius: 99px; background: linear-gradient(180deg, var(--orange), var(--orange-deep)); font-size: 12px; font-weight: 500; box-shadow: 0 6px 16px -8px rgba(255, 138, 30, 0.9); }
.score .pill strong { font-size: 15px; font-weight: 700; }
.score .pill.low { background: rgba(255, 255, 255, 0.1); box-shadow: none; color: var(--ink-soft); }
.bar { flex: 1; max-width: 120px; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--red), var(--orange)); }
.src { font-size: 11px; color: var(--ink-faint); overflow-wrap: anywhere; }
.reason { display: grid; gap: 8px; }
.reason input, textarea { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 16px; padding: 10px 14px; color: #fff; }
.reason input::placeholder, textarea::placeholder { color: var(--ink-faint); }
.decided { font-size: 12px; color: var(--ink-soft); }
.decided b { color: #fff; }

/* calendário */
.cal { overflow: hidden; padding: 6px; }
.cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-week + .cal-week { margin-top: 6px; }
.day { min-height: 132px; padding: 10px; border-radius: 16px; background: rgba(255, 255, 255, 0.03); display: grid; gap: 8px; align-content: start; min-width: 0; }
.day.past { opacity: 0.55; }
.day.today { background: rgba(255, 51, 71, 0.12); box-shadow: inset 0 0 0 1px rgba(255, 51, 71, 0.5); }
.dlabel { font-size: 11px; color: var(--ink-faint); display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.06em; }
.day.today .dlabel { color: var(--pink); font-weight: 600; }
.list { display: grid; gap: 6px; }
.post { border: 1px solid var(--line); border-radius: 14px; padding: 8px 9px; background: rgba(0, 0, 0, 0.35); display: grid; gap: 5px; text-align: left; width: 100%; color: #fff; position: relative; overflow: hidden; }
.post::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--ink-faint); }
.post .pt { font-size: 12px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; padding-left: 4px; }
.post .pm { font-size: 10px; color: var(--ink-faint); padding-left: 4px; }
.post .chip { justify-self: start; margin-left: 4px; }
.post:hover { border-color: var(--line-strong); }
.post.s-Publicado::before { background: var(--ok); }
.post.s-Agendado::before, .post.s-Aprovado::before { background: var(--info); }
.post.s-EmRevisao::before, .post.s-Ajustes::before { background: var(--warn); }
.post.s-EmCriacao::before { background: var(--pink); }
.post.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 2px var(--red), 0 0 24px rgba(255, 51, 71, 0.6); } to { box-shadow: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
@media (max-width: 760px) {
  .cal-week { grid-template-columns: 1fr; }
  .day { min-height: 0; grid-template-columns: 64px 1fr; }
  .day .dlabel { flex-direction: column; justify-content: start; }
}

/* detalhe do post no calendário */
.post.sel { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
.pdet { margin-top: 16px; padding: 20px; display: grid; gap: 12px; }
.pdet h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 0; }
.pdet .top { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.pdet .leg { white-space: pre-line; font-size: 13px; color: var(--ink-soft); max-height: 160px; overflow: auto; }
/* revisão em lista */
.rlist { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 14px 18px; text-align: left; width: 100%; color: #fff; border: 1px solid var(--line); }
.rrow:hover { border-color: var(--line-strong); }
.rrow[aria-expanded="true"] { border-color: var(--pink); }
.rrow .rt { font-weight: 600; font-size: 15px; }
.rrow .rm { font-size: 12px; color: var(--ink-faint); grid-column: 1; }
.rrow .rx { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; align-items: center; }
.rrow .seta { font-size: 18px; color: var(--ink-faint); transition: transform .15s; }
.rrow[aria-expanded="true"] .seta { transform: rotate(90deg); color: var(--pink); }

/* revisão */
.review { display: grid; gap: 20px; }
.rcard { padding: 20px; display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 820px) { .rcard { grid-template-columns: 1fr; } }
.slides { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.slide {
  position: relative; overflow: hidden; flex: 0 0 172px; aspect-ratio: 4 / 5; max-width: 100%; border-radius: 20px; padding: 14px;
  display: flex; flex-direction: column; justify-content: space-between; scroll-snap-align: start; color: #fff;
  background: linear-gradient(160deg, #ff6b7d 0%, #ff3347 45%, #b80d22 100%);
}
.slide:nth-child(even) { background: linear-gradient(160deg, #ffb347 0%, #ff8a1e 45%, #e5480b 100%); }
.slide::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), transparent 40%); pointer-events: none; }
.slide .n { font-size: 40px; font-weight: 700; line-height: 1; }
.slide .st { font-weight: 600; font-size: 15px; line-height: 1.2; }
.slide .sx { font-size: 11px; line-height: 1.4; opacity: 0.9; margin-top: 4px; }
.slide .img { align-self: start; font-size: 10px; padding: 3px 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); }
.caption { white-space: pre-line; font-size: 13px; color: var(--ink-soft); background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 16px; padding: 14px; max-height: 220px; overflow: auto; }
.tags { font-size: 12px; color: var(--pink); overflow-wrap: anywhere; }
.rside { display: grid; gap: 14px; align-content: start; }
.rside h3 { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
.hist { display: grid; gap: 8px; font-size: 12px; }
.hist div { padding: 10px 12px; border-radius: 14px; background: rgba(0, 0, 0, 0.3); color: var(--ink-soft); }
.hist b { color: #fff; font-weight: 600; }
.working { font-size: 13px; color: var(--warn); display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }
.empty { padding: 32px; text-align: center; color: var(--ink-soft); }
.small { font-size: 12px; color: var(--ink-soft); }
.small b { color: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: rgba(20, 8, 10, 0.92); border: 1px solid var(--line-strong); color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
/* base da marca (ligada ao Airtable) */
.live { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line); color: var(--ink-soft); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
.live.on::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.live.off::before { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .mgrid { grid-template-columns: 1fr; } }
.box { padding: 20px; display: grid; gap: 16px; min-width: 0; }
.box h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
.box .hint { margin: -8px 0 0; color: var(--ink-soft); font-size: 12px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 520px) { .fgrid { grid-template-columns: 1fr; } }
.fgrid .full { grid-column: 1 / -1; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 500; color: var(--ink-soft); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); border-radius: 14px; padding: 10px 12px; color: #fff; font-size: 13px; }
.field select option { background: #1a0b0d; }
.field textarea { resize: vertical; min-height: 72px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { border: 1px solid var(--line-strong); background: rgba(255, 255, 255, 0.04); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--ink-soft); }
.toggles button[aria-pressed="true"] { background: linear-gradient(180deg, #ff4a5c, var(--red-deep)); border-color: transparent; color: #fff; }
.fontes { display: grid; gap: 8px; }
.fonte { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); }
.fonte.inativa { opacity: 0.55; }
.fonte .fn { font-weight: 600; font-size: 13px; overflow-wrap: anywhere; }
.fonte .meta { margin-top: 4px; }
.fonte .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.switch { position: relative; width: 38px; height: 22px; border-radius: 99px; border: 0; background: rgba(255, 255, 255, 0.15); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch[aria-checked="true"] { background: linear-gradient(180deg, var(--red), var(--red-deep)); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.msg { padding: 12px 14px; border-radius: 14px; font-size: 13px; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.msg.erro { border-color: rgba(255, 107, 107, 0.4); color: #ffd0d0; }
.msg.ok { border-color: rgba(74, 222, 128, 0.35); color: #c9f7d8; }
.btn[disabled] { opacity: 0.5; cursor: progress; }
.cores { display: grid; gap: 8px; }
.cor { display: grid; grid-template-columns: 44px 110px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
@media (max-width: 460px) { .cor { grid-template-columns: 44px minmax(0, 1fr) auto; } .cor .nome { grid-column: 1 / -1; grid-row: 2; } }
.cor input[type="color"] { width: 44px; height: 40px; padding: 3px; border-radius: 12px; border: 1px solid var(--line-strong); background: rgba(0, 0, 0, 0.3); cursor: pointer; }
.cor input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.cor input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 8px; }
.cor .hex { text-transform: uppercase; font-variant-numeric: tabular-nums; }
.paleta { display: flex; height: 10px; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.paleta:empty { display: none; }
.paleta i { flex: 1; }
.logo-atual { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.logo-atual a { color: var(--pink); }
/* ---------- prévia do post (formato do Instagram) ---------- */
.ig { --b-bg: #0A0C15; --b-acc: #F8395A; display: grid; gap: 0; background: #000; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); max-width: 460px; width: 100%; justify-self: center; }
.ig-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #0b0b0d; }
.ig-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--b-bg); border: 2px solid var(--b-acc); display: grid; place-items: center; overflow: hidden; flex: none; font-size: 11px; font-weight: 700; color: #fff; }
.ig-avatar img { width: 100%; height: 100%; object-fit: contain; padding: 3px; }
.ig-nome { font-size: 13px; font-weight: 600; color: #fff; }
.ig-sub { font-size: 11px; color: var(--ink-faint); }
.ig-trilho { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.ig-trilho::-webkit-scrollbar { display: none; }
.ig-slide { position: relative; flex: 0 0 100%; aspect-ratio: 4 / 5; scroll-snap-align: start; container-type: inline-size; overflow: hidden; color: var(--tinta, #fff);
  background: radial-gradient(120% 80% at 85% 0%, color-mix(in srgb, var(--b-acc) 28%, transparent), transparent 60%), var(--b-bg); }
.ig-slide .foto { position: absolute; inset: 0; background-size: cover; background-position: center; }
.ig-slide .veu { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--veu, #0A0C15) 10%, transparent) 0%, color-mix(in srgb, var(--veu, #0A0C15) 25%, transparent) 40%, color-mix(in srgb, var(--veu, #0A0C15) 94%, transparent) 100%); }
.ig-slide.sem-foto .veu { display: none; }
.ig-slide.cta { background: var(--b-acc); }
.ig-slide.arte .veu, .ig-slide.arte .conteudo, .ig-slide.arte .marca-agua { display: none; }
.ig-slide .marca-agua { position: absolute; top: 5cqw; left: 6cqw; height: 6.5cqw; display: flex; align-items: center; gap: 2cqw; font-size: 3.4cqw; font-weight: 700; letter-spacing: .02em; opacity: .95; }
.ig-slide .marca-agua img { height: 100%; width: auto; }
.ig-slide .contador { position: absolute; top: 5cqw; right: 6cqw; font-size: 3cqw; font-weight: 600; padding: 1cqw 2.6cqw; border-radius: 99px; background: rgba(0,0,0,.45); }
.ig-slide .conteudo { position: absolute; left: 6cqw; right: 6cqw; bottom: 8cqw; display: grid; gap: 3cqw; }
.ig-slide.sem-foto .conteudo { top: 22cqw; bottom: auto; }
.ig-slide .barra { width: 12cqw; height: 1.4cqw; border-radius: 99px; background: var(--b-acc); }
.ig-slide.cta .barra { background: #fff; }
.ig-slide .titulo { font-family: var(--fonte-tit, var(--font-body)), Poppins, sans-serif; font-weight: var(--peso-tit, 700); text-transform: var(--caixa-tit, none); font-size: calc(8.6cqw * var(--esc, 1)); line-height: 1.05; letter-spacing: -.01em; text-wrap: balance; }
.ig-slide.sem-foto .titulo { font-size: calc(10cqw * var(--esc, 1)); }
.ig-slide .texto { font-size: calc(4.4cqw * var(--esc, 1)); line-height: 1.35; color: color-mix(in srgb, var(--tinta, #fff) 88%, transparent); max-width: 92%; }
.ig-slide .seta { position: absolute; right: 6cqw; bottom: 6cqw; font-size: 3.2cqw; font-weight: 600; opacity: .8; }
.ig-pontos { display: flex; justify-content: center; gap: 5px; padding: 10px 0 2px; background: #0b0b0d; }
.ig-pontos i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.3); }
.ig-pontos i.on { background: var(--b-acc); }
.ig-legenda { padding: 8px 14px 14px; background: #0b0b0d; font-size: 13px; color: rgba(255,255,255,.85); white-space: pre-line; max-height: 240px; overflow: auto; }
.ig-legenda b { color: #fff; }
.ig-legenda .tags { margin-top: 8px; display: block; }
.ig-slide video.foto { width: 100%; height: 100%; object-fit: cover; display: block; }
.ig.vertical { max-width: 340px; }
.ig.vertical .ig-slide { aspect-ratio: 9 / 16; }
.ig.vertical .ig-slide .titulo { font-size: calc(9cqw * var(--esc, 1)); }
.ig-slide .tag-video { position: absolute; left: 6cqw; bottom: 3cqw; font-size: 2.8cqw; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.ig[data-al="centro"] .conteudo { text-align: center; justify-items: center; }
.ig[data-al="direita"] .conteudo { text-align: right; justify-items: end; }
.ig[data-pos="topo"] .ig-slide .conteudo { top: 16cqw; bottom: auto; }
.ig[data-pos="meio"] .ig-slide .conteudo { top: 50%; bottom: auto; transform: translateY(-50%); }
.ig[data-pos="base"] .ig-slide .conteudo { top: auto; bottom: 10cqw; }
.ig[data-pos="topo"] .ig-slide .veu { background: linear-gradient(0deg, rgba(10,12,21,.10) 0%, rgba(10,12,21,.25) 40%, rgba(10,12,21,.94) 100%); }
.ig[data-pos="meio"] .ig-slide .veu { background: rgba(10,12,21,.55); }
/* logo: versão e posição no modelo foto de fundo */
.ig-slide.lp-tc .marca-agua { left: 50%; transform: translateX(-50%); }
.ig-slide.lp-td .marca-agua { left: auto; right: 6cqw; }
.ig-slide.lp-td .contador { right: auto; left: 6cqw; }
.ig-slide.lp-be .marca-agua, .ig-slide.lp-bc .marca-agua, .ig-slide.lp-bd .marca-agua { top: auto; bottom: 5cqw; }
.ig-slide.lp-bc .marca-agua { left: 50%; transform: translateX(-50%); }
.ig-slide.lp-bd .marca-agua { left: auto; right: 6cqw; }
.ig-slide.lp-be .seta, .ig-slide.lp-bc .seta, .ig-slide.lp-bd .seta { display: none; }
.ig[data-pos="base"] .ig-slide.lp-be .conteudo, .ig[data-pos="base"] .ig-slide.lp-bc .conteudo, .ig[data-pos="base"] .ig-slide.lp-bd .conteudo,
.ig[data-pos="auto"] .ig-slide.lp-be:not(.sem-foto) .conteudo, .ig[data-pos="auto"] .ig-slide.lp-bc:not(.sem-foto) .conteudo, .ig[data-pos="auto"] .ig-slide.lp-bd:not(.sem-foto) .conteudo { bottom: 16cqw; }
/* modelos editoriais */
.ig-slide.ed { background: #F4F4F6; color: #111; }
.ig-slide.ed.escuro { background: var(--b-bg); color: #fff; }
.ed .ed-img { position: absolute; left: 6cqw; top: 13cqw; width: 88cqw; height: 47cqw; border-radius: 3cqw; background: #d9d9de center / cover no-repeat; object-fit: cover; }
.ed.editorial.escuro .ed-img { left: 0; top: 0; width: 100cqw; height: 58cqw; border-radius: 0; }
.ed.editorial.escuro.com-img::before { content: ""; position: absolute; left: 0; right: 0; top: 30cqw; height: 28.5cqw; background: linear-gradient(transparent, var(--b-bg)); z-index: 1; }
.ed.lateral .ed-img { left: 52cqw; top: 13cqw; width: 42cqw; height: 96cqw; }
.ed .ed-topo { position: absolute; top: 4.5cqw; left: 6cqw; right: 6cqw; height: 4.5cqw; display: flex; justify-content: center; align-items: center; z-index: 2; }
.ed .ed-topo.lp-te { justify-content: flex-start; } .ed .ed-topo.lp-td { justify-content: flex-end; }
.ed .ed-topo img { height: 100%; width: auto; } .ed .ed-topo b { font-size: 3.4cqw; letter-spacing: .08em; }
.ed .ed-cont { position: absolute; top: 3.8cqw; right: 6cqw; z-index: 2; font-size: 3cqw; font-weight: 600; padding: 1cqw 2.6cqw; border-radius: 99px; background: rgba(0,0,0,.08); }
.ed.escuro .ed-cont { background: rgba(255,255,255,.14); } .ed .ed-cont.esq { right: auto; left: 6cqw; }
.ed .ed-corpo { position: absolute; left: 6cqw; right: 6cqw; top: 26cqw; display: grid; gap: 3cqw; z-index: 2; justify-items: start; }
.ed.com-img .ed-corpo { top: 66cqw; } .ed.editorial.escuro.com-img .ed-corpo { top: 60cqw; } .ed.lateral.com-img .ed-corpo { top: 18cqw; right: 53cqw; }
.ed .titulo { font-weight: 800; font-size: calc(8.4cqw * var(--esc, 1)); line-height: 1.04; letter-spacing: -.02em; text-wrap: balance; }
.ed:not(.com-img) .titulo { font-size: calc(10.5cqw * var(--esc, 1)); } .ed.lateral.com-img .titulo { font-size: calc(7cqw * var(--esc, 1)); }
.ed .texto { font-size: calc(4cqw * var(--esc, 1)); line-height: 1.35; color: #55565E; background: #E7E7EC; border-radius: 2.4cqw; padding: 3.4cqw; max-width: none; justify-self: stretch; }
.ed.escuro .texto { color: rgba(255,255,255,.72); background: rgba(255,255,255,.08); }
.ed.ed-cta .ed-corpo { top: 50%; transform: translateY(-60%); justify-items: center; text-align: center; }
.ed .ed-siga { font-size: 4.2cqw; font-weight: 600; background: #E7E7EC; border-radius: 2.4cqw; padding: 2.4cqw 5cqw; }
.ed.escuro .ed-siga { background: rgba(255,255,255,.1); }
.ed .ed-rodape { position: absolute; left: 6cqw; right: 6cqw; bottom: 4cqw; display: flex; align-items: center; gap: 2.4cqw; font-size: 3.2cqw; z-index: 2; }
.ed .ed-rodape small { display: block; font-size: 2.6cqw; opacity: .6; font-weight: 500; }
.ed .ed-rodape em { margin-left: auto; font-style: normal; font-weight: 700; font-size: 2.6cqw; opacity: .5; letter-spacing: .02em; }
.ed .ed-av { width: 6.4cqw; height: 6.4cqw; border-radius: 50%; background: var(--b-acc); color: #fff; display: grid; place-items: center; overflow: hidden; font-weight: 800; flex: none; }
.ed .ed-av img { width: 72%; height: 72%; object-fit: contain; }
.ig[data-al="centro"] .ed:not(.ed-cta) .ed-corpo { text-align: center; justify-items: center; }
.ig[data-al="direita"] .ed:not(.ed-cta) .ed-corpo { text-align: right; justify-items: end; }
.diag .modelos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.diag .modelos button { display: grid; justify-items: center; gap: 5px; padding: 7px 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--ink-soft); font: 600 11px/1.2 inherit; font-family: inherit; cursor: pointer; text-align: center; }
.diag .modelos button svg { width: 100%; max-width: 54px; height: auto; display: block; border-radius: 3px; }
.diag .modelos button[aria-pressed="true"] { border-color: var(--red, #F8395A); color: var(--ink); box-shadow: 0 0 0 1px var(--red, #F8395A); }
.editor-textos { display: grid; gap: 10px; }
.editor-textos fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; margin: 0; }
.editor-textos legend { font-size: 12px; font-weight: 700; padding: 0 4px; }
.editor-textos input, .editor-textos textarea { width: 100%; }
.diag .modelos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.amostra-cor { display: inline-block; width: 12px; height: 12px; border-radius: 4px; border: 1px solid rgba(255,255,255,.35); margin-right: 6px; vertical-align: -2px; }
.diag .seg.pos-logo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ig-aviso { font-size: 11px; color: var(--ink-faint); padding: 0 14px 12px; background: #0b0b0d; }

/* login */
.auth { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; overflow: auto; background: var(--bg); }
.auth-card { width: 100%; max-width: 420px; padding: 28px; display: grid; gap: 16px; }
.auth-card h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; }
.auth-card .hint { margin: 0; }
.auth-card .btn.primary { width: 100%; min-height: 44px; }
.auth-marca { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.auth-marca img { height: 32px; width: auto; }
body.travado .wrap { visibility: hidden; }
.quem { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.quem .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: linear-gradient(180deg, var(--red), var(--red-deep)); }
.quem small { display: block; color: var(--ink-faint); font-size: 11px; }
/* diálogos */
.dlg { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; padding: 24px; color: var(--ink); border: 1px solid var(--line-strong); }
.dlg::backdrop { background: rgba(0, 0, 0, 0.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.dlg h2 { font-size: 20px; margin-bottom: 4px; }
.dlg form { display: grid; gap: 14px; }
.dlg .actions { justify-content: flex-end; }
.users { display: grid; gap: 8px; }
.urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); }
.urow .un { font-weight: 600; }
.uso { height: 6px; border-radius: 99px; background: var(--line); margin-top: 8px; overflow: hidden; } .uso i { display: block; height: 100%; background: var(--red, #F8395A); }
.planos-grade { display: grid; grid-template-columns: 1fr; gap: 10px; }
.plano-card { display: grid; grid-template-columns: minmax(0, 1fr) auto 120px; gap: 6px 16px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.2); font-size: 13px; }
.plano-card .pc-info { display: grid; gap: 4px; } .plano-card .pc-info b { font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .plano-card .pc-info span { color: var(--ink-soft); }
.plano-card .pc-preco { display: grid; justify-items: end; gap: 2px; text-align: right; }
.plano-card > .btn, .plano-card > .chip, .plano-card > .small { justify-self: stretch; }
@media (max-width: 520px) { .plano-card { grid-template-columns: minmax(0, 1fr) auto; } .plano-card > .btn, .plano-card > .chip, .plano-card > .small { grid-column: 1 / -1; } }
.plano-card.dest { border-color: var(--red, #F8395A); }
.plano-card .de { font-size: 12px; opacity: .7; }
.plano-card .preco { font-size: 22px; font-weight: 800; } .plano-card .preco small { font-size: 12px; font-weight: 500; opacity: .7; }
.plano-card .btn { justify-content: center; text-align: center; }
.urow .ue { font-size: 12px; color: var(--ink-faint); overflow-wrap: anywhere; }
.urow.off { opacity: 0.55; }
/* calendário mensal */
.cal-nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav h3 { font-size: 20px; font-weight: 600; min-width: 170px; }
.cal-nav .actions { gap: 6px; }
.ano { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-bottom: 12px; padding-bottom: 2px; overscroll-behavior-x: contain; cursor: grab; }
.ano .tri { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 1px; }
.ano button span { display: flex; gap: 4px; align-items: baseline; } .ano button small { font-size: 10px; opacity: .6; }
.ano button i { font-style: normal; font-size: 10px; color: var(--ink-faint); text-transform: none; }
.tri-rotulo { font-size: 13px; font-weight: 600; min-width: 108px; text-align: center; text-transform: capitalize; color: var(--ink-soft); }
.ano::-webkit-scrollbar { display: none; }
.ano button { border: 1px solid var(--line); background: var(--glass); color: var(--ink-soft); border-radius: 12px; padding: 8px 10px; font-size: 13px; display: grid; justify-items: center; gap: 2px; text-transform: capitalize; min-width: 0; user-select: none; }
.ano button b { font-size: 15px; color: var(--ink); font-weight: 600; }
.ano button[aria-pressed="true"] { border-color: var(--pink); color: var(--ink); box-shadow: 0 0 0 1px var(--pink); }
.ano button.vazio b { color: var(--ink-faint); }
.cal-head { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 0 6px; margin-bottom: 4px; font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .06em; }
.day.fora { opacity: 0.3; }
.day .add { justify-self: start; }
@media (max-width: 760px) {
  .cal-head { display: none; }
  .day.fora, .day.sem-post:not(.today) { display: none; }
}

/* logos e mood board */
.logos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .logos { grid-template-columns: 1fr; } }
.logo-slot { border: 1px solid var(--line); border-radius: 6px; background: var(--card-soft); padding: 10px; display: grid; gap: 8px; }
.logo-slot .amostra { height: 64px; border-radius: 4px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.logo-slot .amostra.escuro { background: #0A0C15; }
.logo-slot .amostra.claro { background: #F4F4F6; }
.logo-slot .amostra img { max-height: 44px; max-width: 80%; object-fit: contain; }
.logo-slot .amostra span { font-size: 11px; color: var(--ink-faint); }
.logo-slot .amostra.claro span { color: #8A8D9C; }
.logo-slot b { font-size: 12px; }
.logo-slot small { display: block; font-size: 11px; color: var(--ink-faint); }
.logo-slot .actions .btn { padding: 6px 10px; font-size: 12px; }
.mood { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.mood figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--card-soft); }
.mood img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mood button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 999px; border: 0; background: rgba(3,4,8,.75); color: #fff; font-size: 12px; line-height: 1; }
.arquivo-oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
/* diagramação */
.diag { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card-soft); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); border-radius: 6px; padding: 7px 11px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { border-color: transparent; background: var(--grad); color: #fff; }
.seg svg { width: 14px; height: 14px; }

/* agendados */
.agrupo { display: grid; gap: 8px; margin-bottom: 22px; }
.agrupo > .lbl { margin-bottom: 2px; }
.arow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; }
.arow .mini { width: 64px; aspect-ratio: 4 / 5; border-radius: 6px; background: var(--card-soft) center / cover no-repeat; border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--ink-faint); overflow: hidden; }
.arow .mini video { width: 100%; height: 100%; object-fit: cover; }
.arow .at { font-weight: 700; font-size: 14px; }
.arow .am { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.arow .am b { font-family: var(--mono); font-weight: 500; color: #fff; }
.arow .actions { justify-content: flex-end; }
@media (max-width: 640px) { .arow { grid-template-columns: 56px minmax(0, 1fr); } .arow .actions { grid-column: 1 / -1; justify-content: flex-start; } }

.check-tratar { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted, #9aa0b4); margin: 2px 0 10px; font-weight: 500; }
.check-tratar input { margin-top: 2px; accent-color: var(--red, #F8395A); }
.auth-rodape { margin: 4px 0 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
.auth-rodape button { background: none; border: 0; padding: 0 2px; color: var(--red, #F8395A); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
/* próximo passo */
.proximo { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--line); border-radius: 9px; background: linear-gradient(90deg, rgba(248,57,90,.10), transparent 70%), var(--card); }
.proximo[hidden] { display: none; }
.proximo div { display: grid; gap: 1px; flex: 1; min-width: 0; } .proximo b { font-size: 14px; } .proximo small { font-size: 12px; color: var(--ink-faint); }
.proximo .btn { white-space: nowrap; }
.px-ponto { width: 9px; height: 9px; border-radius: 50%; background: var(--red, #F8395A); box-shadow: 0 0 0 5px rgba(248,57,90,.18); flex: none; animation: px-pulsa 2s ease-in-out infinite; }
.px-ponto.bad { background: #ff8a3d; box-shadow: 0 0 0 5px rgba(255,138,61,.18); }
@keyframes px-pulsa { 50% { box-shadow: 0 0 0 9px rgba(248,57,90,0); } }
@media (max-width: 520px) { .proximo { flex-wrap: wrap; } .proximo .btn { width: 100%; justify-content: center; } }
/* esqueleto de carregamento */
.esqueleto { display: grid; gap: 12px; }
.esqueleto i { display: block; height: 92px; border-radius: 9px; background: linear-gradient(90deg, var(--card) 0%, rgba(255,255,255,.06) 50%, var(--card) 100%); background-size: 200% 100%; animation: esq 1.3s linear infinite; }
.esqueleto i:nth-child(2) { height: 140px; } .esqueleto i:nth-child(3) { height: 64px; opacity: .7; }
@keyframes esq { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .esqueleto i, .px-ponto { animation: none; } }
/* estados vazios */

/* ================= Identidade do admin Easypeasy Pay ================= */
html, body { margin: 0; background: var(--bg); }
body { background: var(--bg); font-size: 13px; color: var(--ink); }
::placeholder { color: var(--ink-faint); }

::-webkit-scrollbar { width: 8px; height: 8px; }

:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* casca */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

.adm { font-size: 9.5px; font-weight: 700; letter-spacing: .28em; color: var(--ink-soft); }
.grupo { padding: 18px 18px 6px; color: var(--ink-faint); }
.track { display: block; position: relative; margin: 0; padding: 2px 0; grid-template-columns: none; }
.trilho::before { content: ""; position: absolute; left: 22px; top: 4px; bottom: 4px; border-left: 1.5px dashed rgba(255, 255, 255, .13); }
.track button, .track button[class] { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 0; padding: 9px 18px 9px 38px; border: 0; border-radius: 0; background: none !important; box-shadow: none !important; color: var(--ink-soft); font-size: 13px; font-weight: 500; opacity: 1; transform: none; overflow: visible; position: relative; text-align: left; }

.track button[aria-selected="true"]::before { content: ""; position: absolute; left: 22px; top: 0; height: 50%; width: 10px; border-left: 1.5px dashed var(--red); border-bottom: 1.5px dashed var(--red); border-bottom-left-radius: 9px; }
.track .name { font-size: 13px; margin: 0; font-weight: inherit; }

/* luz corrente discreta na borda dos painéis */
@property --ang { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

  background: conic-gradient(from var(--ang), transparent 0 72%, rgba(248, 57, 90, .34) 80%, rgba(255, 255, 255, .62) 86%, rgba(62, 221, 174, .30) 92%, transparent 100%);

  animation: luz 7s linear infinite; }

    -webkit-mask: linear-gradient(transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(transparent, #000 12%, #000 88%, transparent); }

    background: linear-gradient(135deg, #F8395A, #2a1220); }

<script>
const KEY = "pauta-painel-v3";

/* Ideias, calendário e revisão vêm do Airtable (pelo conector no claude.ai, ou pelo fluxo 07 fora dele). */
let state = { ideias: [], posts: [] };
const pauta = { carregada: false, erro: null };

let tab = "ideias";
try { tab = localStorage.getItem(KEY + ":tab") || "ideias"; } catch (e) {}
let filtro = "Sugerida";
let abertoDescarte = null;
let flashId = null;

const STATUS = {
  Planejado: ["Planejado", ""], EmCriacao: ["Em criação", "acc"], AguardandoVideo: ["Aguardando vídeo", "acc"], VideoAnexado: ["Vídeo anexado", "acc"],
  EmRevisao: ["Em revisão", "warn"], Ajustes: ["IA ajustando", "warn"], Aprovado: ["Aprovado", "info"], Agendado: ["Agendado", "info"],
  Publicando: ["Publicando", "info"], Publicado: ["Publicado", "ok"], Erro: ["Erro", "bad"],
};
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtData = iso => { if (!iso) return "sem data"; const d = new Date(iso); return `${DIAS[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} · ${String(d.getHours()).padStart(2, "0")}h${d.getMinutes() ? String(d.getMinutes()).padStart(2, "0") : ""}`; };
const chip = s => { const [txt, cls] = STATUS[s] || [s || "—", ""]; return `<span class="chip ${cls}">${esc(txt)}</span>`; };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200);
}

/* ---------- dados do Airtable ---------- */
const nomeSel = v => (v && typeof v === "object") ? v.name : (v ?? "");
function deIdeia(r) {
  return {
    id: r.id, titulo: r.Titulo || "", resumo: r.Resumo || "", formato: nomeSel(r.Formato), rede: nomeSel(r.Rede), pilar: nomeSel(r.Pilar),
    score: Number(r.Score) || 0, porQue: r.PorQueFunciona || "", refs: (r.Referencias || []).length,
    status: nomeSel(r.Status) || "Sugerida", motivo: r.MotivoDescarte || "", posts: (r.Calendario || []).map(x => (x && typeof x === "object") ? x.id : x),
  };
}
function dePost(r) {
  let slides = [];
  try {
    slides = JSON.parse(r.Slides || "[]").map((s, i) => ({ n: Number(s.n) || i + 1, t: s.titulo || s.visual || "", x: s.texto || s.fala_ou_texto || "", img: !!s.usa_imagem }));
  } catch (e) {}
  return {
    id: r.id, titulo: r.Titulo || "", data: r.DataPublicacao || null, rede: nomeSel(r.Rede), formato: nomeSel(r.Formato), pilar: nomeSel(r.Pilar),
    status: nomeSel(r.Status) || "Planejado", versao: r.Versao || 1, legenda: r.Legenda || "", hashtags: r.Hashtags || "", redes: Array.isArray(r.Redes) && r.Redes.length ? r.Redes.slice() : [nomeSel(r.Rede)].filter(Boolean), links: r.Links || {}, briefing: (() => { try { return JSON.parse(r.Briefing || "null") || {}; } catch (e) { return {}; } })(), slides, slidesBrutos: (() => { try { const a = JSON.parse(r.Slides || "[]"); return Array.isArray(a) ? a : []; } catch (e) { return []; } })(), link: r.LinkPublicado || "",
    erro: r.Erro || "", ideia: ((r.Ideia || [])[0] && typeof r.Ideia[0] === "object") ? r.Ideia[0].id : (r.Ideia || [])[0] || null, clipes: r.Clipes || [], diag: (() => { const pad = { alinhar: "esquerda", posicao: "auto", modelo: "foto", fundo: "auto", logo: "auto", logoPos: "te" }; let d; try { d = Object.assign(pad, JSON.parse(r.Diagramacao || "{}")); } catch (e) { d = pad; } if (d.modelo === "claro" || d.modelo === "escuro") { d.fundo = d.modelo; d.modelo = "editorial"; } if ((d.v || 0) < 2) { d.fundo = MODELOS_ED.includes(d.modelo) ? (d.fundo === "escuro" ? "marca" : "claro") : "auto"; d.v = 2; } if (d.v < 3) { if (["Reels", "Stories"].includes(r.Formato)) d.modelo = "video"; d.v = 3; } if (d.modelo === "video" && !["Reels", "Stories"].includes(r.Formato)) d.modelo = "foto"; return d; })(), clipesSlides: (() => { try { return JSON.parse(r.ClipesSlides || "{}"); } catch (e) { return {}; } })(),
    arquivos: r.Arquivos || [], fotos: r.Fotos || [], artesProntas: r.ArtesProntas === true, imagensSlides: (() => { try { return JSON.parse(r.ImagensSlides || "{}"); } catch (e) { return {}; } })(),
  };
}
function receberPauta(ideias, posts) {
  if (ideias) state.ideias = ideias.map(deIdeia);
  if (posts) state.posts = posts.map(dePost).filter(p => p.data);
  // Na primeira carga, se não houver nada para decidir, abre mostrando todas as ideias.
  if (!pauta.carregada && ideias && filtro === "Sugerida" && !state.ideias.some(i => i.status === "Sugerida")) filtro = "Todas";
  pauta.carregada = true; pauta.erro = null;
  conferirDisparos();
  render();
}
// Redes com conta conectada no Zernio (null = ainda não sei ou o Zernio não está configurado).
let redesOk = null, redesCarregadas = false;
async function carregarRedes() {
  if (redesCarregadas) return; redesCarregadas = true;
  try { redesOk = (await api({ acao: "redesConectadas" })).redes || null; } catch (e) { redesOk = null; }
  render();
}
const REDES_POST = ["Instagram", "Facebook", "TikTok", "X", "Threads"];
const ICONE_REDE = { Instagram: "IG", Facebook: "FB", TikTok: "TT", X: "X", Threads: "@" };
function seletorRedes(p) {
  const story = p.formato === "Stories";
  const botoes = REDES_POST.map(r => {
    const ligada = p.redes.includes(r);
    const semConta = redesOk && !redesOk.includes(r);
    const naoAceita = story && !["Instagram", "Facebook"].includes(r);
    const motivo = naoAceita ? "Stories só vão para o Instagram e o Facebook" : semConta ? "Conecte esta rede em Integrações › Redes conectadas" : "";
    return `<button type="button" class="rede-chip ${ligada ? "on" : ""}" data-act="rede" data-id="${p.id}" data-v="${r}" aria-pressed="${ligada}" ${naoAceita || (semConta && !ligada) ? "disabled" : ""} title="${esc(motivo || r)}"><i>${ICONE_REDE[r]}</i>${r}${semConta ? " · sem conta" : ""}</button>`;
  }).join("");
  const avisos = [];
  if (p.redes.includes("TikTok")) avisos.push("No TikTok, ao aprovar você confirma que revisou a prévia e concorda com a Confirmação de Uso de Música do TikTok.");
  if (p.redes.includes("X")) avisos.push("No X, a legenda é encurtada para 280 caracteres e vão até 4 imagens.");
  if (p.redes.includes("Threads")) avisos.push("No Threads, a legenda é encurtada para 500 caracteres.");
  if (redesOk === null && M.modo === "web") avisos.push("Não consegui ver as redes conectadas. Confira em Integrações › Redes conectadas.");
  return `<div class="redes-post"><span class="small">Publicar em${ajuda("redes")}</span><div class="redes-lista">${botoes}</div>${avisos.length ? `<p class="small" style="margin:0">${avisos.map(esc).join(" ")}</p>` : ""}</div>`;
}
async function mudarRede(p, r) {
  const antes = p.redes.slice();
  p.redes = p.redes.includes(r) ? p.redes.filter(x => x !== r) : REDES_POST.filter(x => x === r || p.redes.includes(x));
  if (!p.redes.length) { p.redes = antes; return toast("Escolha pelo menos uma rede."); }
  render();
  try { await api({ acao: "salvarRedes", id: p.id, redes: p.redes }); }

let calAberto = null, revAberto = null, timerDisparos = null;
const DISP_KEY = KEY + ":disparos", DISP_MAX = 12 * 60 * 1000;
let disparos = (() => { try { return JSON.parse(localStorage.getItem(DISP_KEY) || "{}"); } catch (e) { return {}; } })();
if (!disparos.posts) disparos.posts = {};
function salvarDisparos() { try { localStorage.setItem(DISP_KEY, JSON.stringify(disparos)); } catch (e) {} }
const tarefaIdeias = () => (pauta.tarefas || []).find(t => t.tipo === "ideias");
const buscandoIdeias = () => (!!disparos.ideias && Date.now() - disparos.ideias.em < DISP_MAX) || ["pendente", "rodando"].includes((tarefaIdeias() || {}).status);
const criando = id => !!disparos.posts[id];
function conferirDisparos() {
  const agora = Date.now();
  if (disparos.ideias) {
    const novas = state.ideias.filter(i => i.status === "Sugerida").length;
    if (agora - disparos.ideias.em > DISP_MAX) delete disparos.ideias;
    else if (novas > disparos.ideias.antes) { delete disparos.ideias; toast("Ideias novas chegaram. Veja em Para decidir."); filtro = "Sugerida"; }
  }
  for (const [id, d] of Object.entries(disparos.posts)) {
    const p = state.posts.find(x => x.id === id);
    const passou = agora - d.em;
    if (!p || passou > DISP_MAX) { delete disparos.posts[id]; continue; }
    if (!["Planejado", "EmCriacao", "Erro"].includes(p.status) || (p.status === "Erro" && passou > 90000)) {
      delete disparos.posts[id];
      toast(p.status === "Erro" ? 'Não deu para criar "' + p.titulo + '". Veja o erro no calendário.' : '"' + p.titulo + '" está pronto para revisão.');
    }
  }
  salvarDisparos();
  const ativo = disparos.ideias || Object.keys(disparos.posts).length;
  if (ativo && !timerDisparos && M.modo === "web") timerDisparos = setInterval(() => carregarPauta(), 45000);
  if (!ativo && timerDisparos) { clearInterval(timerDisparos); timerDisparos = null; }
}

}

function abrirMudarData(p, erro, valores) {
  const d = new Date(p.data);
  const data = (valores && valores.data) || ymd(d), hora = (valores && valores.hora) || doisDig(d.getHours()) + ":" + doisDig(d.getMinutes());
  abrirDlg(`<h2>Mudar data</h2>
    <p class="hint">${esc(p.titulo)} · hoje marcado para ${fmtData(p.data)}</p>
    <form onsubmit="return false">
      <div class="fgrid">
        <label class="field"><span>Data</span><input id="md-data" type="date" min="${ymd(new Date())}" value="${data}"></label>
        <label class="field"><span>Horário</span><input id="md-hora" type="time" step="900" value="${hora}"></label>
      </div>
      ${erro ? `<div class="msg erro">${esc(erro)}</div>` : ""}
      <div class="actions"><button class="btn quiet" type="button" data-md="cancelar">Cancelar</button><button class="btn primary" type="button" data-md="salvar" data-id="${p.id}">Salvar data</button></div>
    </form>`);
}
async function salvarNovaData(id) {
  const p = state.posts.find(x => x.id === id); if (!p) return fecharDlg();
  const data = document.getElementById("md-data").value, hora = document.getElementById("md-hora").value;
  const quando = new Date(data + "T" + hora + ":00");
  if (!data || !hora || !(quando > new Date(Date.now() + 5 * 60000))) return abrirMudarData(p, "Escolha uma data e um horário no futuro.", { data, hora });
  try {
    if (M.modo === "web") await api({ acao: "reagendarPost", id, data: quando.toISOString() });
    else await M.mcp.callTool(AT.server, "update_records_for_table", { baseId: AT.base, tableId: AT.cal.table, records: [{ id, fields: { [AT.cal.f.DataPublicacao]: quando.toISOString() } }] });
    p.data = quando.toISOString(); fecharDlg(); render();
    toast("Nova data: " + fmtData(p.data) + ".");
    if (M.modo === "web") carregarPauta(); else recarregar();
  } catch (e) { abrirMudarData(p, textoErro(e), { data, hora }); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-md]"); if (!b) return;
  if (b.dataset.md === "cancelar") return fecharDlg();
  if (b.dataset.md === "salvar") return salvarNovaData(b.dataset.id);
  if (b.dataset.md === "publicar") return publicarAgora(b.dataset.id);
});

  abrirDlg(`<h2>Publicar agora?</h2>

    <div class="actions"><button class="btn quiet" data-md="cancelar">Cancelar</button><button class="btn primary" data-md="publicar" data-id="${p.id}">Publicar agora</button></div>`);
}
let timersPublicar = [];
async function publicarAgora(id) {
  const p = state.posts.find(x => x.id === id); fecharDlg(); if (!p) return;
  try {
    await api({ acao: "publicarAgora", id });
    p.status = "Publicando"; render();
    toast("Publicando. Em até 1 minuto o link aparece aqui.");
    timersPublicar.forEach(clearTimeout);
    timersPublicar = [15, 45, 90, 180].map(seg => setTimeout(() => carregarPauta(), seg * 1000));
  } catch (e) { toast("Não deu para publicar: " + textoErro(e)); }

function miniatura(p) {
  const a = (p.arquivos || [])[0] || (p.fotos || [])[0];
  if (!a) return `<div class="mini">sem arte</div>`;
  if (ehArqVideo(a)) return `<div class="mini"><video src="${esc(a.url)}" muted playsinline preload="metadata"></video></div>`;
  return `<div class="mini" style="background-image:${cssUrl(urlArq(a))}"></div>`;
}
function linhaAgend(p) {
  let botoes = "";
  if (M.modo === "web") {
    if (p.status === "Agendado") botoes = `<button class="btn primary" data-act="publicar-agora" data-id="${p.id}" ${p.artesProntas ? "" : "disabled title=\"Faltam as artes finais\""}>Publicar agora</button><button class="btn" data-act="mudar-data" data-id="${p.id}">Mudar data</button>`;

  }
  const links = Object.entries(p.links || {}).filter(([, l]) => /^https?:/.test(l));
  if (links.length) botoes += links.map(([r, l]) => `<a class="btn" href="${esc(l)}" target="_blank" rel="noopener">Ver no ${esc(r)}</a>`).join("");
  else if (p.link) botoes += `<a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Ver publicado</a>`;

      ${p.erro ? `<div class="small" style="margin-top:6px;color:#ffc2cd">${esc(p.erro)}</div>` : ""}

function renderAgend() {
  const el = document.getElementById("p-agend"); if (!el) return;
  const head = `<div class="panel-head"><p>Posts aprovados entram aqui. Na hora marcada eles vão para a rede pelo Zernio, ou você publica na hora com "Publicar agora".</p></div>`;
  if (!pauta.carregada) { el.innerHTML = head + semPauta(); return; }
  const porData = (a, b) => new Date(a.data) - new Date(b.data);
  const fila = state.posts.filter(p => ["Agendado", "Publicando"].includes(p.status)).sort(porData);
  const feitos = state.posts.filter(p => p.status === "Publicado").sort((a, b) => porData(b, a));
  const falhas = state.posts.filter(p => p.status === "Erro" && p.artesProntas).sort(porData);
  const grupo = (titulo, lista, vazio) => `<div class="agrupo"><span class="lbl">${titulo} · ${lista.length}</span>${lista.length ? lista.map(linhaAgend).join("") : `<div class="empty glass" style="padding:16px">${vazio}</div>`}</div>`;
  el.innerHTML = head + (M.modo !== "web" ? `<div class="msg" style="margin-bottom:14px">Para publicar na hora ou mudar a data, abra o painel pelo link do GitHub.</div>` : "")
    + grupo("Na fila de publicação", fila, "Nenhum post agendado. Aprove posts na Revisão.")
    + (falhas.length ? grupo("Falhou ao publicar", falhas, "") : "")
    + grupo("Publicados", feitos, "Nada publicado ainda.");
}

function cardIdeia(i) {
  let rodape;
  if (i.status === "Sugerida" || i.status === "Guardada") {
    rodape = abertoDescarte === i.id
      ? `<div class="reason"><label class="small" for="motivo-${i.id}">Por que descartar? (opcional, ajuda a IA a acertar mais)</label>
           <input id="motivo-${i.id}" placeholder="Ex.: tema fora do nosso público">
           <div class="actions"><button class="btn" data-act="descartar-ok" data-id="${i.id}">Descartar</button><button class="btn quiet" data-act="descartar-cancel">Cancelar</button></div></div>`
      : `<div class="actions"><button class="btn primary" data-act="aprovar" data-id="${i.id}">Levar para o calendário</button>
           ${i.status === "Sugerida" ? `<button class="btn" data-act="guardar" data-id="${i.id}">Guardar</button>` : ""}
           <button class="btn quiet" data-act="descartar" data-id="${i.id}">Descartar</button></div>`;
  } else if (i.status === "Aprovada") {
    const p = state.posts.find(x => i.posts.includes(x.id));
    rodape = `<div class="decided">${p ? `No calendário para <b>${fmtData(p.data)}</b>.` : "Aprovada. Entra no calendário em até 15 minutos, no próximo dia livre."}</div>`;
  } else {
    rodape = `<div class="actions"><span class="decided">Descartada${i.motivo ? `: “${esc(i.motivo)}”` : ""}</span><button class="btn quiet" data-act="restaurar" data-id="${i.id}">Desfazer</button></div>`;
  }
  return `<article class="idea glass ${i.status === "Descartada" ? "dim" : ""}">
    <div class="score"><span class="pill ${i.score < 6 ? "low" : ""}">aderência <strong>${i.score}</strong>/10</span><span class="bar" aria-hidden="true"><i style="width:${i.score * 10}%"></i></span></div>
    <h3>${esc(i.titulo)}</h3>
    <div class="meta"><span class="chip acc">${esc(i.formato)}</span><span class="chip plain">${esc(i.rede)}</span><span class="chip plain">${esc(i.pilar.split(":")[0])}</span></div>
    <p>${esc(i.resumo)}</p>
    ${i.porQue ? `<p class="why">${esc(i.porQue)}</p>` : ""}
    ${i.refs ? `<div class="src">baseada em ${i.refs} post${i.refs > 1 ? "s" : ""} de referência</div>` : ""}
    ${rodape}
  </article>`;
}

/* ---------- Calendário ---------- */
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
let mesVisto = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
function renderCal() {
  const el = document.getElementById("p-cal");
  const head = `<div class="panel-head"><p>Posts que vêm das ideias aprovadas. Clique em um post para ver os detalhes, mandar a IA criar ou tirar do calendário.</p></div>`;
  if (!pauta.carregada) { el.innerHTML = head + semPauta(); return; }
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const ano = mesVisto.getFullYear(), mes = mesVisto.getMonth();
  const doMes = (a, m) => state.posts.filter(p => { const d = new Date(p.data); return d.getFullYear() === a && d.getMonth() === m; });
  // Faixa de meses em páginas de 3 (trimestres), do ano passado ao ano que vem.
  const anoBase = hoje.getFullYear() - 1, paginas = [];
  for (let t = 0; t < 12; t++) {
    const meses = [0, 1, 2].map(k => { const a = anoBase + Math.floor((t * 3 + k) / 12), m = (t * 3 + k) % 12; return { a, m }; });
    paginas.push(`<div class="tri" data-tri="${t}">${meses.map(({ a, m }) => {
      const q = doMes(a, m).length;
      return `<button data-cal-mes="${a}-${m}" aria-pressed="${a === ano && m === mes}" class="${q ? "" : "vazio"}"><span>${MESES[m].slice(0, 3)} <small>${String(a).slice(2)}</small></span><b>${q}</b><i>${q === 1 ? "post" : "posts"}</i></button>`;
    }).join("")}</div>`);
  }
  const triAtual = Math.max(0, Math.min(11, (ano - anoBase) * 4 + Math.floor(mes / 3)));
  const inicio = new Date(ano, mes, 1); inicio.setDate(1 - ((inicio.getDay() + 6) % 7)); // segunda da 1ª semana
  const fimMes = new Date(ano, mes + 1, 0);
  const semanas = [];
  for (let w = 0; w < 6; w++) {
    const seg = new Date(inicio); seg.setDate(inicio.getDate() + w * 7);
    if (w > 3 && seg > fimMes) break;
    let dias = "";
    for (let d = 0; d < 7; d++) {
      const dia = new Date(seg); dia.setDate(seg.getDate() + d);
      const key = ymd(dia);
      const posts = state.posts.filter(p => ymd(new Date(p.data)) === key).sort((a, b) => new Date(a.data) - new Date(b.data));
      const cls = [key === ymd(hoje) ? "today" : dia < hoje ? "past" : "", dia.getMonth() !== mes ? "fora" : "", posts.length ? "" : "sem-post"].join(" ");
      dias += `<div class="day ${cls}"><div class="dlabel"><span>${DIAS[dia.getDay()]}</span><span>${doisDig(dia.getDate())}/${doisDig(dia.getMonth() + 1)}${key === ymd(hoje) ? " · hoje" : ""}</span></div>
        <div class="list">${posts.map(cardPost).join("")}</div></div>`;
    }
    semanas.push(`<div class="cal-week">${dias}</div>`);
  }
  const doMesAtual = doMes(ano, mes);
  el.innerHTML = head + `
    ${state.posts.length ? "" : `<div class="msg" style="margin-bottom:12px">Ainda não há posts no calendário. Leve uma ideia para o calendário na aba Ideias.</div>`}
    <div class="cal-nav">
      <h3>${MESES[mes][0].toUpperCase() + MESES[mes].slice(1)} de ${ano}</h3>
      <div class="actions"><button class="btn" data-cal="ant" aria-label="3 meses antes">‹</button><span class="tri-rotulo" id="tri-rotulo"></span><button class="btn" data-cal="prox" aria-label="Próximos 3 meses">›</button><button class="btn quiet" data-cal="hoje">Hoje</button></div>
    </div>
    <div class="ano" id="cal-ano" role="group" aria-label="Meses, de 3 em 3. Arraste para os lados." data-tri-atual="${triAtual}">${paginas.join("")}</div>
    <div class="cal glass">
      <div class="cal-head">${["seg", "ter", "qua", "qui", "sex", "sáb", "dom"].map(d => `<span>${d}</span>`).join("")}</div>
      ${semanas.join("")}
      ${doMesAtual.length ? "" : `<p class="small" style="padding:10px 6px;margin:0">Nenhum post em ${MESES[mes]}.</p>`}
    </div>
    ${detalhePost()}
    <div class="legend">${["Planejado", "EmCriacao", "EmRevisao", "Agendado", "Publicado", "Erro"].map(chip).join("")}</div>`;
  ligarFaixaMeses(triAtual);
}
// Faixa de trimestres: abre no trimestre do mês visto, as setas pulam 3 meses e o rótulo acompanha a rolagem.
let triVisto = null;
function ligarFaixaMeses(triAtual) {
  const faixa = document.getElementById("cal-ano"); if (!faixa) return;
  const ir = (t, suave) => faixa.scrollTo({ left: t * faixa.clientWidth, behavior: suave ? "smooth" : "auto" });
  const alvo = triVisto === null ? triAtual : triVisto;
  ir(alvo, false);
  // Com a aba escondida a faixa não tem largura; posiciona quando ela aparecer ou mudar de tamanho.
  let larg = faixa.clientWidth;
  new ResizeObserver(() => { if (faixa.clientWidth && faixa.clientWidth !== larg) { const t = larg ? Math.round(faixa.scrollLeft / larg) : alvo; larg = faixa.clientWidth; ir(t, false); rotulo(); } }).observe(faixa);
  const rotulo = () => {
    if (!faixa.clientWidth) return;
    const t = Math.round(faixa.scrollLeft / faixa.clientWidth); triVisto = t;
    const b = faixa.querySelectorAll(".tri")[t]; const r = document.getElementById("tri-rotulo");
    if (b && r) { const ms = [...b.querySelectorAll("[data-cal-mes]")].map(x => x.dataset.calMes.split("-").map(Number)); r.textContent = MESES[ms[0][1]].slice(0, 3) + " – " + MESES[ms[2][1]].slice(0, 3) + " " + ms[2][0]; }
  };
  rotulo();
  faixa.addEventListener("scroll", () => { clearTimeout(faixa._t); faixa._t = setTimeout(rotulo, 80); }, { passive: true });
  // Arrastar com o mouse também passa os trimestres.
  let x0 = null, s0 = 0, moveu = false;
  faixa.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") return; x0 = e.clientX; s0 = faixa.scrollLeft; moveu = false; });
  faixa.addEventListener("pointermove", e => { if (x0 === null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 6) { moveu = true; faixa.style.scrollSnapType = "none"; faixa.scrollLeft = s0 - dx; } });
  const soltar = () => { if (x0 === null) return; x0 = null; faixa.style.scrollSnapType = ""; if (moveu) ir(Math.round(faixa.scrollLeft / faixa.clientWidth), true); };
  faixa.addEventListener("pointerup", soltar); faixa.addEventListener("pointerleave", soltar);
  faixa.addEventListener("click", e => { if (moveu) { e.stopPropagation(); e.preventDefault(); moveu = false; } }, true);
}
document.addEventListener("click", e => {
  const m = e.target.closest("[data-cal-mes]");
  const n = e.target.closest("[data-cal]");
  if (!m && !n) return;
  const faixa = document.getElementById("cal-ano");
  if (!m && faixa && (n.dataset.cal === "ant" || n.dataset.cal === "prox")) {
    // As setas só passam a faixa de 3 em 3 meses; o mês aberto muda quando você clica em um deles.
    const t = Math.round(faixa.scrollLeft / faixa.clientWidth) + (n.dataset.cal === "prox" ? 1 : -1);
    faixa.scrollTo({ left: Math.max(0, t) * faixa.clientWidth, behavior: "smooth" });
    return;
  }
  if (m) { const [a, mm] = m.dataset.calMes.split("-").map(Number); mesVisto = new Date(a, mm, 1); }
  else { const d = new Date(); mesVisto = new Date(d.getFullYear(), d.getMonth(), 1); triVisto = null; }
  renderCal();
});
function cardPost(p) {
  return `<button class="post s-${esc(p.status)} ${flashId === p.id ? "flash" : ""} ${calAberto === p.id ? "sel" : ""}" data-act="abrir" data-id="${p.id}" aria-expanded="${calAberto === p.id}">
    <span class="pt">${esc(p.titulo)}</span>
    <span class="pm">${String(new Date(p.data).getHours()).padStart(2, "0")}h · ${esc(p.rede)} · ${esc(p.formato)}</span>
    ${criando(p.id) ? `<span class="chip warn">IA criando…</span>` : chip(p.status)}
  </button>`;
}
function detalhePost() {
  const p = state.posts.find(x => x.id === calAberto);
  if (!p) return "";
  const video = ["Reels", "Stories"].includes(p.formato);
  let acao = "";
  if (criando(p.id)) acao = `<div class="working"><span class="dot"></span>A IA está criando este post. Em 2 a 4 minutos ele aparece na Revisão.</div>`;
  else if (["Planejado", "Erro"].includes(p.status)) {
    acao = M.modo === "web"
      ? `<div class="actions"><button class="btn primary" data-act="criar-post" data-id="${p.id}">${p.status === "Erro" ? "Tentar criar de novo" : "Criar este post"}</button></div>
         <p class="small" style="margin:0">Antes de começar, você escolhe capa, fundos e quantidade de ${video ? "cenas" : "slides"}. ${video ? "A IA escreve a legenda e as cenas, e o Magnific gera os clipes." : "A IA escreve a legenda e os slides e o Magnific gera as imagens."} Depois o post vai para a Revisão.</p>`
      : `<div class="msg">Para mandar a IA criar este post, abra o painel pelo link do GitHub.</div>`;
  } else if (["EmRevisao", "Ajustes"].includes(p.status)) acao = `<div class="actions"><button class="btn primary" data-act="ver-revisao" data-id="${p.id}">Ver na Revisão</button></div>`;
  else if (p.link) acao = `<div class="actions"><a class="btn" href="${esc(p.link)}" target="_blank" rel="noopener">Ver post publicado</a></div>`;
  if (!["Publicado", "Publicando"].includes(p.status) && !criando(p.id)) acao += `<div class="actions" style="justify-content:flex-start"><button class="btn" data-act="mudar-data" data-id="${p.id}">Mudar data</button></div>`;
  if (p.status !== "Publicado" && !criando(p.id)) acao += `<div class="actions" style="justify-content:flex-start"><button class="btn quiet" data-act="remover-post" data-id="${p.id}">Remover do calendário</button></div>`;

function prepararFoto(f) {
  return new Promise((ok, falha) => {
    if (f.size < 1.5 * 1024 * 1024 && ["image/jpeg", "image/png", "image/webp"].includes(f.type)) return arquivoBase64(f).then(b => ok({ tipo: f.type, base64: b }), falha);

    };

  });

// Barras empilhadas do gasto por dia (só a chave da plataforma), com dica ao passar o mouse.
const larguraGrafico = () => { const el = document.getElementById("p-admin"); return Math.max(320, Math.min(760, ((el && el.clientWidth) || 760) - 34)); };
function graficoGasto(serie) {
  const W = larguraGrafico(), H = W < 500 ? 240 : 220, m = { e: 48, d: 8, t: 10, b: 26 }, iw = W - m.e - m.d, ih = H - m.t - m.b;
  const totais = serie.map(s => SERVICOS.reduce((a, x) => a + (s[x.k] || 0), 0));
  const max = Math.max(0.01, ...totais), passo = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100, 250, 500].find(p => max / p <= 4) || Math.ceil(max / 4);
  const topo = Math.ceil(max / passo) * passo, y = v => m.t + ih - (v / topo) * ih, bw = iw / serie.length, larg = Math.max(2, bw - 4);
  const grade = []; for (let v = 0; v <= topo + 1e-9; v += passo) grade.push(`<line x1="${m.e}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" class="ad-grade"/><text x="${m.e - 6}" y="${y(v) + 4}" class="ad-eixo" text-anchor="end">${v < 1 ? v.toFixed(2).replace(".", ",") : num(v)}</text>`);
  const barras = serie.map((s, i) => {
    const x = m.e + i * bw + (bw - larg) / 2; let base = m.t + ih; const partes = [];
    SERVICOS.forEach(sv => { const v = s[sv.k] || 0; if (v <= 0) return; const h = Math.max(1, (v / topo) * ih); base -= h; partes.push(`<rect x="${x}" y="${base}" width="${larg}" height="${Math.max(0.5, h - 2)}" rx="2" fill="${sv.cor}"/>`); });
    const dica = `${diaCurto(s.dia)}: ${usd(totais[i])}` + SERVICOS.filter(sv => s[sv.k] > 0).map(sv => ` · ${sv.nome} ${usd(s[sv.k])}`).join("");
    return `<g class="ad-col"><rect x="${m.e + i * bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"><title>${esc(dica)}</title></rect>${partes.join("")}${(serie.length - 1 - i) % (W < 500 ? 7 : 5) === 0 ? `<text x="${x + larg / 2}" y="${H - 8}" class="ad-eixo" text-anchor="middle">${diaCurto(s.dia)}</text>` : ""}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="ad-svg" role="img" aria-label="Gasto por dia nos últimos 30 dias, por serviço">${grade.join("")}${barras}<line x1="${m.e}" x2="${W - m.d}" y1="${m.t + ih}" y2="${m.t + ih}" class="ad-base"/></svg>`;
}
function graficoNovos(lista) {
  const W = Math.min(larguraGrafico(), 520), H = 170, m = { e: 30, d: 8, t: 10, b: 24 }, iw = W - m.e - m.d, ih = H - m.t - m.b;
  const max = Math.max(1, ...lista.map(x => x.n)), bw = iw / lista.length, larg = Math.max(2, bw - 4), y = v => m.t + ih - (v / max) * ih;
  return `<svg viewBox="0 0 ${W} ${H}" class="ad-svg" role="img" aria-label="Novos usuários por dia nos últimos 30 dias">
    <line x1="${m.e}" x2="${W - m.d}" y1="${y(max)}" y2="${y(max)}" class="ad-grade"/><text x="${m.e - 6}" y="${y(max) + 4}" class="ad-eixo" text-anchor="end">${max}</text>
    ${lista.map((x, i) => `<g class="ad-col"><rect x="${m.e + i * bw}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"><title>${diaCurto(x.dia)}: ${x.n} novo${x.n === 1 ? "" : "s"}</title></rect>${x.n ? `<rect x="${m.e + i * bw + (bw - larg) / 2}" y="${y(x.n)}" width="${larg}" height="${m.t + ih - y(x.n)}" rx="2" fill="${SERVICOS[0].cor}"/>` : ""}${(lista.length - 1 - i) % 7 === 0 ? `<text x="${m.e + i * bw + bw / 2}" y="${H - 7}" class="ad-eixo" text-anchor="middle">${diaCurto(x.dia)}</text>` : ""}</g>`).join("")}
    <line x1="${m.e}" x2="${W - m.d}" y1="${m.t + ih}" y2="${m.t + ih}" class="ad-base"/></svg>`;
}
