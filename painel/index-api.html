          <span class="actions"><input id="m-novo-pilar" placeholder="Novo pilar" style="max-width:220px"><button type="button" class="btn quiet" data-m="add-pilar">+ Adicionar</button></span></div>
        <div class="field full"><span>Redes onde publica</span>${toggles("m-redes", OPC.Redes, red)}</div>
        <label class="field"><span>Perfil nas redes (@)</span><input id="m-perfil" placeholder="@suamarca" value="${esc(m.Perfil ? "@" + String(m.Perfil).replace(/^@+/, "") : "")}"></label>
        <label class="field"><span>Idioma das postagens</span><select id="m-idioma">${opcoes(OPC.Idioma, selNome(m.Idioma) || "Português (Brasil)")}</select></label>
        <div class="field full"><span>Cores da marca${ajuda("cores")}</span>
          <div class="paleta" id="m-paleta" aria-hidden="true">${lerCores(m.Cores).map(c => `<i style="background:${c.hex}"></i>`).join("")}</div>
          <div class="cores" id="m-cores">${lerCores(m.Cores).map(linhaCor).join("")}</div>
          <span class="actions"><button type="button" class="btn quiet" data-m="add-cor">+ Adicionar cor</button></span></div>
        <div class="field full"><span>Logos${ajuda("logos")}</span>
          <label class="check-tratar"><input type="checkbox" id="m-tratar" ${tratarLogos ? "checked" : ""}> Tratar ao enviar: tirar o fundo, recortar as sobras e criar a versão light ou dark que faltar</label>
          <div class="logos">${slotLogo(m, "Logo", "Logo light", "Para fundos escuros", "escuro")}${slotLogo(m, "LogoDark", "Logo dark", "Para fundos claros", "claro")}${slotLogo(m, "SimboloLight", "Símbolo light", "Só o símbolo, fundos escuros", "escuro")}${slotLogo(m, "SimboloDark", "Símbolo dark", "Só o símbolo, fundos claros", "claro")}</div>
          <p class="hint" style="margin:0">Nas artes, o painel usa a versão que contrasta com o fundo de cada imagem. PNG ou SVG com fundo transparente, até 5 MB.</p></div>
        <div class="field full"><span>Mood board (opcional)${ajuda("mood")}</span>
          <div class="mood">${(m.MoodBoard || []).map(a => `<figure><img src="${esc(urlArq(a))}" alt="" onerror="this.style.display='none'"><button type="button" data-m="mood-rm" data-id="${esc(a.id)}" aria-label="Remover imagem">✕</button></figure>`).join("")}</div>
          <span class="actions"><label class="btn quiet" ${M.modo === "web" ? "" : "hidden"}>+ Adicionar imagens<input type="file" class="arquivo-oculto" data-arquivo="MoodBoard" accept="image/png,image/jpeg,image/webp" multiple></label></span>
          <p class="hint" style="margin:0">Referências visuais da marca: fotos, texturas, paletas. A IA usa como direção de arte ao criar as fotos e os vídeos.${M.modo === "web" ? "" : " Para enviar arquivos, abra pelo link do GitHub ou arraste no campo MoodBoard do Airtable."}</p></div>
        <label class="field full"><span>O que evitar</span><textarea id="m-evitar" placeholder="Assuntos, palavras e estilos proibidos">${esc(m.Evitar || "")}</textarea></label>
        <label class="field"><span>Posts por semana</span><input id="m-freq" type="number" min="0" max="50" value="${m.FrequenciaSemanal ?? ""}"></label>
        <label class="field full"><span>Exemplos de posts que representam a marca (links)</span><textarea id="m-exemplos">${esc(m.ExemplosBons || "")}</textarea></label>
      </div>
      <div id="m-aviso"></div>
      <div class="actions" style="justify-content:flex-end"><button class="btn primary" data-m="salvar-marca">Salvar marca</button></div>
    </form>
    <section class="glass box">
      <div class="actions" style="justify-content:space-between"><h2>Fontes${ajuda("fontes")}</h2><button class="btn" data-m="nova-fonte">+ Nova fonte</button></div>
      <p class="hint">A coleta lê as fontes ativas quando você clica em Buscar ideias novas, na aba Ideias.</p>
      <div class="fontes" id="m-fontes"></div>
    </section>
  </div>
  <section class="glass box banco atalho-banco" style="margin-top:14px">
    <div><h2>Banco de imagens e vídeos${ajuda("banco")}</h2>
    <p class="hint" style="margin:0">Suas fotos e vídeos e tudo que a IA já gerou nos posts. Também fica no menu do perfil.</p></div>
    <button class="btn" type="button" data-tab="banco">Abrir o banco →</button>
  </section>`;
  renderFontes(); renderStatus();
}
// Página do banco (menu do perfil › Banco de imagens). A estrutura é montada uma vez; a lista se redesenha sozinha.
function renderBancoPagina() {
  const el = document.getElementById("p-banco"); if (!el) return;
  if (M.modo !== "web") { el.innerHTML = `<div class="glass empty">O banco de imagens e vídeos fica no painel web.</div>`; return; }
  if (!el.querySelector("#banco-lista")) el.innerHTML = `<section class="glass box banco">
    <div class="actions" style="justify-content:space-between"><h2>Seus arquivos${ajuda("banco")}</h2><span class="small" id="banco-status"></span></div>
    <p class="hint">Fotos e vídeos que você envia (produtos, loja, equipe) e tudo que a IA gera nos posts, guardado sozinho com o selo IA. Use em <b>Criar post › Imagens › Do meu banco</b> ou em <b>Revisão › Imagens do post › Trocar pelo banco</b>, sem gastar créditos.</p>
    <label class="bi-zona" id="banco-zona"><input type="file" id="banco-arquivos" class="arquivo-oculto" accept="image/jpeg,image/png,image/webp,video/mp4" multiple>
      <b>Arraste fotos e vídeos para cá ou clique para escolher</b><span class="small">Fotos em JPG, PNG ou WEBP; vídeos em MP4 de até 25 MB. A IA descreve cada foto para escolher a certa em cada post.</span></label>
    <div class="seg bi-filtros" id="banco-filtros" role="group" aria-label="Filtrar o banco"></div>
    <div class="bi-grade" id="banco-lista"></div>
  </section>`;
  desenharBanco();
}

function pintarPaleta() {
  const p = document.getElementById("m-paleta"); if (!p) return;
  p.innerHTML = [...document.querySelectorAll("#m-cores .hex")].map(i => i.value.trim()).filter(h => /^#[0-9a-f]{6}$/i.test(h)).map(h => `<i style="background:${h}"></i>`).join("");
}
document.addEventListener("input", e => {
  if (!e.target.closest("#m-form")) return;
  M.marcaSuja = true; M.aviso = null;
  const linha = e.target.closest(".cor");
  if (linha && e.target.type === "color") linha.querySelector(".hex").value = e.target.value.toUpperCase();
  if (linha && e.target.classList.contains("hex") && /^#[0-9a-f]{6}$/i.test(e.target.value.trim())) linha.querySelector('input[type="color"]').value = e.target.value.trim().toLowerCase();
  if (linha) pintarPaleta();
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-m]"); if (!b) return;
  const a = b.dataset.m, id = b.dataset.id;
  if (a === "toggle") { b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); M.marcaSuja = true; M.aviso = null; return renderStatus(); }
  if (a === "add-pilar") { const n = v("m-novo-pilar"); if (n) { M.pilaresExtra.push(n); const box = document.getElementById("m-pilares"); box.insertAdjacentHTML("beforeend", `<button type="button" data-m="toggle" data-valor="${esc(n)}" aria-pressed="true">${esc(n)}</button>`); document.getElementById("m-novo-pilar").value = ""; M.marcaSuja = true; renderStatus(); } return; }
  if (a === "add-cor") { document.getElementById("m-cores").insertAdjacentHTML("beforeend", linhaCor({ hex: "#FF3347", nome: "" })); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "rm-cor") { b.closest(".cor").remove(); M.marcaSuja = true; pintarPaleta(); return renderStatus(); }
  if (a === "salvar-marca") return salvarMarca();
  if (a === "logo-rm") { if (await executar("salvarMarca", { id: M.marca.id, campos: { [id]: [] } }, "Arquivo removido.")) renderMarca(); return; }
  if (a === "mood-rm") {
    const resto = (M.marca.MoodBoard || []).filter(x => x.id !== id).map(x => ({ id: x.id }));
    if (await executar("salvarMarca", { id: M.marca.id, campos: { MoodBoard: resto } }, "Imagem removida do mood board.")) renderMarca();
    return;
  }
  if (a === "tentar") return tentarDeNovo();
  if (a === "nova-fonte") { M.editando = "novo"; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "editar") { M.editando = id; M.remover = null; renderFontes(); return document.getElementById("f-nome")?.focus(); }
  if (a === "cancelar-fonte") { M.editando = null; return renderFontes(); }
  if (a === "ativa-form") { b.setAttribute("aria-checked", b.getAttribute("aria-checked") !== "true"); return; }
  if (a === "salvar-fonte") return salvarFonte();
  if (a === "ativa") {
    const x = M.fontes.find(y => y.id === id); if (!x || M.ocupado) return;
    const nova = x.Ativa !== true; x.Ativa = nova; renderFontes();
    const ok = await executar("salvarFonte", { id, campos: { Ativa: nova } }, nova ? "Fonte ativada." : "Fonte pausada.");
    if (!ok) { x.Ativa = !nova; renderFontes(); }
    return;
  }
  if (a === "remover") { M.remover = id; return renderFontes(); }
  if (a === "remover-nao") { M.remover = null; return renderFontes(); }
  if (a === "remover-ok") {
    const ok = await executar("removerFonte", { id }, "Fonte removida.");
    if (ok) { M.fontes = M.fontes.filter(y => y.id !== id); M.remover = null; renderFontes(); }
  }
});

(async () => {
  renderMarca();
  const c = window.claude;
  M.mcp = c && typeof c.use === "function" ? await c.use("mcp").catch(() => null) : null;
  if (M.mcp) return conectar();
  // Fora do claude.ai (ex.: GitHub Pages): conta, organização e pauta pela API da plataforma.
  M.modo = "web";
  if (U.convite) {
    try { U.conviteInfo = (await chamar({ acao: "verConvite", convite: U.convite }, false)).convite; U.tela = U.conviteInfo.temConta ? "login" : "cadastro"; }
    catch (e) { U.erro = textoErro(e); U.convite = null; try { history.replaceState(null, "", location.pathname); } catch (x) {} }
  }
  const salva = sessao.ler();
  if (salva && salva.token) {
    U.token = salva.token;
    try {
      guardarInfo(await chamar({ acao: "eu" }));
      if (U.convite) return depoisDeEntrar({ token: U.token }, true);
      await iniciarWeb();
      return voltouDaConexao();
    } catch (e) { if (e.login) { sessao.apagar(); U.token = ""; } else { U.erro = textoErro(e); } }
  }
  M.conexao = "login"; renderMarca(); renderAuth();
})();

render();
// Fora do claude.ai, atualiza a pauta a cada 90 s enquanto a página está aberta.
setInterval(() => { if (M.modo === "web" && U.token && !document.hidden) carregarPauta(); }, 90000);
</script>
